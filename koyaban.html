<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小屋番｜ハイカーズカード</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  .ad-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .08em; color: var(--c-fg2); border: 1px solid var(--c-div); border-radius: 999px; padding: 3px 10px; }
  .ad-badge svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* 検索条件 */
  .ad-search { margin-top: 16px; position: relative; }
  .ad-search input { width: 100%; font-family: var(--font); font-size: 15px; color: var(--c-fg);
    background: var(--c-bg); border: 1.5px solid var(--c-div); border-radius: 14px; padding: 13px 14px 13px 42px; outline: none; }
  .ad-search input:focus { border-color: var(--c-fg); }
  .ad-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px;
    fill: none; stroke: var(--c-mut); stroke-width: 2; stroke-linecap: round; }
  .ad-hint { font-size: 11px; color: var(--c-mut); margin-top: 6px; line-height: 1.7; }
  .ad-filters { display: flex; gap: 8px; margin-top: 10px; }
  .ad-filters select { flex: 1; min-width: 0; font-family: var(--font); font-size: 13px; color: var(--c-fg);
    background: var(--c-bg); border: 1.5px solid var(--c-div); border-radius: 12px; padding: 10px 12px; }

  .ad-count { display: flex; align-items: baseline; gap: 8px; margin-top: 18px; font-size: 12px; color: var(--c-mut); }
  .ad-count b { font-family: var(--mono); font-size: 22px; color: var(--c-fg); }

  /* 結果 */
  .ad-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .ad-row { background: var(--c-bg); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px -8px rgba(0,0,0,.12); }
  .ad-top { display: flex; align-items: center; gap: 10px; }
  .ad-av { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; background: var(--c-soft); }
  .ad-av svg { width: 100%; height: 100%; display: block; }
  .ad-who { flex: 1; min-width: 0; }
  .ad-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad-name.unset { color: var(--c-mut); font-weight: 500; }
  .ad-sub { font-size: 11px; color: var(--c-mut); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad-sub b { font-family: var(--mono); color: var(--c-fg2); letter-spacing: .06em; }
  .ad-tag { font-size: 9.5px; font-weight: 700; border-radius: 999px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
  .ad-tag.admin { background: var(--c-chip); color: var(--c-chipfg); }
  .ad-tag.rep { background: #F6E1DE; color: #9A3B2E; }

  .ad-url { display: flex; align-items: center; gap: 6px; margin-top: 10px;
    background: var(--c-soft); border-radius: 10px; padding: 6px 6px 6px 10px; }
  .ad-url a { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c-fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
  .ad-url a:hover { text-decoration: underline; }
  .ad-url a.dead { color: var(--c-mut); }
  .ad-copy { flex: none; font-family: var(--font); font-size: 11px; font-weight: 700; cursor: pointer;
    border: none; border-radius: 8px; padding: 6px 10px; background: var(--c-bg); color: var(--c-fg); }
  .ad-copy.done { background: var(--c-chip); color: var(--c-chipfg); }

  .ad-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 10.5px; color: var(--c-mut); }
  .ad-meta b { color: var(--c-fg2); font-family: var(--mono); font-weight: 600; }

  .ad-more { margin-top: 12px; }
  .ad-empty { text-align: center; font-size: 12.5px; color: var(--c-mut); padding: 30px 0; }

  .ad-deny { text-align: center; padding: 60px 10px; }
  .ad-deny svg { width: 44px; height: 44px; fill: none; stroke: var(--c-mut); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ad-deny p { font-size: 13px; color: var(--c-fg2); margin-top: 12px; line-height: 1.9; }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <!-- 管理者でないとき -->
  <div id="deny" class="ad-deny" hidden>
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <p>このページは管理者だけが見られます。</p>
    <button class="btn ghost" onclick="location.href='/card.html'">マイカードへ</button>
  </div>

  <div id="main" hidden>
    <span class="ad-badge"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>小屋番</span>
    <h1 style="margin-top:8px">ユーザー検索</h1>

    <div class="ad-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="名前・公開ID・メール・タイプ・No." autocomplete="off">
    </div>
    <p class="ad-hint">名前・公開ID・メールアドレスは部分一致。「EGFC」のようにタイプを入れるとそのタイプ、数字だけならカードNo.で探します。</p>

    <div class="ad-filters">
      <select id="type" aria-label="診断タイプで絞り込む"></select>
      <select id="sort" aria-label="並び順">
        <option value="new">登録が新しい順</option>
        <option value="old">登録が古い順</option>
        <option value="no">カードNo.順</option>
        <option value="name">名前順</option>
      </select>
    </div>

    <p class="ad-count" id="count"></p>
    <div class="ad-list" id="list"></div>
    <button class="btn ghost ad-more" id="more" hidden>もっと見る</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>
<script src="/data.js"></script>
<script src="/characters.js"></script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme, esc, SILHOUETTE, cardNo } from "./card.js";

const $ = (s) => document.querySelector(s);
const PAGE = 50;

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

const profile = await getMyProfile();
mountHeader(signOut, { shareId: profile?.public_id });
if (profile?.card_bg) applyTheme(profile.card_bg);

// ---------------------------------------------
// 管理者かどうか。データは検索のたびにDB側でも確かめているので、
// ここは「管理者でない人に空の画面を見せない」ための表示の切り替えだけ
// ---------------------------------------------
const { data: isAdmin, error: adminErr } = await supabase.rpc("is_admin");
$("#loading").hidden = true;
if (adminErr || !isAdmin) {
  $("#deny").hidden = false;
  // ここで処理を止める（エラーにすると、画面にエラー表示が出てしまうため、終わらない待ちで止める）
  await new Promise(() => {});
}
$("#main").hidden = false;

// タイプの選択肢（16タイプ＋未診断）
$("#type").innerHTML = `<option value="">すべてのタイプ</option>` +
  Object.keys(TYPES).sort().map((c) =>
    `<option value="${c}">${c}｜${esc(CHARACTERS[c]?.animal ?? "")}・${esc(TYPES[c].name)}</option>`).join("") +
  `<option value="none">未診断</option>`;

// ---------------------------------------------
// 検索
// ---------------------------------------------
let items = [];
let total = 0;
let seq = 0;          // 古い検索結果で上書きしないための番号

async function search(append = false) {
  const my = ++seq;
  const { data, error } = await supabase.rpc("admin_search_users", {
    p_query: $("#q").value,
    p_type: $("#type").value || null,
    p_sort: $("#sort").value,
    p_limit: PAGE,
    p_offset: append ? items.length : 0,
  });
  if (my !== seq) return;   // 入力中に次の検索が始まっていたら捨てる

  const msg = $("#msg");
  if (error) {
    msg.className = "msg error";
    msg.textContent = error.message.includes("forbidden")
      ? "管理者の権限がありません。" : "検索できませんでした：" + error.message;
    return;
  }
  msg.className = "msg"; msg.textContent = "";

  items = append ? items.concat(data.items) : data.items;
  total = data.total;
  $("#count").innerHTML = `<b>${total}</b>人${total !== data.all ? `（全${data.all}人中）` : ""}`;
  $("#list").innerHTML = items.length ? items.map(rowHtml).join("")
    : `<p class="ad-empty">見つかりませんでした。</p>`;
  $("#more").hidden = items.length >= total;
}

// 入力が止まってから検索する（1文字ごとに問い合わせない）
let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(), 300); });
$("#type").addEventListener("change", () => search());
$("#sort").addEventListener("change", () => search());
$("#more").addEventListener("click", () => search(true));

// ---------------------------------------------
// 1人分の表示
// ---------------------------------------------
const fmt = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
};

function rowHtml(u) {
  const url = `${location.origin}/u/${u.public_id}`;
  const named = !!u.display_name;
  const diag = u.type_code && TYPES[u.type_code];
  return `
    <div class="ad-row">
      <div class="ad-top">
        <div class="ad-av">${diag ? characterSVG(u.type_code) : SILHOUETTE}</div>
        <div class="ad-who">
          <p class="ad-name${named ? "" : " unset"}">${named ? esc(u.display_name) : "（表示名が未設定）"}${
            u.is_admin ? `<span class="ad-tag admin">管理者</span>` : ""}${
            u.reports_open ? `<span class="ad-tag rep">通報 ${u.reports_open}</span>` : ""}</p>
          <p class="ad-sub"><b>${cardNo(u.card_no, "No.未発行")}</b> ・ ${
            diag ? `${esc(u.type_code)} ${esc(CHARACTERS[u.type_code]?.animal ?? "")}` : "未診断"} ・ ${esc(u.email ?? "")}</p>
        </div>
      </div>
      <div class="ad-url">
        <a href="${esc(url)}" target="_blank" rel="noopener" class="${named ? "" : "dead"}"
           title="${named ? "" : "表示名が未設定のため、公開ページは表示されません"}">${esc(url.replace(/^https?:\/\//, ""))}</a>
        <button class="ad-copy" data-url="${esc(url)}">コピー</button>
      </div>
      <div class="ad-meta">
        <span>登録 <b>${fmt(u.created_at)}</b></span>
        <span>最終ログイン <b>${fmt(u.last_sign_in_at)}</b></span>
        <span>登った山 <b>${u.climbed}</b></span>
        <span>交換 <b>${u.exchanges}</b></span>
      </div>
    </div>`;
}

// URLのコピー
$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest(".ad-copy");
  if (!b) return;
  try {
    await navigator.clipboard.writeText(b.dataset.url);
    b.textContent = "コピー済み"; b.classList.add("done");
    setTimeout(() => { b.textContent = "コピー"; b.classList.remove("done"); }, 1500);
  } catch {
    prompt("このURLをコピーしてください", b.dataset.url);
  }
});

search();
$("#q").focus();
</script>
</body>
</html>
