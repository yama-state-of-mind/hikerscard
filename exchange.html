<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カードを交換する｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
/* ---------- タブ ---------- */
.tabs {
  display: flex; gap: 6px; background: #E2E9E4;
  border-radius: 999px; padding: 4px; margin-top: 18px;
}
.tab {
  flex: 1; font-family: var(--font); font-size: 13px; font-weight: 700;
  border: none; background: transparent; color: var(--stone);
  border-radius: 999px; padding: 9px 0; cursor: pointer;
}
.tab.on { background: var(--paper); color: var(--pine); box-shadow: var(--shadow-card); }

/* ---------- QR ---------- */
.qr-box {
  background: var(--paper); border-radius: 22px;
  box-shadow: 0 8px 26px rgba(30,58,49,.16);
  padding: 24px 20px 20px; margin-top: 18px; text-align: center;
}
.qr-img {
  width: 220px; height: 220px; margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
}
.qr-img svg { width: 100%; height: 100%; display: block; }

.qr-expired {
  width: 220px; height: 220px; margin: 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background: #EDF3EF; border-radius: 16px;
  color: var(--stone); font-size: 12.5px; text-align: center; line-height: 1.8;
}

.countdown {
  font-family: var(--mono); font-size: 15px; font-weight: 700;
  letter-spacing: 1px; margin-top: 14px;
}
.countdown.warn { color: #B5533A; }
.countdown small {
  display: block; font-family: var(--font); font-size: 11px;
  font-weight: 400; color: var(--stone); letter-spacing: 0; margin-top: 2px;
}

.qr-code-txt {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 2px; background: #EDF3EF; border-radius: 10px;
  padding: 8px 14px; display: inline-block; margin-top: 14px;
  word-break: break-all;
}

/* ---------- カメラ ---------- */
.cam-box {
  position: relative; width: 100%; aspect-ratio: 1;
  background: #23332C; border-radius: 22px; overflow: hidden; margin-top: 18px;
}
.cam-box video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.cam-frame {
  position: absolute; inset: 14%;
  border: 3px solid rgba(255,255,255,.8); border-radius: 18px;
  box-shadow: 0 0 0 1000px rgba(0,0,0,.28);
}
.cam-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: #DCE9E1; font-size: 12.5px; text-align: center; padding: 30px;
  line-height: 1.9;
}

/* ---------- 交換成立 ---------- */
.done-box { text-align: center; padding-top: 10px; }
.done-char { width: 120px; height: 120px; margin: 0 auto 10px; }
.done-char svg { width: 100%; height: 100%; }
.done-name { font-size: 22px; font-weight: 900; }
.done-type { font-size: 12.5px; font-weight: 700; color: var(--fjord); margin-top: 2px; }
.done-lead {
  font-size: 13px; color: #45564e; margin-top: 14px; line-height: 1.9;
}
.done-lead b { color: var(--pine); }
</style>
</head>
<body>

<div class="wrap">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <p class="brand">ハイカーズ<span>カード</span></p>
    <h1>カードを交換する</h1>
    <p class="sub">会った人とその場で交換します。<br>QRの有効期限は10分です。</p>

    <div class="tabs">
      <button class="tab on" data-tab="show">見せる</button>
      <button class="tab"    data-tab="scan">読み取る</button>
    </div>

    <!-- ===== 見せる ===== -->
    <div id="pane-show">
      <div class="qr-box">
        <div id="qr" class="qr-img"></div>
        <p class="countdown" id="countdown"></p>
        <p class="qr-code-txt" id="code-txt" hidden></p>
      </div>
      <p class="hint">
        相手にこのQRを読み取ってもらうと、<b>お互いのコレクションにカードが入ります</b>。<br>
        読み取れないときは、下のURLを送っても交換できます。
      </p>
      <button class="btn ghost" id="copy-url">交換用URLをコピー</button>
      <button class="btn flat"  id="reissue">QRを作り直す</button>
    </div>

    <!-- ===== 読み取る ===== -->
    <div id="pane-scan" hidden>
      <div class="cam-box" id="cam-box">
        <video id="video" playsinline muted></video>
        <div class="cam-frame" id="cam-frame" hidden></div>
        <div class="cam-msg" id="cam-msg">
          <p>カメラで相手のQRを読み取ります。</p>
          <button class="btn sun" id="start-cam" style="width:auto;padding:11px 26px">
            カメラを起動する
          </button>
        </div>
      </div>

      <div class="field">
        <label>うまく読めないときは、コードを直接入力</label>
        <input type="text" id="manual" placeholder="16文字のコード" autocomplete="off">
      </div>
      <button class="btn ghost" id="manual-go">このコードで交換する</button>
    </div>

    <div id="msg" class="msg"></div>
    <button class="btn flat" id="back">もどる</button>
  </div>

  <!-- ===== 交換成立 ===== -->
  <div id="done" hidden class="done-box">
    <p class="brand">ハイカーズ<span>カード</span></p>
    <div class="done-char" id="done-char"></div>
    <p class="done-name" id="done-name"></p>
    <p class="done-type" id="done-type"></p>
    <p class="done-lead" id="done-lead"></p>
    <button class="btn sun"   id="go-collection">コレクションを見る</button>
    <button class="btn ghost" id="again">続けて交換する</button>
  </div>
</div>

<script src="./data.js"></script>
<script src="./characters.js"></script>

<script type="module">
import qrcode from "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm";
import jsQR from "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/+esm";
import { supabase, getUser, getMyProfile } from "./supabase.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) location.replace("./login.html");

const profile = await getMyProfile();
if (!profile?.display_name) location.replace("./setup.html");

$("#loading").hidden = true;
$("#main").hidden = false;

// =============================================
// タブの切り替え
// =============================================
document.querySelector(".tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const name = tab.dataset.tab;

  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === tab));
  $("#pane-show").hidden = name !== "show";
  $("#pane-scan").hidden = name !== "scan";

  // 見せる側に戻ったらカメラを止める（つけっぱなしにしない）
  if (name !== "scan") stopCamera();
});

// =============================================
// QRの発行
// =============================================
let expiresAt = null;
let timer = null;
let exchangeUrl = "";

await issue();

async function issue() {
  $("#qr").innerHTML = `<div class="spinner"></div>`;
  $("#countdown").textContent = "";

  const { data, error } = await supabase.rpc("issue_exchange_token");

  if (error) {
    $("#qr").innerHTML = "";
    showMsg("error", "QRを作れませんでした：" + error.message);
    return;
  }

  exchangeUrl = `${location.origin}/x/${data.token}`;
  expiresAt = new Date(data.expires_at);

  const qr = qrcode(0, "M");
  qr.addData(exchangeUrl);
  qr.make();
  $("#qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 1, scalable: true });

  $("#code-txt").textContent = data.token;
  $("#code-txt").hidden = false;

  startCountdown();
}

function startCountdown() {
  clearInterval(timer);
  tick();
  timer = setInterval(tick, 1000);
}

function tick() {
  const left = Math.floor((expiresAt - Date.now()) / 1000);

  if (left <= 0) {
    clearInterval(timer);
    $("#qr").innerHTML = `
      <div class="qr-expired">
        <p>有効期限が切れました</p>
      </div>`;
    $("#countdown").innerHTML = `<small>作り直してください</small>`;
    $("#countdown").classList.remove("warn");
    $("#code-txt").hidden = true;
    return;
  }

  const m = String(Math.floor(left / 60)).padStart(2, "0");
  const s = String(left % 60).padStart(2, "0");
  $("#countdown").innerHTML = `${m}:${s}<small>のこり時間</small>`;
  $("#countdown").classList.toggle("warn", left <= 60);
}

$("#reissue").onclick = () => issue();

$("#copy-url").onclick = async () => {
  try {
    await navigator.clipboard.writeText(exchangeUrl);
    showMsg("success", "交換用URLをコピーしました。");
  } catch {
    showMsg("error", "コピーできませんでした。");
  }
};

// =============================================
// カメラでの読み取り
// =============================================
let stream = null;
let scanning = false;
const video = $("#video");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

$("#start-cam").onclick = startCamera;

async function startCamera() {
  $("#cam-msg").innerHTML = `<p>カメラを起動しています…</p>`;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },   // 背面カメラを優先
    });
  } catch (err) {
    $("#cam-msg").innerHTML = `
      <p>カメラを使えませんでした。<br>
      ブラウザの設定でカメラの利用を許可するか、<br>
      下のコード入力をお使いください。</p>`;
    console.error(err);
    return;
  }

  video.srcObject = stream;
  await video.play();

  $("#cam-msg").hidden = true;
  $("#cam-frame").hidden = false;
  scanning = true;
  requestAnimationFrame(scanLoop);
}

function stopCamera() {
  scanning = false;
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  $("#cam-msg").hidden = false;
  $("#cam-frame").hidden = true;
}

function scanLoop() {
  if (!scanning) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, {
      inversionAttempts: "dontInvert",
    });

    if (code?.data) {
      const token = extractToken(code.data);
      if (token) {
        scanning = false;
        stopCamera();
        redeem(token);
        return;
      }
    }
  }
  requestAnimationFrame(scanLoop);
}

// QRの中身はURL。そこからトークンだけを取り出す
function extractToken(text) {
  const m = String(text).match(/\/x\/([A-Za-z0-9]{10,})/);
  if (m) return m[1];
  // トークンだけが入っていた場合にも対応
  if (/^[A-Za-z0-9]{16}$/.test(text.trim())) return text.trim();
  return null;
}

// =============================================
// 手入力での交換
// =============================================
$("#manual-go").onclick = () => {
  const v = $("#manual").value.trim();
  const token = extractToken(v) ?? v;
  if (!token) {
    showMsg("error", "コードを入力してください。");
    return;
  }
  redeem(token);
};

// =============================================
// 交換の実行
// =============================================
async function redeem(token) {
  showMsg("", "");

  const { data, error } = await supabase.rpc("redeem_exchange_token", {
    p_token: token,
  });

  if (error) {
    showMsg("error", "交換できませんでした：" + error.message);
    return;
  }

  if (!data?.ok) {
    showMsg("error", reasonText(data?.reason));
    return;
  }

  // 相手のカードを取って結果を見せる
  const { data: card } = await supabase.rpc("get_public_card", {
    p_public_id: data.partner,
  });

  showDone(card, data.is_new);
}

function reasonText(reason) {
  return {
    not_found: "このコードは使えません。入力を確かめてください。",
    expired:   "有効期限が切れています。相手にQRを作り直してもらってください。",
    revoked:   "このQRは無効になっています。作り直してもらってください。",
    self:      "自分のQRは読み取れません。",
    blocked:   "このユーザーとは交換できません。",
    profile_not_ready: "先にプロフィールの表示名を設定してください。",
  }[reason] ?? "交換できませんでした。";
}

function showDone(card, isNew) {
  $("#main").hidden = true;
  $("#done").hidden = false;

  if (!card) {
    $("#done-name").textContent = "交換しました";
    $("#done-lead").textContent = "コレクションから確認できます。";
    return;
  }

  const diagnosed = !!card.type_code;
  $("#done-char").innerHTML = diagnosed ? characterSVG(card.type_code) : "";
  $("#done-name").textContent = card.display_name;
  $("#done-type").textContent = diagnosed
    ? `${CHARACTERS[card.type_code].animal}・${TYPES[card.type_code].name}`
    : "未診断";
  $("#done-lead").innerHTML = isNew
    ? `カードを交換しました。<br><b>お互いのコレクション</b>に入りました。`
    : `すでに交換済みの相手でした。<br>カードの内容を最新にしました。`;

  window.scrollTo(0, 0);
}

$("#go-collection").onclick = () => location.href = "./collection.html";
$("#again").onclick = () => location.reload();
$("#back").onclick = () => { stopCamera(); location.href = "./card.html"; };

// ページを離れるときは必ずカメラを止める
window.addEventListener("pagehide", stopCamera);

function showMsg(kind, text) {
  const m = $("#msg");
  m.className = "msg" + (kind ? " " + kind : "");
  m.textContent = text;
}
</script>
</body>
</html>
