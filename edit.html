<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カードを編集する｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  /* 大見出し：■基本情報（表面）／■登山スキル（裏面） */
  .side { margin-top: 26px; }
  .side + .side { margin-top: 38px; padding-top: 26px; border-top: 1px solid var(--c-div, var(--line)); }
  .side-h { display: flex; align-items: center; gap: 10px; }
  .side-h svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--c-fg, var(--pine)); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .side-h h2 { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
  .side-h h2 small { font-size: 11px; font-weight: 600; color: var(--c-mut, var(--stone)); margin-left: 6px; letter-spacing: .02em; }
  .side-lead { font-size: 11.5px; color: var(--c-mut, var(--stone)); line-height: 1.8; margin-top: 6px; }
  .side .edit-group:first-of-type { margin-top: 14px; }
  .edit-group { margin-top: 24px; }
  .edit-group > h2 {
    font-size: 11px; font-weight: 900; color: var(--stone);
    letter-spacing: 1px; margin-bottom: 8px; padding-left: 2px;
  }
  .edit-item {
    display: flex; align-items: center; gap: 13px;
    background: var(--paper); border-radius: 14px;
    box-shadow: var(--shadow-card); padding: 14px 16px; margin-bottom: 8px;
    cursor: pointer; border: none; width: 100%;
    font-family: var(--font); text-align: left; color: var(--pine);
  }
  .edit-item:active { background: var(--birch); }
  .edit-ic {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: #EDF3EF; display: flex; align-items: center; justify-content: center;
  }
  .edit-ic svg {
    width: 19px; height: 19px; stroke: var(--fjord); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .edit-bd { flex: 1; min-width: 0; }
  .edit-t { display: block; font-size: 13.5px; font-weight: 700; }
  .edit-d { display: block; font-size: 11px; color: var(--c-mut, var(--stone)); margin-top: 2px; line-height: 1.6; }
  .edit-n {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--stone); flex: none;
  }
  .edit-arrow {
    width: 16px; height: 16px; flex: none; stroke: #C3D0C8;
    fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <h1>カードを編集する</h1>
    <p class="sub">変更はすぐにカードへ反映されます。</p>

    <div id="groups"></div>

    <button class="btn ghost" id="back" style="margin-top:24px">マイカードへ戻る</button>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme } from "./card.js";

const $ = (s) => document.querySelector(s);

mountHeader(signOut);

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

const profile = await getMyProfile();
if (!profile) {
  window.__showFatal("プロフィールを読み込めませんでした", "ページを再読み込みしてください。");
  throw new Error("no profile");
}
applyTheme(profile.card_bg);

// 今の登録状況を数えて、各項目に出す
const [climbedRes, wishRes, backRes] = await Promise.all([
  supabase.from("climbed_mountains").select("is_favorite").eq("user_id", user.id),
  supabase.from("wishlist_mountains").select("mountain_id").eq("user_id", user.id),
  supabase.from("card_backs").select("skills").eq("user_id", user.id).maybeSingle(),
]);
const skillVals = Object.values(backRes.data?.skills ?? {});

const climbedRows = climbedRes.data ?? [];
const n = {
  climbed: climbedRows.length,
  fav: climbedRows.filter((r) => r.is_favorite).length,
  wish: (wishRes.data ?? []).length,
};

const IC = {
  pen:  `<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
  redo: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`,
  mt:   `<svg viewBox="0 0 24 24"><path d="M3 20l6-14 4 8 3-5 5 11z"/></svg>`,
  star: `<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-2.9L6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg>`,
  flag: `<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2 4 2 4H5"/></svg>`,
  brush:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>`,
  skill:`<svg viewBox="0 0 24 24"><path d="M4 20V14M9 20V10M14 20V6M19 20V3"/></svg>`,
  link: `<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>`,
};

// 表面
const FRONT = [
  {
    title: "プロフィール",
    items: [
      { ic: "pen", t: "プロフィール更新",
        d: "表示名・ひとこと・カードの背景・載せる踏破状況・SNS",
        href: "./setup.html" },
    ],
  },
  {
    title: "登山タイプ診断",
    items: [
      { ic: "redo", t: "診断をやり直す",
        d: profile.type_code ? `いまは ${profile.type_code}` : "まだ診断を受けていません",
        href: "./quiz.html" },
    ],
  },
  {
    title: "山の登録",
    items: [
      { ic: "mt",   t: "登った山", d: "踏破状況のリングに反映されます",
        n: `${n.climbed}座`, href: "./mountains.html#climbed" },
      { ic: "star", t: "登ってよかった山", d: "登った山から5座まで・順位をつけられます",
        n: `${n.fav}/5`, href: "./mountains.html#fav" },
      { ic: "flag", t: "登ってみたい山", d: "まだ登っていない山から5座まで",
        n: `${n.wish}/5`, href: "./mountains.html#wish" },
    ],
  },
];

// 裏面
const BACK = [
  {
    title: "登山スキル",
    items: [
      { ic: "skill", t: "登山スキルを編集",
        d: "雪山・テント泊・岩稜などを5段階で自己申告。項目ごとに表示／非表示を選べます",
        n: skillVals.length ? `${skillVals.filter((v) => v.visible !== false).length}項目` : "未登録",
        href: "./skills.html" },
    ],
  },
];

// 表面と裏面を1ページにまとめて出す
const SIDES = [
  { title: "基本情報", sub: "カード表面に表示", lead: "表面は、URLを知っている人なら誰でも見られます。",
    ic: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 16c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4"/></svg>`,
    groups: FRONT },
  { title: "登山スキル", sub: "カード裏面に表示", lead: "裏面は、カードを交換した相手だけが見られます。",
    ic: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 9h6M9 12.5h6M9 16h4"/></svg>`,
    groups: BACK },
];

const itemHtml = (it) => `
      <button class="edit-item" data-href="${it.href}">
        <span class="edit-ic">${IC[it.ic]}</span>
        <span class="edit-bd">
          <span class="edit-t">${it.t}</span>
          <span class="edit-d">${it.d}</span>
        </span>
        ${it.n ? `<span class="edit-n">${it.n}</span>` : ""}
        <svg class="edit-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>`;

$("#groups").innerHTML = SIDES.map((sd) => `
  <section class="side">
    <div class="side-h">${sd.ic}<h2>${sd.title}<small>（${sd.sub}）</small></h2></div>
    <p class="side-lead">${sd.lead}</p>
    ${sd.groups.map((g) => `
      <div class="edit-group">
        ${sd.groups.length > 1 ? `<h2>${g.title}</h2>` : ""}
        ${g.items.map(itemHtml).join("")}
      </div>`).join("")}
  </section>`).join("");

$("#groups").addEventListener("click", (e) => {
  const b = e.target.closest("[data-href]");
  if (b) location.href = b.dataset.href;
});

$("#back").onclick = () => location.href = "./card.html";

$("#loading").hidden = true;
$("#main").hidden = false;
</script>
</body>
</html>
