<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ログイン｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>

<div class="wrap">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <!-- 入口 -->
  <div id="form" hidden>
    <p class="brand">ハイカーズ<span>カード</span></p>

    <h1>あなたの<br>登山カードを作る</h1>
    <p class="sub">
      登った山、登山のタイプ。<br>
      1枚のカードで伝わるプロフィールができます。
    </p>

    <button class="btn google" id="google">
      <svg viewBox="0 0 48 48">
        <path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v8h12c-.2 2-1.5 5-4.4 7l6.7 5.2C42.2 36.6 45 30.9 45 24z"/>
        <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.9-12.5-9.2l-7.1 5.5C8.1 41.1 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.5 28.3c-.5-1.4-.7-2.8-.7-4.3s.3-3 .7-4.3l-7.1-5.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.4 9.8l7.1-5.5z"/>
        <path fill="#EA4335" d="M24 10.2c3.2 0 5.4 1.4 6.7 2.6l6.1-6C33.1 3.4 28.5 1 24 1 15.4 1 8.1 5.9 4.4 14.2l7.1 5.5c1.8-5.3 6.7-9.5 12.5-9.5z"/>
      </svg>
      Googleで続ける
    </button>

    <div id="msg" class="msg"></div>

    <p class="terms">
      続けると<a href="#">利用規約</a>・<a href="#">プライバシーポリシー</a>に<br>
      同意したものとみなします。
    </p>
    <p class="terms">
      以前ご利用の方も、同じ入口からお入りください。<br>
      <b style="color:var(--pine)">前回と同じGoogleアカウント</b>でログインできます。
    </p>
  </div>

</div>

<script type="module">
import { supabase, getUser, baseUrl } from "./supabase.js";

const loading = document.getElementById("loading");
const form    = document.getElementById("form");
const msg     = document.getElementById("msg");

// すでにログイン済みならトップへ戻す
const user = await getUser();
if (user) {
  location.replace("./index.html");
} else {
  loading.hidden = true;
  form.hidden = false;
}

// ---------- Googleでログイン ----------
document.getElementById("google").onclick = async () => {
  msg.className = "msg";
  msg.textContent = "";

  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      // 認証後に戻ってくる先。
      // SupabaseのRedirect URLsに登録しておく必要がある
      redirectTo: baseUrl() + "index.html",
    },
  });

  if (error) {
    msg.className = "msg error";
    msg.textContent = "ログインを開始できませんでした：" + error.message;
  }
};

</script>
</body>
</html>
