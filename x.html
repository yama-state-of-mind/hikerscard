<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カードを交換する｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
  .center { text-align: center; }
  .done-char { width: 120px; height: 120px; margin: 10px auto; }
  .done-char svg { width: 100%; height: 100%; }
  .done-name { font-size: 22px; font-weight: 900; }
  .done-type { font-size: 12.5px; font-weight: 700; color: var(--fjord); margin-top: 2px; }
  .done-lead { font-size: 13px; color: #45564e; margin-top: 14px; line-height: 1.9; }
  .done-lead b { color: var(--pine); }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>交換しています…</p>
  </div>

  <div id="out" hidden class="center"></div>
</div>

<script src="/data.js"></script>
<script src="/characters.js"></script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "/supabase.js";
import { mountHeader } from "/header.js";

const $ = (s) => document.querySelector(s);

// ---------------------------------------------
// URLからトークンを取り出す
//   /x/AbCd1234...      … vercel.json のリライト経由
//   /x.html?t=AbCd...   … 直接開いた場合
// ---------------------------------------------
const viewer = await getUser();
mountHeader(signOut, { loggedIn: !!viewer });

function readToken() {
  const q = new URLSearchParams(location.search).get("t");
  if (q) return q;
  const m = location.pathname.match(/\/x\/([A-Za-z0-9]+)/);
  return m ? m[1] : null;
}

const token = readToken();

if (!token) {
  render(`
    <p class="brand">ハイカーズ<span>カード</span></p>
    <h1>コードが見つかりません</h1>
    <p class="sub">URLをもう一度ご確認ください。</p>
    <button class="btn ghost" onclick="location.href='/'">トップへ</button>`);
} else {
  const user = viewer;

  if (!user) {
    // 未ログイン。トークンを預かってログインへ送り、戻ってきたら交換する
    localStorage.setItem("pendingExchangeToken", token);
    render(`
      <p class="brand">ハイカーズ<span>カード</span></p>
      <h1>カードを交換します</h1>
      <p class="sub">
        交換するには、あなたのカードが必要です。<br>
        登録すると、そのまま交換が完了します。
      </p>
      <button class="btn sun" onclick="location.href='/login.html'">
        カードを作って交換する
      </button>
      <p class="terms">
        すでにお持ちの方も、同じ入口からログインできます。
      </p>`);
  } else {
    const profile = await getMyProfile();

    if (!profile?.onboarded_at) {
      // カードがまだ完成していない。完成後に交換できるようトークンを預かる
      // （マイページを開いたときに交換される）
      localStorage.setItem("pendingExchangeToken", token);
      location.replace("/start.html");
    } else {
      await redeem(token);
    }
  }
}

// ---------------------------------------------
// 交換の実行
// ---------------------------------------------
async function redeem(tok) {
  const { data, error } = await supabase.rpc("redeem_exchange_token", {
    p_token: tok,
  });

  if (error) {
    render(errorView("交換できませんでした", error.message));
    return;
  }

  if (!data?.ok) {
    render(errorView("交換できませんでした", reasonText(data?.reason)));
    return;
  }

  // 成功したら、お祝いの画面へ
  location.replace(`/exchanged.html?p=${encodeURIComponent(data.partner)}&new=${data.is_new ? 1 : 0}`);

}

function errorView(title, detail) {
  return `
    <p class="brand">ハイカーズ<span>カード</span></p>
    <h1>${title}</h1>
    <p class="sub">${esc(detail)}</p>
    <button class="btn ghost" onclick="location.href='/card.html'">マイカードへ</button>`;
}

function reasonText(reason) {
  return {
    not_found: "このコードは使えません。",
    expired:   "有効期限が切れています。相手にQRを作り直してもらってください。",
    revoked:   "このQRは無効になっています。",
    self:      "自分のQRは読み取れません。",
    blocked:   "このユーザーとは交換できません。",
    profile_not_ready: "先にプロフィールの表示名を設定してください。",
  }[reason] ?? "交換できませんでした。";
}

function render(html) {
  $("#out").innerHTML = html;
  $("#loading").hidden = true;
  $("#out").hidden = false;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
