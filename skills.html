<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カード裏面の編集｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  .sk-intro { font-size: 12px; color: var(--c-mut); line-height: 1.9; margin-top: 6px; }
  .sk-intro b { color: var(--c-fg); }

  .ske-group { margin-top: 26px; }
  .ske-group > h2 { font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--c-fg2);
    margin-bottom: 10px; padding-left: 2px; }

  .ske { background: var(--c-bg); border-radius: 18px; padding: 14px 16px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px -8px rgba(0,0,0,.12); }
  .ske + .ske { margin-top: 10px; }
  .ske.unset { background: transparent; box-shadow: none; border: 1px dashed var(--c-div); }

  .ske-h { display: flex; align-items: flex-start; gap: 10px; }
  .ske-name { flex: 1; font-size: 14px; font-weight: 700; line-height: 1.4; }
  .ske-name span { display: block; font-size: 10.5px; font-weight: 400; color: var(--c-mut); margin-top: 1px; }

  /* 表示／非表示（チェックボックス） */
  .ske-chk { flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 11.5px; font-weight: 600; color: var(--c-fg); padding: 4px 0; user-select: none; }
  .ske-chk input { appearance: none; -webkit-appearance: none; margin: 0; cursor: pointer;
    width: 20px; height: 20px; border-radius: 6px; border: 1.6px solid var(--c-div);
    background: var(--c-bg); display: grid; place-content: center; transition: background .15s, border-color .15s; }
  .ske-chk input::after { content: ""; width: 10px; height: 6px; margin-top: -2px;
    border-left: 2.2px solid var(--c-bg); border-bottom: 2.2px solid var(--c-bg);
    transform: rotate(-45deg) scale(0); transition: transform .12s; }
  .ske-chk input:checked { background: var(--c-fg); border-color: var(--c-fg); }
  .ske-chk input:checked::after { transform: rotate(-45deg) scale(1); }
  .ske-chk input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  .ske-chk.disabled { opacity: .35; cursor: default; }
  .ske-chk.disabled input { cursor: default; }

  /* 段階のスライダー（0 = 未経験 〜 5） */
  .ske-slider { margin-top: 16px; padding: 0 11px; }
  .ske-range { --p: 0%; -webkit-appearance: none; appearance: none; display: block;
    width: 100%; height: 28px; margin: 0; background: none; cursor: pointer; touch-action: pan-y; }
  .ske-range:focus { outline: none; }
  /* つまみの左側だけ塗る（--p を JS で更新） */
  .ske-range::-webkit-slider-runnable-track { height: 6px; border-radius: 99px;
    background: linear-gradient(to right, var(--c-fg) var(--p), var(--c-div) var(--p)); }
  .ske-range::-moz-range-track { height: 6px; border-radius: 99px; background: var(--c-div); }
  .ske-range::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--c-fg); }
  .ske-range::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px;
    border-radius: 50%; background: var(--c-bg); border: 2px solid var(--c-fg);
    box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .12s; }
  .ske-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--c-bg);
    border: 2px solid var(--c-fg); box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .ske-range:active::-webkit-slider-thumb { transform: scale(1.12); }
  .ske-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(224,163,59,.45); }

  /* 目盛り（押しても選べる） */
  .ske-ticks { display: flex; justify-content: space-between; margin: 4px -11px 0; }
  .ske-tick { width: 44px; text-align: center; font-family: var(--mono); font-size: 11px; font-weight: 600;
    color: var(--c-mut); background: none; border: none; cursor: pointer; padding: 2px 0; }
  .ske-tick.zero { font-family: var(--font); font-size: 10px; }
  .ske-tick.cur { color: var(--c-fg); }

  /* 未設定：スライダーを薄くして「ドラッグして選ぶ」と案内 */
  .ske.unset .ske-range::-webkit-slider-runnable-track { background: var(--c-div); }
  .ske.unset .ske-range::-webkit-slider-thumb { border-color: var(--c-mut); border-style: dashed; box-shadow: none; }
  .ske.unset .ske-range::-moz-range-progress { background: transparent; }
  .ske.unset .ske-range::-moz-range-thumb { border-color: var(--c-mut); border-style: dashed; box-shadow: none; }
  .ske.unset .ske-tick.cur { color: var(--c-mut); }

  .ske-desc { font-size: 12px; line-height: 1.8; margin-top: 10px; color: var(--c-fg2); min-height: 1.8em; }
  .ske-desc b { color: var(--c-fg); margin-right: 6px; }
  .ske-desc.none { color: var(--c-mut); }

  /* 段階の目安（常に表示。いまの段階を強調、押しても選べる） */
  .ske-guide { list-style: none; margin-top: 10px; border-top: 1px solid var(--c-div); }
  .ske-guide li { display: grid; grid-template-columns: 1.4em 7.2em 1fr; gap: 6px; align-items: baseline;
    font-size: 11px; line-height: 1.6; color: var(--c-mut); padding: 6px 8px; margin: 0 -8px;
    border-radius: 8px; cursor: pointer; transition: background .15s, color .15s; }
  .ske-guide li + li { border-top: 1px solid var(--c-div); }
  .ske-guide li b { font-family: var(--mono); color: var(--c-fg2); }
  .ske-guide li .gn { color: var(--c-fg2); font-weight: 600; }
  .ske-guide li.cur { background: var(--c-soft); color: var(--c-fg); }
  .ske-guide li.cur b, .ske-guide li.cur .gn { color: var(--c-fg); }
  .ske-guide li.cur + li { border-top-color: transparent; }
  .ske.unset .ske-guide li.cur { background: none; color: var(--c-mut); }

  .ske-clear { font-family: var(--font); font-size: 11px; color: var(--c-mut); background: none; border: none;
    cursor: pointer; padding: 2px 0; margin-top: 8px; text-decoration: underline; text-underline-offset: 2px; }

  .save-bar { position: sticky; bottom: 0; margin: 28px -22px 0; padding: 14px 22px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to bottom, transparent, var(--c-page) 28%); }
  .save-bar .btn { margin-top: 0; }
  .save-note { font-size: 11px; color: var(--c-mut); text-align: center; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <h1>カード裏面の編集</h1>
    <p class="sk-intro">登山スキルを<b>5段階</b>で自己申告します。<br>
      裏面は<b>カードを交換した相手だけ</b>が見られます。項目ごとに表示・非表示を選べます。<br>
      バーを<b>ドラッグ</b>して、未経験〜5の中から選んでください。</p>

    <div id="groups"></div>

    <div class="save-bar">
      <p class="save-note" id="save-note"></p>
      <button class="btn sun" id="save">保存する</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme, esc } from "./card.js";
import { SKILL_GROUPS, SKILL_BY_KEY, levelName, levelDesc } from "./card-back.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

const profile = await getMyProfile();
mountHeader(signOut, { shareId: profile?.public_id });
if (profile?.card_bg) applyTheme(profile.card_bg);

// 保存済みの裏面（本人だけが直接読める）
const { data: row, error } = await supabase
  .from("card_backs").select("skills").eq("user_id", user.id).maybeSingle();
if (error) {
  window.__showFatal("裏面を読み込めませんでした", error.message);
  throw error;
}

// state[キー] = { level: 0〜5, visible: bool }。未設定の項目はキーが無い
const state = {};
for (const [k, v] of Object.entries(row?.skills ?? {})) {
  if (SKILL_BY_KEY[k]) state[k] = { level: Number(v.level), visible: v.visible !== false };
}
const original = JSON.stringify(state);

// 目安の一覧（0 = 未経験 も含めて、スライダーと同じ 0〜5 の6段）
const guideRows = (it) => [
  [0, "未経験", "まだ経験はない（これから挑戦したい）"],
  ...it.levels.map(([n, d], i) => [i + 1, n, d]),
];

function itemHtml(it) {
  const s = state[it.key];
  const lv = s ? s.level : 0;
  return `
    <div class="ske${s ? "" : " unset"}" data-key="${it.key}">
      <div class="ske-h">
        <p class="ske-name">${esc(it.name)}<span>${esc(it.desc)}</span></p>
        <label class="ske-chk${s ? "" : " disabled"}">
          <input type="checkbox" data-vis ${s && s.visible !== false ? "checked" : ""} ${s ? "" : "disabled"}>
          裏面に表示
        </label>
      </div>

      <div class="ske-slider">
        <input class="ske-range" type="range" min="0" max="5" step="1" value="${lv}"
               aria-label="${esc(it.name)}の段階（0＝未経験〜5）"
               aria-valuetext="${esc(lv === 0 ? "未経験" : `${lv} ${levelName(it, lv)}`)}">
        <div class="ske-ticks">
          ${[0, 1, 2, 3, 4, 5].map((i) => `
            <button class="ske-tick${i === 0 ? " zero" : ""}${i === lv ? " cur" : ""}" data-lv="${i}"
                    tabindex="-1" aria-hidden="true">${i === 0 ? "未経験" : i}</button>`).join("")}
        </div>
      </div>

      <p class="ske-desc"></p>

      <ol class="ske-guide">
        ${guideRows(it).map(([i, n, d]) => `
          <li data-lv="${i}"><b>${i === 0 ? "0" : i}</b><span class="gn">${esc(n)}</span><span>${esc(d)}</span></li>`).join("")}
      </ol>

      <button class="ske-clear" data-clear ${s ? "" : "hidden"}>未設定にもどす</button>
    </div>`;
}

// 1項目の見た目を、いまの状態に合わせる。
// ドラッグ中にスライダーを作り直すと指が離れてしまうので、描き直さずに中身だけ更新する
function sync(key) {
  const el = document.querySelector(`.ske[data-key="${key}"]`);
  const it = SKILL_BY_KEY[key];
  const s = state[key];
  const lv = s ? s.level : Number(el.querySelector(".ske-range").value);

  el.classList.toggle("unset", !s);

  const range = el.querySelector(".ske-range");
  range.value = lv;
  range.style.setProperty("--p", `${(lv / 5) * 100}%`);
  range.setAttribute("aria-valuetext", lv === 0 ? "未経験" : `${lv} ${levelName(it, lv)}`);

  el.querySelectorAll(".ske-tick").forEach((t) => t.classList.toggle("cur", Number(t.dataset.lv) === lv));
  el.querySelectorAll(".ske-guide li").forEach((li) => li.classList.toggle("cur", Number(li.dataset.lv) === lv));

  const desc = el.querySelector(".ske-desc");
  desc.classList.toggle("none", !s);
  desc.innerHTML = s
    ? `<b>${lv === 0 ? "未経験" : `Lv.${lv} ${esc(levelName(it, lv))}`}</b>${esc(levelDesc(it, lv))}`
    : "未設定（裏面には載りません）。バーをドラッグして選んでください";

  const chk = el.querySelector("[data-vis]");
  chk.disabled = !s;
  chk.checked = s ? s.visible : false;   // 未設定のうちはチェックなし（登録すると表示オンになる）
  el.querySelector(".ske-chk").classList.toggle("disabled", !s);

  el.querySelector("[data-clear]").hidden = !s;
  updateNote();
}

function setLevel(key, lv) {
  state[key] = { level: lv, visible: state[key]?.visible ?? true };
  sync(key);
}

function draw() {
  $("#groups").innerHTML = SKILL_GROUPS.map((g) => `
    <div class="ske-group">
      <h2>${g.title}</h2>
      ${g.items.map(itemHtml).join("")}
    </div>`).join("");
  SKILL_GROUPS.forEach((g) => g.items.forEach((it) => sync(it.key)));
}

function updateNote() {
  const set = Object.values(state);
  const shown = set.filter((s) => s.visible).length;
  const changed = JSON.stringify(state) !== original;
  $("#save-note").textContent = set.length
    ? `${set.length}項目を登録中・うち${shown}項目を裏面に表示${changed ? "（未保存の変更あり）" : ""}`
    : "まだ何も登録されていません";
}

// スライダーを動かしたら、その段階で登録する（ドラッグ中も追従）
$("#groups").addEventListener("input", (e) => {
  const range = e.target.closest(".ske-range");
  if (!range) return;
  setLevel(range.closest(".ske").dataset.key, Number(range.value));
});

// 未設定の項目は、動かさずに押しただけでも登録する（つまみが0のまま押した場合など）
$("#groups").addEventListener("pointerdown", (e) => {
  const range = e.target.closest(".ske-range");
  if (!range) return;
  const key = range.closest(".ske").dataset.key;
  if (!state[key]) setLevel(key, Number(range.value));
});

// 表示・非表示
$("#groups").addEventListener("change", (e) => {
  const chk = e.target.closest("[data-vis]");
  if (!chk) return;
  const key = chk.closest(".ske").dataset.key;
  if (state[key]) { state[key].visible = chk.checked; sync(key); }
});

// 目盛り・目安の行を押しても選べる。「未設定にもどす」
$("#groups").addEventListener("click", (e) => {
  const card = e.target.closest(".ske");
  if (!card) return;
  const key = card.dataset.key;

  const pickEl = e.target.closest(".ske-tick, .ske-guide li");
  if (pickEl) return setLevel(key, Number(pickEl.dataset.lv));

  if (e.target.closest("[data-clear]")) {
    delete state[key];
    card.querySelector(".ske-range").value = 0;
    sync(key);
  }
});

// ---------------------------------------------
// 保存
// ---------------------------------------------
let saving = false;
$("#save").onclick = async () => {
  const btn = $("#save"), msg = $("#msg");
  msg.className = "msg"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "保存しています…";
  saving = true;

  const { error } = await supabase.rpc("save_card_back", { p_skills: state });
  if (error) {
    saving = false;
    btn.disabled = false; btn.textContent = "保存する";
    msg.className = "msg error";
    msg.textContent = "保存できませんでした：" + error.message;
    return;
  }
  // 保存したら、マイカードの裏面を開いて見せる
  location.href = "./card.html#back";
};

addEventListener("beforeunload", (e) => {
  if (!saving && JSON.stringify(state) !== original) { e.preventDefault(); e.returnValue = ""; }
});

draw();
$("#loading").hidden = true;
$("#main").hidden = false;
</script>
</body>
</html>
