<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>好きな山・登りたい山｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  .tabs {
    display: flex; gap: 6px; background: #E2E9E4;
    border-radius: 999px; padding: 4px; margin-top: 16px;
  }
  .tab {
    flex: 1; font-family: var(--font); font-size: 13px; font-weight: 700;
    border: none; background: transparent; color: var(--stone);
    border-radius: 999px; padding: 9px 0; cursor: pointer;
  }
  .tab.on { background: var(--paper); color: var(--pine); box-shadow: var(--shadow-card); }

  /* 名山カテゴリの絞り込み（登った山の画面と同じ形） */
  .cats {
    display: flex; gap: 5px; background: #E2E9E4;
    border-radius: 999px; padding: 3px; margin-top: 12px;
  }
  .cat {
    flex: 1; font-family: var(--font); font-size: 11px; font-weight: 700;
    border: none; background: transparent; color: var(--stone);
    border-radius: 999px; padding: 7px 0; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .cat.on { background: var(--paper); color: var(--pine); box-shadow: var(--shadow-card); }
  .cat .box {
    width: 13px; height: 13px; border-radius: 4px; flex: none;
    border: 1.6px solid #C3D0C8; background: var(--paper);
    display: flex; align-items: center; justify-content: center;
  }
  .cat .box svg { width: 8px; height: 8px; stroke: #fff; fill: none; stroke-width: 3.4; opacity: 0; }
  .cat.on .box svg { opacity: 1; }
  .rank-badge {
    font-size: 8.5px; font-weight: 900; font-family: var(--mono);
    border-radius: 4px; padding: 1px 5px; flex: none; margin-left: 4px;
  }
  .rank-100 { background: var(--sun); color: #fff; }
  .rank-200 { background: #8CA9BD;    color: #fff; }
  .rank-300 { background: #B9C6BD;    color: #fff; }

  .cap {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 16px; font-size: 12.5px;
  }
  .cap b { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .cap span { color: var(--stone); font-size: 11.5px; }
  .cap.full b { color: #B5533A; }

  .search-wrap { position: relative; margin-top: 12px; }
  .search-wrap input {
    width: 100%; font-family: var(--font); font-size: 15px;
    background: var(--paper); border: 1.6px solid var(--line);
    border-radius: 999px; padding: 11px 16px 11px 42px; outline: none;
  }
  .search-wrap input:focus {
    border-color: var(--fjord); box-shadow: 0 0 0 3px rgba(70,112,143,.12);
  }
  .search-wrap .ic {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--stone); fill: none; stroke-width: 2;
  }

  .mt-item {
    display: flex; align-items: center; gap: 11px;
    background: var(--paper); border-radius: 14px;
    box-shadow: var(--shadow-card); padding: 11px 14px; margin-bottom: 7px;
    cursor: pointer; border: 1.6px solid transparent;
  }
  .mt-item.on { border-color: var(--sun); }
  .mt-item.dim { opacity: .42; }
  .mt-mark {
    width: 24px; height: 24px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .mt-mark svg { width: 20px; height: 20px; }
  .mt-mark .off { fill: none; stroke: #C3D0C8; stroke-width: 1.8; }
  .mt-mark .on  { fill: var(--sun); stroke: var(--sun); stroke-width: 1.8; }
  .mt-body { flex: 1; min-width: 0; }
  .mt-name { font-size: 13.5px; font-weight: 700; }
  .mt-meta { font-size: 10.5px; color: var(--stone); margin-top: 1px; }
  .mt-empty {
    text-align: center; font-size: 12.5px; color: var(--stone);
    padding: 36px 20px; line-height: 2;
  }

  .save-bar {
    position: sticky; bottom: 0; z-index: 20;
    background: linear-gradient(to top, var(--birch) 70%, transparent);
    padding: 14px 0 16px; margin-top: 8px;
  }
  .save-bar .btn { margin-top: 0; }
  .save-note { font-size: 11px; color: var(--stone); text-align: center; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <h1>好きな山・登りたい山</h1>
    <p class="sub">それぞれ最大5座まで、カードに載せられます。</p>

    <div class="tabs">
      <button class="tab on" data-tab="fav">登ってよかった山</button>
      <button class="tab"    data-tab="wish">これから登りたい山</button>
    </div>

    <p class="cap" id="cap"></p>
    <p class="sub" id="lead" style="margin-top:4px"></p>

    <div class="cats" id="cats"></div>

    <div class="search-wrap">
      <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
      </svg>
      <input type="text" id="q" placeholder="山名・よみで探す" autocomplete="off" inputmode="search">
    </div>

    <div id="list" style="margin-top:12px"></div>

    <div class="save-bar">
      <p class="save-note" id="save-note"></p>
      <button class="btn sun" id="save">保存する</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";

const $ = (s) => document.querySelector(s);
const MAX = 5;

mountHeader(signOut);

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

// ---------------------------------------------
// データの取得
//   好きな山 … 登った山の中から選ぶ
//   登りたい山 … まだ登っていない山から選ぶ
// ---------------------------------------------
const [mtRes, climbedRes, wishRes] = await Promise.all([
  supabase.from("mountains")
          .select("id, name, kana, elevation, area, meizan_rank")
          .order("elevation", { ascending: false }),
  supabase.from("climbed_mountains")
          .select("mountain_id, is_favorite")
          .eq("user_id", user.id),
  supabase.from("wishlist_mountains")
          .select("mountain_id")
          .eq("user_id", user.id),
]);

if (mtRes.error) { window.__showFatal("山のデータを読み込めませんでした", mtRes.error.message); throw mtRes.error; }

const MOUNTAINS = mtRes.data ?? [];
const byId = new Map(MOUNTAINS.map((m) => [m.id, m]));

const climbedIds = new Set((climbedRes.data ?? []).map((r) => r.mountain_id));
const origFav  = new Set((climbedRes.data ?? []).filter((r) => r.is_favorite).map((r) => r.mountain_id));
const origWish = new Set((wishRes.data ?? []).map((r) => r.mountain_id));

const selFav  = new Set(origFav);
const selWish = new Set(origWish);

let tab = location.hash === "#wish" ? "wish" : "fav";
let keyword = "";

// 名山カテゴリの絞り込み。登った山の画面と同じ考え方
const CATS = [
  { id: "100",   label: "百名山",   rank: 100,  color: "#E0A33B" },
  { id: "200",   label: "二百名山", rank: 200,  color: "#8CA9BD" },
  { id: "300",   label: "三百名山", rank: 300,  color: "#B9C6BD" },
  { id: "other", label: "その他",   rank: null, color: "#9CB0A3" },
];
const cats = new Set(["100", "200", "300", "other"]);   // 既定はすべて

const inCat = (m) => m.meizan_rank === null
  ? cats.has("other")
  : cats.has(String(m.meizan_rank));

function drawCats() {
  $("#cats").innerHTML = CATS.map((c) => {
    const on = cats.has(c.id);
    return `
      <button class="cat ${on ? "on" : ""}" data-id="${c.id}">
        <span class="box" style="${on ? `background:${c.color};border-color:${c.color}` : ""}">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12l6 6L20 6"/>
          </svg>
        </span>${c.label}
      </button>`;
  }).join("");
}

$("#cats").addEventListener("click", (e) => {
  const b = e.target.closest(".cat");
  if (!b) return;
  const id = b.dataset.id;
  if (cats.has(id)) {
    if (cats.size === 1) return;   // 最後の1つは外せない
    cats.delete(id);
  } else {
    cats.add(id);
  }
  drawCats();
  render();
});

$("#loading").hidden = true;
$("#main").hidden = false;
drawCats();
render();

// ---------------------------------------------
// タブ
// ---------------------------------------------
// ハッシュで指定されたタブを最初から開く
document.querySelectorAll(".tab").forEach((t) =>
  t.classList.toggle("on", t.dataset.tab === tab));

document.querySelector(".tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  keyword = "";
  $("#q").value = "";
  render();
});

$("#q").addEventListener("input", (e) => { keyword = e.target.value.trim(); render(); });

// ---------------------------------------------
// 描画
// ---------------------------------------------
function render() {
  const isFav = tab === "fav";
  const sel = isFav ? selFav : selWish;

  // 対象になる山を絞る
  let base = (isFav
    ? MOUNTAINS.filter((m) => climbedIds.has(m.id))          // 登った山だけ
    : MOUNTAINS.filter((m) => !climbedIds.has(m.id))         // まだ登っていない山だけ
  ).filter((m) => inCat(m) || sel.has(m.id));                // 選択済みは絞っても残す

  $("#lead").textContent = isFav
    ? "「登った山」に登録した中から選べます。"
    : "まだ登っていない山から選べます。";

  $("#cap").className = "cap" + (sel.size >= MAX ? " full" : "");
  $("#cap").innerHTML = `<b>${sel.size}</b><span>/ ${MAX}座 選択中</span>`;

  if (isFav && !base.length) {
    $("#list").innerHTML = `<p class="mt-empty">
      登った山がまだ登録されていません。<br>
      先に「登った山」から登録してください。</p>`;
    updateNote();
    return;
  }

  const kw = normalize(keyword);
  const list = kw
    ? base.filter((m) => normalize(m.name).includes(kw) || normalize(m.kana).includes(kw))
    : base;

  // 選択済みを上に出す（探しやすさのため）
  list.sort((a, b) => (sel.has(b.id) ? 1 : 0) - (sel.has(a.id) ? 1 : 0));

  const shown = kw ? list : list.slice(0, 60);   // 多すぎると重いので既定は60件

  $("#list").innerHTML = shown.length
    ? shown.map((m) => item(m, sel)).join("") +
      (!kw && list.length > shown.length
        ? `<p class="mt-empty">ほか ${list.length - shown.length}座。検索で絞り込めます。</p>`
        : "")
    : `<p class="mt-empty">見つかりませんでした。<br>ひらがなでも探せます（例：やり）</p>`;

  updateNote();
}

function item(m, sel) {
  const on = sel.has(m.id);
  const full = sel.size >= MAX && !on;
  const icon = tab === "fav"
    ? `<path class="${on ? "on" : "off"}" d="M12 3l2.7 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.4 6.5 20.4l1.1-6.3L3 9.7l6.3-.9z"
         stroke-linejoin="round"/>`
    : `<path class="${on ? "on" : "off"}" d="M5 21V4M5 5h12l-2 4 2 4H5"
         stroke-linecap="round" stroke-linejoin="round"/>`;

  return `
    <div class="mt-item${on ? " on" : ""}${full ? " dim" : ""}" data-id="${m.id}">
      <div class="mt-mark"><svg viewBox="0 0 24 24">${icon}</svg></div>
      <div class="mt-body">
        <p class="mt-name">${m.name}${m.meizan_rank
          ? `<span class="rank-badge rank-${m.meizan_rank}">${
              m.meizan_rank === 100 ? "百" : m.meizan_rank === 200 ? "二百" : "三百"}</span>`
          : ""}</p>
        <p class="mt-meta">${m.kana}${m.elevation ? ` ・ ${m.elevation}m` : ""}${m.area ? ` ・ ${m.area}` : ""}</p>
      </div>
    </div>`;
}

function normalize(s) {
  return (s ?? "")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .toLowerCase();
}

// ---------------------------------------------
// 選択
// ---------------------------------------------
$("#list").addEventListener("click", (e) => {
  const el = e.target.closest(".mt-item");
  if (!el) return;
  const id = Number(el.dataset.id);
  const sel = tab === "fav" ? selFav : selWish;

  if (sel.has(id)) {
    sel.delete(id);
  } else {
    if (sel.size >= MAX) {
      showMsg("error", `選べるのは${MAX}座までです。どれかを外してください。`);
      return;
    }
    sel.add(id);
  }
  render();
});

function updateNote() {
  const favDiff  = diff(origFav, selFav);
  const wishDiff = diff(origWish, selWish);
  const total = favDiff.add.length + favDiff.del.length + wishDiff.add.length + wishDiff.del.length;
  $("#save-note").textContent = total ? `${total}件の変更` : "変更はありません";
}

function diff(orig, sel) {
  return {
    add: [...sel].filter((x) => !orig.has(x)),
    del: [...orig].filter((x) => !sel.has(x)),
  };
}

// ---------------------------------------------
// 保存（差分だけを書き込む）
// ---------------------------------------------
$("#save").onclick = async () => {
  const f = diff(origFav, selFav);
  const w = diff(origWish, selWish);

  if (!f.add.length && !f.del.length && !w.add.length && !w.del.length) {
    location.href = "./card.html";
    return;
  }

  const btn = $("#save");
  btn.disabled = true;
  btn.textContent = "保存しています…";
  showMsg("", "");

  try {
    // 好きな山：climbed_mountains のフラグを切り替える
    for (const [ids, val] of [[f.add, true], [f.del, false]]) {
      if (!ids.length) continue;
      const { error } = await supabase
        .from("climbed_mountains")
        .update({ is_favorite: val })
        .eq("user_id", user.id)
        .in("mountain_id", ids);
      if (error) throw error;
    }

    // 登りたい山：行の追加・削除
    if (w.del.length) {
      const { error } = await supabase
        .from("wishlist_mountains")
        .delete()
        .eq("user_id", user.id)
        .in("mountain_id", w.del);
      if (error) throw error;
    }
    if (w.add.length) {
      const { error } = await supabase
        .from("wishlist_mountains")
        .insert(w.add.map((mountain_id) => ({ user_id: user.id, mountain_id })));
      if (error) throw error;
    }

    location.href = "./card.html";
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "保存する";
    const m = String(err.message ?? "");
    showMsg("error",
      m.includes("favorite_limit") || m.includes("wishlist_limit")
        ? `選べるのは${MAX}座までです。`
        : "保存できませんでした：" + m);
  }
};

function showMsg(kind, text) {
  const m = $("#msg");
  m.className = "msg" + (kind ? " " + kind : "");
  m.textContent = text;
  if (text) setTimeout(() => { m.textContent = ""; m.className = "msg"; }, 3200);
}
</script>
</body>
</html>
