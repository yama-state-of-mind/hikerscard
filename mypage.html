<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マイページ｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  /* いちばん上：アイコンと名前 */
  .mp-me { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 10px; }
  .mp-av { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: var(--c-bg);
    box-shadow: 0 0 0 4px var(--c-page), 0 10px 26px rgba(0,0,0,.14); }
  .mp-av svg { width: 100%; height: 100%; display: block; }
  .mp-name { font-size: 22px; font-weight: 900; margin-top: 14px; letter-spacing: .04em; }
  .mp-sub { font-size: 11.5px; color: var(--c-mut); margin-top: 4px; letter-spacing: .04em; }
  .mp-sub b { font-family: var(--mono); color: var(--c-fg2); letter-spacing: .08em; }

  /* お知らせ */
  .mp-notes { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .mp-note { position: relative; display: flex; align-items: center; gap: 12px; text-decoration: none;
    color: var(--c-fg); background: var(--c-bg); border-radius: 16px; padding: 12px 40px 12px 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 20px -8px rgba(0,0,0,.18);
    border-left: 4px solid var(--sun); animation: mpIn .45s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes mpIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
  .mp-note-av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; background: var(--c-soft); }
  .mp-note-av svg { width: 100%; height: 100%; display: block; }
  .mp-note-t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.6; }
  .mp-note-t b { font-weight: 800; }
  .mp-note-t span { display: block; font-size: 11px; color: var(--c-mut); }
  .mp-note-x { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%;
    border: none; background: none; color: var(--c-mut); font-size: 18px; line-height: 1; cursor: pointer; }
  .mp-note.tip { border-left-color: var(--c-div); }
  .mp-note.tip .mp-note-av { display: flex; align-items: center; justify-content: center; background: var(--c-soft); }
  .mp-note.tip .mp-note-av svg { width: 22px; height: 22px; fill: none; stroke: var(--c-fg); stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; }

  /* メニュー */
  .mp-menu { margin-top: 24px; display: flex; flex-direction: column; gap: 8px; }
  .mp-item { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--c-fg);
    background: var(--c-bg); border-radius: 18px; padding: 14px 16px; border: none; width: 100%;
    font-family: var(--font); text-align: left; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px -8px rgba(0,0,0,.12); transition: transform .12s; }
  .mp-item:active { transform: scale(.99); }
  .mp-ic { width: 42px; height: 42px; border-radius: 13px; flex: none; background: var(--c-soft);
    display: flex; align-items: center; justify-content: center; }
  .mp-ic svg { width: 21px; height: 21px; fill: none; stroke: var(--c-fg); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .mp-item.main .mp-ic { background: var(--sun); }
  .mp-item.main .mp-ic svg { stroke: #fff; }
  .mp-t { flex: 1; min-width: 0; }
  .mp-t b { display: block; font-size: 15px; font-weight: 700; }
  .mp-t span { display: block; font-size: 11px; color: var(--c-mut); margin-top: 1px; }
  .mp-n { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--c-fg2); }
  .mp-go { width: 16px; height: 16px; fill: none; stroke: var(--c-mut); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .mp-item.out { background: none; box-shadow: none; margin-top: 8px; }
  .mp-item.out .mp-ic { background: none; }
  .mp-item.out .mp-t b { font-size: 13.5px; color: var(--c-mut); font-weight: 600; }
  .mp-item.out .mp-ic svg { stroke: var(--c-mut); }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div class="mp-me" id="me"></div>
    <div class="mp-notes" id="notes"></div>
    <nav class="mp-menu" id="menu"></nav>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>
<script src="/data.js"></script>
<script src="/characters.js"></script>

<script type="module">
import { supabase, getUser, getMyProfile, applyPendingDiagnosis,
         applyPendingExchange, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme, esc, SILHOUETTE, cardNo } from "./card.js";

const $ = (s) => document.querySelector(s);
const stop = () => new Promise(() => {});   // 移動するときに、ここで処理を止める

const user = await getUser();
if (!user) { location.replace("./login.html"); await stop(); }

let profile = await getMyProfile();
if (!profile?.display_name) { location.replace("./setup.html"); await stop(); }

// 未ログインのまま受けた診断・交換があれば、ここで反映する
profile = await applyPendingDiagnosis(profile);
const pending = await applyPendingExchange();
if (pending) {
  location.replace(`/exchanged.html?p=${encodeURIComponent(pending.partner)}&new=${pending.isNew ? 1 : 0}`);
  await stop();
}

mountHeader(signOut, { shareId: profile.public_id });
applyTheme(profile.card_bg);

// お知らせ（見た時点で「見た」になるので、表示は最初の一回だけ）と、交換した人数
const [noticeRes, exRes] = await Promise.all([
  supabase.rpc("take_my_notices"),
  supabase.from("exchanges").select("id", { count: "exact", head: true }),
]);

// ---------------------------------------------
// いちばん上：アイコンと名前
// ---------------------------------------------
const diag = profile.type_code && TYPES[profile.type_code];
$("#me").innerHTML = `
  <div class="mp-av">${diag ? characterSVG(profile.type_code) : SILHOUETTE}</div>
  <p class="mp-name">${esc(profile.display_name)}</p>
  <p class="mp-sub">${[
    cardNo(profile.card_no) ? `<b>${cardNo(profile.card_no)}</b>` : "",
    diag ? `${esc(profile.type_code)}　${esc(CHARACTERS[profile.type_code]?.animal ?? "")}・${esc(TYPES[profile.type_code].name)}` : "未診断",
  ].filter(Boolean).join(" ・ ")}</p>`;

// ---------------------------------------------
// お知らせ
// ---------------------------------------------
const face = (code) => code && TYPES[code] ? characterSVG(code) : SILHOUETTE;
const notes = (noticeRes.data ?? []).map((n) => {
  if (n.kind !== "exchanged") return "";
  const p = n.partner;
  return `
    <a class="mp-note" href="/u/${encodeURIComponent(p.public_id)}">
      <span class="mp-note-av">${face(p.type_code)}</span>
      <span class="mp-note-t"><b>${esc(p.display_name)}さん</b>とカードを交換しました！
        <span>コレクションに入りました。タップしてカードを見る</span></span>
      <button class="mp-note-x" aria-label="閉じる">&times;</button>
    </a>`;
});

// まだカード番号が無い人への案内（表示名と診断がそろうと発行される）
if (profile.card_no == null && !profile.type_code) {
  notes.push(`
    <a class="mp-note tip" href="/quiz.html">
      <span class="mp-note-av"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></span>
      <span class="mp-note-t"><b>登山タイプ診断</b>を受けると、カード番号が発行されます。
        <span>12の質問・3分ほどで終わります</span></span>
    </a>`);
}
$("#notes").innerHTML = notes.join("");

// ×で閉じる（リンクには飛ばない）
$("#notes").addEventListener("click", (e) => {
  const x = e.target.closest(".mp-note-x");
  if (!x) return;
  e.preventDefault();
  x.closest(".mp-note").remove();
});

// ---------------------------------------------
// メニュー
// ---------------------------------------------
const IC = {
  card: `<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M8.5 16c.8-1.6 2-2.4 3.5-2.4s2.7.8 3.5 2.4"/></svg>`,
  deck: `<svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v13"/></svg>`,
  qr:   `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 17h4v4"/></svg>`,
  pen:  `<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
  redo: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`,
  out:  `<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>`,
};
const GO = `<svg class="mp-go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
const count = exRes.count ?? 0;

const item = (href, ic, t, d, n = "", cls = "") => `
  <a class="mp-item ${cls}" href="${href}">
    <span class="mp-ic">${IC[ic]}</span>
    <span class="mp-t"><b>${t}</b><span>${d}</span></span>
    ${n ? `<span class="mp-n">${n}</span>` : ""}${GO}
  </a>`;

$("#menu").innerHTML = [
  item("/card.html", "card", "マイカード", "自分のカードを見る・シェアする", "", "main"),
  item("/collection.html", "deck", "コレクション", "交換したカードを見る", count ? `${count}枚` : ""),
  item("/exchange.html", "qr", "カードを交換する", "QRコードを見せる・読み取る"),
  item("/edit.html", "pen", "カードを編集する", "プロフィール・山の登録・登山スキル"),
  item("/quiz.html", "redo", profile.type_code ? "診断をやり直す" : "登山タイプ診断を受ける",
       profile.type_code ? `いまは ${esc(profile.type_code)}` : "12の質問・3分ほど"),
  `<button class="mp-item out" id="logout">
     <span class="mp-ic">${IC.out}</span><span class="mp-t"><b>ログアウト</b></span>
   </button>`,
].join("");

$("#logout").onclick = () => signOut();

$("#loading").hidden = true;
$("#main").hidden = false;
</script>
</body>
</html>
