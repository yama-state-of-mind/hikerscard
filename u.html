<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
  .notfound { text-align: center; padding: 60px 20px; }
  .notfound h1 { font-size: 18px; }
  .notfound p { font-size: 12.5px; color: var(--stone); margin-top: 10px; line-height: 2; }
  .cta-box {
    background: var(--paper); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); padding: 18px 20px; margin-top: 20px;
    text-align: center;
  }
  .cta-box p { font-size: 12.5px; color: #45564e; line-height: 1.9; }
  .report {
    text-align: center; margin-top: 26px;
  }
  .report button {
    font-family: var(--font); font-size: 11px; color: var(--stone);
    background: none; border: none; cursor: pointer; text-decoration: underline;
  }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div id="owner"></div>
    <!-- 登山相性はカードの上に置く（目に入りやすく、押したくなる位置） -->
    <div id="af-cta"></div>
    <div id="hero"></div>
    <div id="details"></div>
    <section class="det" id="section-actions">
      <div id="below"></div>
    </section>
  </div>

  <div id="notfound" hidden class="notfound">
    <p class="brand">ハイカーズ<span>カード</span></p>
    <h1>カードが見つかりません</h1>
    <p>
      URLが間違っているか、<br>
      このカードは公開されていません。
    </p>
    <button class="btn ghost" style="margin-top:20px"
            onclick="location.href='/'">トップへ</button>
  </div>
</div>

<script src="/data.js"></script>
<script src="/characters.js"></script>

<script type="module">
import { supabase, getUser, signOut } from "/supabase.js";
import { renderHeroCard, renderDetails, bindCardInteractions, applyTheme,
         renderOwnerBar, enableTilt, esc } from "/card.js";
import { renderBackFace, renderBackDetails, renderFlipCard, bindFlip } from "/card-back.js";
import { renderAffinityButton, openAffinitySheet } from "/affinity.js";
import { mountHeader } from "/header.js";

const $ = (s) => document.querySelector(s);

// ---------------------------------------------
// URLからpublic_idを取り出す
//   /u/x7k2p9        … vercel.json のリライト経由
//   /u.html?id=x7k2p9 … 直接開いた場合
// ---------------------------------------------
function readPublicId() {
  const q = new URLSearchParams(location.search).get("id");
  if (q) return q;
  const m = location.pathname.match(/\/u\/([^/?#]+)/);
  return m ? m[1] : null;
}

// ヘッダーは未ログインでも出す（中身が変わる）
const viewer = await getUser();
mountHeader(signOut, { loggedIn: !!viewer });

const publicId = readPublicId();

if (!publicId) {
  $("#loading").hidden = true;
  $("#notfound").hidden = false;
} else {
  // 公開カードはRPC経由でしか取れない。
  // 非公開の項目はそもそもブラウザに届かない仕組み
  const { data, error } = await supabase.rpc("get_public_card", {
    p_public_id: publicId,
  });

  if (error || !data) {
    if (error) console.error(error);
    $("#loading").hidden = true;
    $("#notfound").hidden = false;
  } else {
    const diagnosed = !!data.type_code;
    const me = viewer;

    // ログインしていれば自分のカードも取っておく（本人判定と共通点に使う）
    // 裏面は、本人か交換済みの相手だけ中身が返る（それ以外は鍵つきで返る）
    const [mineRes, backRes] = await Promise.all([
      me ? supabase.rpc("get_my_card") : Promise.resolve({ data: null }),
      supabase.rpc("get_card_back", { p_public_id: data.public_id }),
    ]);
    const mine = mineRes.data;
    const isOwn = !!mine && mine.public_id === data.public_id;

    document.title = isOwn
      ? "あなたのカード（公開ページ）｜ハイカーズカード"
      : `${data.display_name}さんのカード｜ハイカーズカード`;

    // 相手が選んだテーマを、このページ全体に反映する
    applyTheme(data.card_bg);

    const opts = {
      charSVG: diagnosed ? characterSVG(data.type_code) : "",
      animal:  diagnosed ? CHARACTERS[data.type_code]?.animal : "",
      typeName: diagnosed ? TYPES[data.type_code]?.name : "",
      features: diagnosed ? TYPES[data.type_code]?.features : "",
      caution:  diagnosed ? TYPES[data.type_code]?.caution  : "",
    };

    $("#owner").innerHTML = renderOwnerBar(isOwn ? "own-public" : me ? "other" : "guest", data);
    const lockAction = backRes.data?.reason === "login"
      ? `<a class="btn ghost bk-btn" href="/login.html">ログインする</a>`
      : `<a class="btn ghost bk-btn" href="/exchange.html">カードを交換する</a>`;
    $("#hero").innerHTML = renderFlipCard(
      renderHeroCard(data, { ...opts, flipBtn: true }),
      renderBackFace(data, backRes.data, { own: isOwn, lockAction }));
    $("#details").innerHTML = `
      <div data-side="front">${renderDetails(data, opts)}</div>
      <div data-side="back" hidden>${renderBackDetails(backRes.data, { own: isOwn })}</div>`;

    enableTilt($("#flip"));
    bindFlip();

    // 他人のカードなら「登山相性をみる」ボタンを出す（自分のカードでは出さない）。
    // 未ログインでも押せて、シートの中でログインへ誘導する
    if (!isOwn) {
      $("#af-cta").innerHTML = renderAffinityButton(data.display_name);
      $("#af-open").onclick = () => openAffinitySheet({
        me: mine,
        other: data,
        myChar: mine?.type_code ? characterSVG(mine.type_code) : "",
        otherChar: diagnosed ? characterSVG(data.type_code) : "",
        loginUrl: "/login.html",
      });
    }

    bindCardInteractions();

    let below = "";
    if (isOwn) {
      below = `
        <div class="cta-box">
          <p>URLを送ると、このページを見てもらえます。<br>
             カードの交換は、会ったときにQRコードで行います。</p>
        </div>`;
    } else if (!me) {
      below = `
        <div class="cta-box">
          <p>あなたも自分のカードを作れます。<br>
             12の質問で、登山タイプが分かります。</p>
          <button class="btn sun" style="margin-top:12px"
                  onclick="location.href='/login.html'">カードを作る</button>
        </div>`;
    } else if (data.exchanged) {
      below = `
        <div class="cta-box">
          <p>このカードは<b style="color:var(--pine)">交換済み</b>です。<br>
             コレクションから見られます。</p>
        </div>`;
    } else {
      below = `
        <div class="cta-box">
          <p>カードを交換するには、<br>
             会ったときにQRコードを読み取ってください。</p>
        </div>`;
    }

    // 自分のカードには通報・ブロックを出さない
    if (!isOwn) below += `
      <div class="report">
        <button data-act="report">このカードを通報する</button>
        ${me ? `<span style="color:var(--line);margin:0 8px">|</span>
        <button data-act="block">ブロックする</button>` : ""}
      </div>`;

    $("#below").innerHTML = below;

    $("#below").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;

      if (b.dataset.act === "report") {
        location.href = `/report.html?id=${encodeURIComponent(publicId)}`;
        return;
      }

      if (b.dataset.act === "block") {
        const ok = confirm(
          `${data.display_name}さんをブロックします。\n\n` +
          "・お互いのコレクションからカードが消えます\n" +
          "・今後このカードは見られなくなります\n" +
          "・相手に通知は行きません\n\n" +
          "よろしいですか？"
        );
        if (!ok) return;

        b.disabled = true;
        const res = await supabase.rpc("block_user", { p_public_id: publicId });
        if (res.error || !res.data?.ok) {
          b.disabled = false;
          alert("ブロックできませんでした：" + (res.error?.message ?? res.data?.reason ?? ""));
          return;
        }
        location.href = "/card.html";
      }
    });

    $("#loading").hidden = true;
    $("#main").hidden = false;
  }
}
</script>
</body>
</html>
