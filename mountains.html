<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>山の登録｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
/* ---------- 上部（カテゴリ＋達成率＋検索＋タグ） ---------- */
.head-bar {
  position: sticky; top: 0; z-index: 30;
  background: var(--c-page, var(--birch));
  padding: 10px 0 8px;
  margin: 0 -18px;              /* wrap の余白を打ち消して全幅に */
}
.head-in { padding: 0 18px; }


/* 達成率 */
/* 種別ごとの登録数（スマホで場所を取らないよう、リングではなく1行の小さな表示） */
.count-row {
  display: flex; flex-wrap: nowrap; gap: 5px; margin-top: 10px; overflow-x: auto;   /* 1行に収める */
}
.count-row::-webkit-scrollbar { display: none; }
.cnt-pill { display: inline-flex; align-items: center; gap: 5px; flex: none; white-space: nowrap;
  font-size: 11px; font-weight: 600;
  color: var(--c-fg2, var(--stone)); background: var(--c-bg, var(--paper)); border-radius: 999px;
  padding: 3px 9px 3px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.cnt-pill i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.cnt-pill b { font-family: var(--mono); font-size: 13px; color: var(--c-fg, var(--pine)); }
.count-row::-webkit-scrollbar { display: none; }
.ring-item { text-align: center; flex: none; }
.ring-label { font-size: 10px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
.ring-rest { font-size: 9px; color: var(--stone); margin-top: 1px; }
.ring { position: relative; width: 52px; height: 52px; flex: none; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; }
.ring-num {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-num b { font-family: var(--mono); font-size: 15px; font-weight: 700; line-height: 1; }
.ring-num span { font-size: 7.5px; color: var(--stone); margin-top: 1px; }

/* 検索 */
.search-wrap { position: relative; margin-top: 10px; }
.search-wrap input {
  width: 100%; font-family: var(--font); font-size: 15px;
  background: var(--c-bg, var(--paper)); border: 1.6px solid var(--line);
  border-radius: 999px; padding: 10px 40px 10px 40px; outline: none;
}
.search-wrap input:focus {
  border-color: var(--fjord); box-shadow: 0 0 0 3px rgba(70,112,143,.12);
}
.search-wrap .ic {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; stroke: var(--stone); fill: none; stroke-width: 2;
}
.search-wrap .clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 25px; height: 25px; border: none; background: #EDF3EF;
  border-radius: 50%; color: var(--stone); cursor: pointer;
  font-size: 13px; line-height: 1; font-family: var(--font);
}


/* ---------- 山のリスト（コンパクト） ---------- */
.mt-list { margin-top: 10px; }
.mt-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--c-bg, var(--paper)); border-radius: 12px;
  box-shadow: var(--shadow-card); padding: 8px 12px; margin-bottom: 5px;
  cursor: pointer; border: 1.6px solid transparent;
  transition: background .12s;
}
.mt-item.on { border-color: var(--sun); background: #FCF6EA; }

.mt-check {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  border: 2px solid var(--line); background: var(--c-bg, var(--paper));
  display: flex; align-items: center; justify-content: center;
}
.mt-item.on .mt-check { background: var(--sun); border-color: var(--sun); }
.mt-check svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 3; opacity: 0; }
.mt-item.on .mt-check svg { opacity: 1; }

.mt-body { flex: 1; min-width: 0; }
.mt-name {
  font-size: 13px; font-weight: 700; line-height: 1.4;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.mt-meta { font-size: 10px; color: var(--stone); margin-top: 1px; }
.mt-meta .el { font-family: var(--mono); }

.rank-badge {
  font-size: 8.5px; font-weight: 900; font-family: var(--mono);
  border-radius: 4px; padding: 1px 5px; flex: none;
}
.rank-100 { background: var(--sun);   color: #fff; }
.rank-200 { background: #8CA9BD;      color: #fff; }
.rank-300 { background: #B9C6BD;      color: #fff; }

.mt-empty {
  text-align: center; font-size: 12.5px; color: var(--stone);
  padding: 36px 20px; line-height: 2;
}
.more-wrap { text-align: center; padding: 16px 0 4px; }
.more-btn { font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--c-fg, var(--pine)); background: var(--c-bg, var(--paper));
  border: 1.5px solid var(--c-div, var(--line)); border-radius: 999px; padding: 10px 26px; }
.more-btn:active { transform: scale(.97); }
.more-note { font-size: 11px; color: var(--c-mut, var(--stone)); margin-top: 8px; }

/* ---------- 検索とフィルタ ---------- */
.tool-row { display: flex; gap: 8px; margin-top: 11px; }
.search-wrap { flex: 1; }
.filter-btn {
  flex: none; display: flex; align-items: center; gap: 5px;
  font-family: var(--font); font-size: 12.5px; font-weight: 700;
  color: var(--c-fg, var(--pine)); background: var(--c-bg, var(--paper));
  border: 1.6px solid var(--line); border-radius: 999px;
  padding: 0 15px; cursor: pointer;
}
.filter-btn svg { width: 15px; height: 15px; stroke: var(--c-fg, var(--pine)); stroke-width: 2; }
.fb-n {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  background: var(--sun); color: #fff; border-radius: 999px;
  min-width: 16px; padding: 1px 5px; text-align: center;
}

/* ---------- 適用中のフィルタ ---------- */
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 9px; }
.chip {
  font-family: var(--font); font-size: 11.5px; font-weight: 700;
  border: 1.4px solid var(--line); border-radius: 999px;
  padding: 5px 11px; cursor: pointer; background: var(--c-bg, var(--paper)); color: #45564e;
}
.chip.on { background: var(--pine); color: #fff; border-color: var(--c-fg, var(--pine)); }
.chip .x { margin-left: 3px; opacity: .7; }
.chip.sel { border-color: var(--sun); color: #96701E; background: #FCF6EA; }
.chip.sel.on { background: var(--sun); color: #fff; border-color: var(--sun); }
.chip.clear-all { color: var(--stone); border-style: dashed; }

/* ---------- フィルタのポップアップ ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(30,58,49,.42);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-in {
  background: var(--c-page, var(--birch)); width: 100%; max-width: 624px;
  border-radius: 22px 22px 0 0; max-height: 86vh;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slideUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes slideUp { from { transform: translateY(100%); } }

.sheet-head {
  display: flex; align-items: center; padding: 16px 20px 10px;
  border-bottom: 1px solid var(--line);
}
.sheet-t { font-size: 15px; font-weight: 900; flex: 1; }
.sheet-x {
  width: 30px; height: 30px; border: none; background: #EDF3EF;
  border-radius: 50%; color: var(--stone); font-size: 18px;
  line-height: 1; cursor: pointer; font-family: var(--font);
}

.sheet-body { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
.f-group { margin-top: 18px; }
.f-title {
  font-size: 11px; font-weight: 900; color: var(--stone);
  letter-spacing: 1px; margin-bottom: 7px;
}
.f-opts { display: flex; flex-direction: column; gap: 5px; }
.f-opt {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: var(--c-bg, var(--paper)); border: 1.6px solid transparent;
  border-radius: 12px; padding: 10px 13px; cursor: pointer;
  font-family: var(--font); text-align: left; box-shadow: var(--shadow-card);
}
.f-opt.on { border-color: var(--sun); background: #FCF6EA; }
.f-box {
  width: 19px; height: 19px; border-radius: 6px; flex: none;
  border: 2px solid var(--line); background: var(--c-bg, var(--paper));
  display: flex; align-items: center; justify-content: center;
}
.f-opt.on .f-box { background: var(--sun); border-color: var(--sun); }
.f-box svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3.2; opacity: 0; }
.f-opt.on .f-box svg { opacity: 1; }
.f-label { flex: 1; font-size: 13px; font-weight: 700; color: var(--c-fg, var(--pine)); }
.f-n { font-family: var(--mono); font-size: 11px; color: var(--stone); flex: none; }

.sheet-foot {
  display: flex; gap: 9px; padding: 12px 20px 16px;
  border-top: 1px solid var(--line); background: var(--c-page, var(--birch));
}
.sheet-foot .btn { flex: 1; }
.sheet-foot .btn.ghost { flex: 0 0 38%; }

/* ---------- エリアの見出し ---------- */
.area-head {
  font-size: 11px; font-weight: 900; color: var(--stone);
  letter-spacing: .5px; margin: 14px 0 6px; padding-left: 2px;
  display: flex; align-items: center; gap: 7px;
}
.area-head::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.area-head span {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  background: #E7EEE9; border-radius: 999px; padding: 1px 7px; order: 1;
}
.mt-list > .area-head:first-child { margin-top: 4px; }

/* ---------- 保存バー ---------- */
.save-bar {
  position: sticky; bottom: 0; z-index: 20;
  background: linear-gradient(to top, var(--c-page, var(--birch)) 72%, transparent);
  padding: 14px 0 16px; margin-top: 6px;
}
.save-bar .btn { margin-top: 0; }
.save-note { font-size: 11px; color: var(--stone); text-align: center; margin-bottom: 8px; }

/* =============================================
   Step 17：3つの登録を1ページに
   ============================================= */
.page-h { display: flex; align-items: baseline; gap: 10px; }
.page-h h1 { font-size: 18px; }

/* タブ */
.tabs {
  display: flex; gap: 4px; background: var(--c-soft, #E2E9E4);
  border-radius: 14px; padding: 4px;
}
.tab {
  flex: 1; font-family: var(--font); font-size: 11.5px; font-weight: 700;
  border: none; background: none; color: var(--c-mut, var(--stone));
  border-radius: 11px; padding: 8px 4px 7px; cursor: pointer; line-height: 1.35;
}
.tab b { display: block; font-family: var(--mono); font-size: 11px; margin-top: 1px; }
.tab.on { background: var(--c-bg, var(--paper)); color: var(--c-fg, var(--pine));
  box-shadow: 0 1px 4px rgba(30,58,49,.12); }
.tab.on b { color: var(--sun); }

/* タブごとの説明 */
.lead { font-size: 11.5px; color: var(--c-mut, var(--stone)); line-height: 1.8; margin-top: 14px; }

/* ---------- 登ってよかった山：順位のトレイ ---------- */
.podium { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: flex; align-items: center; gap: 10px; min-height: 46px;
  background: var(--c-bg, var(--paper)); border-radius: 12px; padding: 6px 8px 6px 10px;
  box-shadow: var(--shadow-card); transition: transform .18s, background .18s;
}
.slot.empty { background: transparent; box-shadow: none;
  border: 1.6px dashed var(--c-div, var(--line)); }
.slot.flash { background: #FCF6EA; }
.slot .pos { width: 26px; height: 26px; font-size: 12px; }
.slot.empty .pos { background: var(--c-soft, #E7EEE9); color: var(--c-mut, var(--stone)); }
.slot-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.35; }
.slot-name small { display: block; font-size: 10px; font-weight: 400; color: var(--c-mut, var(--stone)); }
.slot.empty .slot-name { font-weight: 400; font-size: 11.5px; color: var(--c-mut, var(--stone)); }
.slot-btn {
  width: 32px; height: 32px; border-radius: 10px; border: none; flex: none; cursor: pointer;
  background: var(--c-soft, #EDF3EF); display: flex; align-items: center; justify-content: center;
}
.slot-btn svg { width: 15px; height: 15px; stroke: var(--c-fg, var(--pine)); fill: none;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.slot-btn:disabled { opacity: .3; cursor: default; }
.slot-btn.x svg { stroke: var(--c-mut, var(--stone)); }

/* ---------- 登ってみたい山：選択中のトレイ ---------- */
.wish-tray { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 34px; }
.wish-chip {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font);
  font-size: 12px; font-weight: 700; color: var(--c-fg, var(--pine));
  background: var(--c-wishbg, #E9F0F5); border: none; border-radius: 999px;
  padding: 6px 8px 6px 12px; cursor: pointer;
}
.wish-chip i { font-style: normal; color: var(--c-mut, var(--stone)); font-size: 13px; line-height: 1; }
.wish-empty { font-size: 11.5px; color: var(--c-mut, var(--stone));
  border: 1.6px dashed var(--c-div, var(--line)); border-radius: 12px; padding: 9px 12px; width: 100%; }
.cap-n { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--c-mut, var(--stone)); }
.cap-n.full { color: var(--sun); }

/* ---------- リストの印（タブで変わる） ---------- */
.mt-item.dim { opacity: .45; }
.mt-mark { width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; }
.mt-mark svg { width: 20px; height: 20px; fill: none; stroke: var(--c-div, var(--line)); stroke-width: 2; }
.mt-item.on .mt-mark svg.star { fill: var(--sun); stroke: var(--sun); }
.mt-item.on .mt-mark svg.flag { stroke: var(--c-acc, var(--fjord)); }
.mt-item .pos { width: 22px; height: 22px; font-size: 11px; }
.mt-item.fav.on  { border-color: var(--sun); background: #FCF6EA; }
.mt-item.wish.on { border-color: var(--c-acc, var(--fjord)); background: var(--c-wishbg, #E9F0F5); }
body.theme-dark .mt-item.on, body.theme-dark .mt-item.fav.on { background: rgba(224,163,59,.14); }
body.theme-dark .mt-item.wish.on { background: rgba(127,181,212,.14); }

/* 「山頂以外も表示」の案内（一覧の一番下） */
.extra-hint { text-align: center; padding: 18px 0 6px; }
.extra-btn { font-family: var(--font); font-size: 12.5px; font-weight: 700; cursor: pointer;
  color: var(--c-fg2, var(--stone)); background: none; border: 1.5px dashed var(--c-div, var(--line));
  border-radius: 999px; padding: 9px 20px; }
.extra-hint p { font-size: 10.5px; color: var(--c-mut, var(--stone)); margin-top: 6px; }
.f-note { font-size: 10.5px; color: var(--c-mut, var(--stone)); margin: -4px 0 8px; }
.f-group.off .f-opts { opacity: .35; pointer-events: none; }

/* 名山以外の種類の印 */
.kind-badge { display: inline-block; font-size: 9.5px; font-weight: 700; margin-left: 6px; vertical-align: 2px;
  padding: 1px 6px; border-radius: 6px; color: var(--c-fg2, var(--stone)); border: 1px solid var(--c-div, var(--line)); }
.kind-badge.ridge { color: #fff; background: #7C6A58; border-color: transparent; }
.mt-name .flags { margin-right: 6px; vertical-align: 0; }

/* カードづくり中の案内 */
.ob-note { margin-top: 10px; background: #FCF1DC; border-left: 4px solid var(--sun); border-radius: 12px;
  padding: 10px 12px; font-size: 12px; line-height: 1.8; color: var(--c-fg, var(--pine)); }
body.theme-dark .ob-note { background: rgba(224,163,59,.16); }
.ob-note b { font-weight: 800; }

/* 保存前の変更を知らせるトースト */
.toast {
  position: fixed; left: 50%; bottom: calc(130px + env(safe-area-inset-bottom, 0px)); z-index: 120;
  transform: translateX(-50%); background: var(--pine); color: #fff;
  font-size: 11.5px; line-height: 1.6; border-radius: 12px; padding: 9px 14px;
  box-shadow: 0 6px 18px rgba(20,40,32,.3); width: max-content; max-width: calc(100% - 32px);
  animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div class="page-h"><h1>山の登録</h1></div>
    <div class="ob-note" id="ob-note" hidden></div>

    <div class="head-bar">
      <div class="head-in">
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="climbed" role="tab">登った山<b id="tn-climbed">0</b></button>
          <button class="tab" data-tab="fav"     role="tab">登ってよかった山<b id="tn-fav">0/5</b></button>
          <button class="tab" data-tab="wish"    role="tab">登ってみたい山<b id="tn-wish">0/5</b></button>
        </div>

        <!-- 登った山のタブだけ、達成率のリングを出す -->
        <div class="count-row" id="count-row"></div>

        <div class="tool-row">
          <div class="search-wrap">
            <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
            </svg>
            <input type="text" id="q" placeholder="山名・よみで探す"
                   autocomplete="off" inputmode="search">
            <button class="clear" id="clear" hidden>×</button>
          </div>
          <button class="filter-btn" id="filter-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5h18M6 12h12M10 19h4"/>
            </svg>
            フィルタ<span class="fb-n" id="fb-n" hidden>0</span>
          </button>
        </div>

        <div class="chips-row" id="chips"></div>
      </div>
    </div>

    <!-- タブごとの説明と、選んだ山のトレイ -->
    <div id="panel"></div>

    <div class="mt-list" id="list"></div>

    <div class="save-bar">
      <p class="save-note" id="save-note"></p>
      <button class="btn sun" id="save">保存する</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <!-- フィルタのポップアップ -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-head">
        <p class="sheet-t">フィルタ</p>
        <button class="sheet-x" id="sheet-x" aria-label="閉じる">&times;</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-foot">
        <button class="btn ghost" id="f-reset" style="margin-top:0">すべて解除</button>
        <button class="btn sun"   id="f-apply" style="margin-top:0">
          <span id="f-count"></span>件を表示
        </button>
      </div>
    </div>
  </div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme, esc, flags } from "./card.js";

const $ = (s) => document.querySelector(s);
const MAX = 5;

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

// ---------------------------------------------
// 山マスタと、登録済みの3種類
// ---------------------------------------------
const [profile, mtRes, climbedRes, wishRes] = await Promise.all([
  getMyProfile(),
  supabase.from("mountains")
          .select("*")   // 種類・国・表示名などもすべて
          .order("elevation", { ascending: false }),
  supabase.from("climbed_mountains")
          .select("mountain_id, is_favorite, favorite_rank")
          .eq("user_id", user.id),
  supabase.from("wishlist_mountains")
          .select("mountain_id")
          .eq("user_id", user.id),
]);

mountHeader(signOut, { shareId: profile?.public_id });

// カードづくりの途中（じっくり登録を選んだ人）は、保存したらカードづくりに戻る
const ONBOARDING = !profile?.onboarded_at;
const AFTER_SAVE = ONBOARDING ? "./start.html" : "./card.html";
if (profile?.card_bg) applyTheme(profile.card_bg);

// どれか1つでも失敗したら止める。
// 空のまま保存すると、登録済みの山を消してしまうため
for (const [res, label] of [[mtRes, "山のデータ"], [climbedRes, "登った山"], [wishRes, "登ってみたい山"]]) {
  if (res.error) {
    window.__showFatal(`${label}を読み込めませんでした`, res.error.message);
    throw res.error;
  }
}

const MOUNTAINS = mtRes.data ?? [];
const byId = new Map(MOUNTAINS.map((m) => [m.id, m]));

// 保存前の元の状態（変更の数え上げに使う）
const orig = {
  climbed: new Set((climbedRes.data ?? []).map((r) => r.mountain_id)),
  fav: (climbedRes.data ?? []).filter((r) => r.is_favorite)
        .sort((a, b) => (a.favorite_rank ?? 99) - (b.favorite_rank ?? 99)
                     || (byId.get(b.mountain_id)?.elevation ?? 0) - (byId.get(a.mountain_id)?.elevation ?? 0))
        .map((r) => r.mountain_id),
  wish: new Set((wishRes.data ?? []).map((r) => r.mountain_id)),
};

// いま画面で選んでいる状態
const climbed = new Set(orig.climbed);
let   fav     = [...orig.fav].slice(0, MAX);     // 順番がそのまま1位〜5位
const wish    = new Set(orig.wish);

const TABS = ["climbed", "fav", "wish"];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "climbed";

$("#loading").hidden = true;
$("#main").hidden = false;

if (ONBOARDING) {
  $("#ob-note").hidden = false;
  $("#ob-note").innerHTML = `<b>カードづくり中</b>：3つのタブで、<b>登ってみたい山を1つ以上</b>、
    登った山がある人は<b>登ってよかった山も1つ以上</b>選んで「保存する」を押してください。カードづくりに戻ります。`;
}

// ---------------------------------------------
// 一覧の並び順（北から南）
// ---------------------------------------------
const AREA_ORDER = [
  "北海道", "東北", "上信越", "北関東", "関東", "奥秩父",
  "北アルプス", "八ヶ岳周辺", "中央アルプス", "南アルプス",
  "富士山", "伊豆", "北陸", "中部", "近畿", "中国", "四国", "九州",
  // 海外（国内の後ろに並べる）
  "アジア", "ヨーロッパ", "アフリカ", "北米", "南米", "オセアニア",
];

// 場所の分け方（踏破状況の件数と同じ）
//   100 / 200 / 300 … 名山 ／ other … 名山以外の国内の山頂 ／ ridge … 岩稜・難所
//   overseas … 海外（山頂・トレッキング） ／ scenic … 国内の景勝地・コース（踏破には数えない）
const cat = (m) => m.meizan_rank ? String(m.meizan_rank)
  : m.countries?.length ? "overseas"
  : m.kind === "ridge" ? "ridge"
  : (m.kind === "scenic" || m.kind === "course") ? "scenic"
  : "other";
const label = (m) => m.display_name ?? m.name;
const areaRank = (a) => {
  const i = AREA_ORDER.indexOf(a);
  return i === -1 ? 999 : i;
};

// ---------------------------------------------
// フィルタの定義（3つのタブで共通）
//
// 同じ区分の中で複数選ぶとOR、区分をまたぐとAND。
// 何も選ばれていない区分は「絞り込まない」扱い。
// ---------------------------------------------
// ふだんの一覧は「国内の山頂」が中心。
//   ・名山／エリア／人気の山／標高 … 絞り込み
//   ・エリアの「海外」を選ぶと、海外の山・トレッキングが入る（選ばなければ出ない）
//   ・山頂以外（kinds: true）… 岩稜・難所／景勝地・コースを選ぶと、その種類「だけ」を表示する。
//     そのあいだ、名山・人気の山・標高は使えない（エリアは使える）
//   ・検索は、山頂以外を選んでいなければ全体から探す（岩稜・景勝地・海外も見つかる）
const FILTERS = [
  {
    id: "rank", title: "名山",
    opts: [
      { v: "100",   label: "百名山" },
      { v: "200",   label: "二百名山" },
      { v: "300",   label: "三百名山" },
      { v: "other", label: "名山以外" },
    ],
    match: (m, v) => v === "other" ? (!m.meizan_rank && m.kind === "peak") : String(m.meizan_rank) === v,
  },
  {
    id: "region", title: "エリア",
    opts: [
      { v: "north",       label: "北海道・東北" },
      { v: "kita_alps",   label: "北アルプス" },
      { v: "minami_alps", label: "南・中央アルプス" },
      { v: "koshin",      label: "八ヶ岳・奥秩父・甲信" },
      { v: "kanto",       label: "関東・上信越・日光" },
      { v: "tokai",       label: "東海・近畿・北陸" },
      { v: "west",        label: "中国・四国・九州・沖縄" },
      { v: "overseas",    label: "海外" },
    ],
    match: (m, v) => v === "overseas" ? m.countries?.length > 0 : (!m.countries?.length && m.region === v),
  },
  {
    id: "popular", title: "人気の山",
    opts: [{ v: "1", label: "人気の山だけ表示" }],
    match: (m) => !!m.is_popular,
  },
  {
    id: "band", title: "標高",
    opts: [
      { v: "low",  label: "〜1500m（低山・近郊）" },
      { v: "mid",  label: "1500〜2500m（中高山）" },
      { v: "high", label: "2500m〜（高山・アルプス）" },
    ],
    match: (m, v) => {
      const e = m.elevation ?? 0;
      return v === "low" ? e < 1500 : v === "mid" ? e >= 1500 && e < 2500 : e >= 2500;
    },
  },
  {
    id: "extra", title: "山頂以外", kinds: true,
    note: "選ぶと、その種類だけを表示します（エリアと組み合わせられます）",
    opts: [
      { v: "ridge",  label: "岩稜・難所",                         chip: "岩稜・難所" },
      { v: "scenic", label: "景勝地・コース（踏破には数えません）", chip: "景勝地・コース" },
    ],
    match: (m, v) => cat(m) === v,
  },
];

const active = {};
let draft = {};
FILTERS.forEach((f) => (active[f.id] = new Set()));

let onlySelected = false;
let keyword = "";

// 絞り込みが無いときに一度に出す件数。「さらに表示」で増やす。
// 条件（タブ・検索・フィルタ）が変わったら最初の件数に戻す
const PAGE = 80;
let pageLimit = PAGE;
let lastSig = "";

// ---------------------------------------------
// タブごとの「選べる山」と「選択中か」
// ---------------------------------------------
function baseList() {
  if (tab === "fav")  return MOUNTAINS.filter((m) => climbed.has(m.id));   // 登った山からだけ
  if (tab === "wish") return MOUNTAINS.filter((m) => !climbed.has(m.id));  // まだ登っていない山からだけ
  return MOUNTAINS;
}
function isSel(id) {
  if (tab === "fav")  return fav.includes(id);
  if (tab === "wish") return wish.has(id);
  return climbed.has(id);
}

function passFilters(m, state = active) {
  for (const f of FILTERS) {
    if (f.kinds) continue;         // 「山頂以外」は visible() で別に扱う
    const set = state[f.id];
    if (!set || !set.size) continue;
    if (![...set].some((v) => f.match(m, v))) return false;
  }
  return true;
}
// 一覧に出すか
//   kw（検索中）なら、オフにしている種類・海外も対象にする
// 山頂以外を選んでいるあいだは使わない区分
const PEAK_ONLY = new Set(["rank", "popular", "band"]);

function visible(m, state = active, kw = "") {
  const c = cat(m);
  const isExtra = c === "ridge" || c === "scenic";

  // 「山頂以外」を選んでいる：その種類だけ。エリアの絞り込みだけ効かせる
  if (state.extra.size) {
    if (!isExtra || !state.extra.has(c)) return false;
    const reg = FILTERS.find((f) => f.id === "region");
    return !state.region.size || [...state.region].some((v) => reg.match(m, v));
  }

  if (isExtra) return !!kw;                                                   // ふだんは検索したときだけ
  if (c === "overseas" && !kw && !state.region.has("overseas")) return false;  // 海外はエリアで選んだときだけ
  return passFilters(m, state);
}
const countWith = (state) => baseList().filter((m) => visible(m, state)).length;
const activeCount = () => FILTERS.reduce((n, f) => n + active[f.id].size, 0);

// ---------------------------------------------
// タブ
// ---------------------------------------------
function setTab(t) {
  tab = t;
  history.replaceState(null, "", "#" + t);
  onlySelected = false;
  document.querySelectorAll(".tab").forEach((x) => {
    x.classList.toggle("on", x.dataset.tab === t);
    x.setAttribute("aria-selected", x.dataset.tab === t);
  });
  drawAll();
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (t && t.dataset.tab !== tab) {
    setTab(t.dataset.tab);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

function drawTabCounts() {
  $("#tn-climbed").textContent = climbed.size;
  $("#tn-fav").textContent = `${fav.length}/${MAX}`;
  $("#tn-wish").textContent = `${wish.size}/${MAX}`;
}

// ---------------------------------------------
// フィルタのポップアップ
// ---------------------------------------------
$("#filter-btn").onclick = () => {
  draft = {};
  FILTERS.forEach((f) => (draft[f.id] = new Set(active[f.id])));
  drawSheet();
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
};

function closeSheet() {
  $("#sheet").hidden = true;
  document.body.style.overflow = "";
}
$("#sheet-x").onclick = closeSheet;
$("#sheet").onclick = (e) => { if (e.target === $("#sheet")) closeSheet(); };

function drawSheet() {
  const base = baseList();
  $("#sheet-body").innerHTML = FILTERS.map((f) => `
    <div class="f-group${draft.extra.size && PEAK_ONLY.has(f.id) ? " off" : ""}">
      <p class="f-title">${f.title}</p>${f.note ? `<p class="f-note">${f.note}</p>` : ""}${
        draft.extra.size && PEAK_ONLY.has(f.id) ? `<p class="f-note">山頂以外を選んでいるあいだは使えません</p>` : ""}
      <div class="f-opts">
        ${f.opts.map((o) => {
          const on = draft[f.id].has(o.v);
          // 一覧と同じ考え方で数える：
          //   絞り込みの選択肢は、国内の山頂（海外は「海外」を選んでいるときだけ）が対象
          //   「山頂以外も表示」は、その種類の数
          const n = base.filter((m) => {
            if (!f.match(m, o.v)) return false;
            if (f.kinds) return true;
            const c = cat(m);
            const isExtra = c === "ridge" || c === "scenic";
            // 山頂以外を選んでいるときのエリアは、その種類の数
            if (draft.extra.size) return f.id === "region" && isExtra && draft.extra.has(c);
            if (isExtra) return false;
            if (c === "overseas") return (f.id === "region" && o.v === "overseas") || draft.region.has("overseas");
            return true;
          }).length;
          return `
            <button class="f-opt ${on ? "on" : ""}" data-f="${f.id}" data-v="${o.v}">
              <span class="f-box">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6"/>
                </svg>
              </span>
              <span class="f-label">${o.label}</span>
              <span class="f-n">${n}</span>
            </button>`;
        }).join("")}
      </div>
    </div>`).join("");
  $("#f-count").textContent = countWith(draft);
}

$("#sheet-body").addEventListener("click", (e) => {
  const b = e.target.closest(".f-opt");
  if (!b || b.closest(".f-group.off")) return;
  const set = draft[b.dataset.f];
  if (set.has(b.dataset.v)) set.delete(b.dataset.v);
  else set.add(b.dataset.v);
  drawSheet();
});

$("#f-reset").onclick = () => { FILTERS.forEach((f) => draft[f.id].clear()); drawSheet(); };

$("#f-apply").onclick = () => {
  FILTERS.forEach((f) => (active[f.id] = new Set(draft[f.id])));
  if (active.extra.size) PEAK_ONLY.forEach((id) => active[id].clear());
  onlySelected = false;
  closeSheet();
  drawChips();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// ---------------------------------------------
// 適用中のフィルタ
// ---------------------------------------------
function drawChips() {
  const chips = [];
  const selCount = baseList().filter((m) => passFilters(m) && isSel(m.id)).length;

  chips.push(`<button class="chip sel ${onlySelected ? "on" : ""}" data-sel="1">
    選択中 (${selCount})</button>`);

  FILTERS.forEach((f) => {
    [...active[f.id]].forEach((v) => {
      const o = f.opts.find((x) => x.v === v);
      chips.push(`<button class="chip on" data-f="${f.id}" data-v="${v}">
        ${o?.chip ?? o?.label ?? v} <span class="x">×</span></button>`);
    });
  });

  if (activeCount()) chips.push(`<button class="chip clear-all" data-clear="1">すべて解除</button>`);

  $("#chips").innerHTML = chips.join("");
  $("#fb-n").hidden = !activeCount();
  $("#fb-n").textContent = activeCount();
}

$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (b.dataset.sel) onlySelected = !onlySelected;
  else if (b.dataset.clear) FILTERS.forEach((f) => active[f.id].clear());
  else if (b.dataset.f) active[b.dataset.f].delete(b.dataset.v);
  drawChips();
  render();
});

// ---------------------------------------------
// 検索
// ---------------------------------------------
$("#q").addEventListener("input", (e) => {
  keyword = e.target.value.trim();
  $("#clear").hidden = !keyword;
  render();
});
$("#clear").onclick = () => {
  keyword = "";
  $("#q").value = "";
  $("#clear").hidden = true;
  render();
  $("#q").focus();
};

// ---------------------------------------------
// タブごとの説明・トレイ
// ---------------------------------------------
const IC = {
  up:   `<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>`,
  down: `<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`,
  x:    `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
};
const posBadge = (p) => `<span class="pos pos-${p <= 3 ? p : "n"}">${p}</span>`;

function drawPanel() {
  if (tab === "climbed") {
    $("#panel").innerHTML = `<p class="lead">登ったことのある山を選んでください。踏破状況のリングに反映されます。</p>`;
    return;
  }

  if (tab === "fav") {
    const slots = Array.from({ length: MAX }, (_, i) => {
      const id = fav[i];
      const m = id ? byId.get(id) : null;
      if (!m) {
        return `<div class="slot empty">${posBadge(i + 1)}
          <span class="slot-name">${i === fav.length ? "下のリストから選ぶ" : ""}</span></div>`;
      }
      return `
        <div class="slot" data-i="${i}">
          ${posBadge(i + 1)}
          <span class="slot-name">${flags(m.countries)}${esc(label(m))}<small>${esc(m.kana)}${m.elevation ? `・${m.elevation}m` : ""}</small></span>
          <button class="slot-btn" data-mv="-1" aria-label="${esc(label(m))}の順位を上げる" ${i === 0 ? "disabled" : ""}>${IC.up}</button>
          <button class="slot-btn" data-mv="1"  aria-label="${esc(label(m))}の順位を下げる" ${i === fav.length - 1 ? "disabled" : ""}>${IC.down}</button>
          <button class="slot-btn x" data-rm="1" aria-label="${esc(label(m))}を外す">${IC.x}</button>
        </div>`;
    }).join("");

    $("#panel").innerHTML = `
      <p class="lead">登った山の中から、よかった山を5座まで選べます。<br>
        選んだ順に順位が付きます。矢印で並べ替えられます。</p>
      <div class="podium" id="podium">${slots}</div>`;
    return;
  }

  // 登ってみたい山
  const chips = [...wish].map((id) => byId.get(id)).filter(Boolean)
    .sort((a, b) => (b.elevation ?? 0) - (a.elevation ?? 0))
    .map((m) => `<button class="wish-chip" data-rm-wish="${m.id}" aria-label="${esc(label(m))}を外す">
        ${flags(m.countries)}${esc(label(m))}<i>×</i></button>`).join("");
  $("#panel").innerHTML = `
    <p class="lead">まだ登っていない山から、5座まで選べます。
      <span class="cap-n ${wish.size >= MAX ? "full" : ""}">${wish.size} / ${MAX}</span></p>
    <div class="wish-tray">${chips || `<p class="wish-empty">下のリストから選んでください。</p>`}</div>`;
}

$("#panel").addEventListener("click", (e) => {
  // よかった山の並べ替え・外す
  const slot = e.target.closest(".slot[data-i]");
  const btn = e.target.closest(".slot-btn");
  if (slot && btn && !btn.disabled) {
    const i = Number(slot.dataset.i);
    if (btn.dataset.rm) {
      fav.splice(i, 1);
    } else {
      const j = i + Number(btn.dataset.mv);
      if (j < 0 || j >= fav.length) return;
      [fav[i], fav[j]] = [fav[j], fav[i]];
      afterChange();
      // 動かした山が分かるように、移動先を一瞬光らせる
      const moved = document.querySelector(`.slot[data-i="${j}"]`);
      if (moved) { moved.classList.add("flash"); setTimeout(() => moved.classList.remove("flash"), 450); }
      return;
    }
    afterChange();
    return;
  }

  // 登ってみたい山を外す
  const chip = e.target.closest("[data-rm-wish]");
  if (chip) {
    wish.delete(Number(chip.dataset.rmWish));
    afterChange();
  }
});

// ---------------------------------------------
// リストの描画
// ---------------------------------------------
function render() {
  const kw = normalize(keyword);
  const base = baseList();

  // よかった山は、登った山が無いと選べない
  if (tab === "fav" && !base.length) {
    $("#list").innerHTML = `<div class="mt-empty">
      登った山がまだ登録されていません。<br>先に「登った山」から選んでください。
      <button class="btn ghost" data-goto="climbed" style="margin-top:12px">登った山を選ぶ</button></div>`;
    updateCount();
    return;
  }

  const list = base.filter((m) => {
    // 「選択中」は、種類や絞り込みに関係なく登録済みをすべて出す（外せなくならないように）
    if (onlySelected) return isSel(m.id);
    if (!visible(m, active, kw)) return false;
    if (!kw) return true;
    return normalize(m.name).includes(kw) || normalize(m.kana).includes(kw) || normalize(m.display_name).includes(kw);
  });

  const grouped = active.region.size !== 1;
  if (grouped) {
    // 国内の山頂はエリアごと。岩稜・景勝地・海外は、その後ろにまとめる
    list.sort((a, b) =>
      groupRank(a) - groupRank(b) ||
      (b.elevation ?? -1) - (a.elevation ?? -1));
  }

  // 絞り込みが効いていないときは件数を抑える（スクロール負荷を下げる）
  const sig = [tab, kw, onlySelected, ...FILTERS.map((f) => [...active[f.id]].sort().join("."))].join("|");
  if (sig !== lastSig) { pageLimit = PAGE; lastSig = sig; }
  const limited = !kw && !onlySelected && !activeCount() && list.length > pageLimit;
  const shown = limited ? list.slice(0, pageLimit) : list;

  $("#list").innerHTML = shown.length
    ? renderList(shown, grouped) +
      (limited
        ? `<div class="more-wrap">
             <button class="more-btn" data-more="1">さらに表示（残り${list.length - shown.length}座）</button>
             <p class="more-note">フィルタや検索で絞り込めます。</p>
           </div>`
        : "")
    : `<p class="mt-empty">${onlySelected
        ? "選択中の山はありません。"
        : "見つかりませんでした。<br>ひらがな・カタカナでも探せます（例：やり）"}</p>`;

  // ふだんの一覧の一番下に、岩稜・景勝地の入口（押すとそれらだけの表示に切り替える）
  if (!kw && !onlySelected && !active.extra.size && !limited) {
    $("#list").insertAdjacentHTML("beforeend", `
      <div class="extra-hint">
        <button class="extra-btn" data-extra="1">岩稜・難所・景勝地を見る</button>
        <p>大キレット・ジャンダルム・上高地・涸沢カールなども登録できます</p>
      </div>`);
  }

  updateCount();
}

// 見出しのまとまり：国内の山頂はエリア、それ以外は種類
const groupName = (m) => ({ ridge: "岩稜・難所", scenic: "景勝地・コース", overseas: "海外" })[cat(m)] ?? (m.area ?? "その他");
const groupRank = (m) => ({ ridge: 1000, scenic: 1001, overseas: 1002 })[cat(m)] ?? areaRank(m.area);

function renderList(list, grouped) {
  if (!grouped) return list.map(itemHtml).join("");
  let html = "";
  let last;
  for (const m of list) {
    const g = groupName(m);
    if (g !== last) {
      last = g;
      const n = list.filter((x) => groupName(x) === g).length;
      html += `<p class="area-head">${esc(g)}<span>${n}</span></p>`;
    }
    html += itemHtml(m);
  }
  return html;
}

const CHECK = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>`;
const STAR  = `<svg class="star" viewBox="0 0 24 24" stroke-linejoin="round"><path d="M12 3l2.7 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.4 6.5 20.4l1.1-6.3L3 9.7l6.3-.9z"/></svg>`;
const FLAGI = `<svg class="flag" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 5h12l-2 4 2 4H5"/></svg>`;

function itemHtml(m) {
  const on = isSel(m.id);
  const full = !on && ((tab === "fav" && fav.length >= MAX) || (tab === "wish" && wish.size >= MAX));

  let mark;
  if (tab === "climbed") mark = `<div class="mt-check">${CHECK}</div>`;
  else if (tab === "fav") mark = `<div class="mt-mark">${on ? posBadge(fav.indexOf(m.id) + 1) : STAR}</div>`;
  else mark = `<div class="mt-mark">${FLAGI}</div>`;

  const c = cat(m);
  const badge = m.meizan_rank
    ? `<span class="rank-badge rank-${m.meizan_rank}">${
        m.meizan_rank === 100 ? "百" : m.meizan_rank === 200 ? "二百" : "三百"}</span>`
    : c === "ridge" ? `<span class="kind-badge ridge">岩稜・難所</span>`
    : c === "scenic" ? `<span class="kind-badge">${m.kind === "course" ? "コース" : "景勝地"}</span>`
    : c === "overseas" && m.kind === "course" ? `<span class="kind-badge">トレッキング</span>`
    : "";
  return `
    <div class="mt-item ${tab}${on ? " on" : ""}${full ? " dim" : ""}" data-id="${m.id}">
      ${mark}
      <div class="mt-body">
        <p class="mt-name">${flags(m.countries)}${esc(label(m))}${badge}</p>
        <p class="mt-meta">${esc(m.kana)}${m.elevation ? ` ・ <span class="el">${m.elevation}m</span>` : ""}${m.prefs?.length ? ` ・ ${esc(m.prefs.join("・"))}` : ""}</p>
      </div>
    </div>`;
}

// 全角英数と大文字小文字、カタカナの差を吸収する
function normalize(s) {
  return (s ?? "")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .toLowerCase();
}

// ---------------------------------------------
// 選択の切り替え
// ---------------------------------------------
$("#list").addEventListener("click", (e) => {
  // 「岩稜・難所・景勝地を見る」：それらだけの表示に切り替える
  if (e.target.closest("[data-extra]")) {
    active.extra = new Set(["ridge", "scenic"]);
    PEAK_ONLY.forEach((id) => active[id].clear());
    drawChips();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if (e.target.closest("[data-more]")) {
    pageLimit += PAGE;
    const y = scrollY;
    render();
    window.scrollTo(0, y);   // 押した位置のまま、続きが下に足される
    return;
  }
  const go = e.target.closest("[data-goto]");
  if (go) { setTab(go.dataset.goto); return; }

  const item = e.target.closest(".mt-item");
  if (!item) return;
  const id = Number(item.dataset.id);
  const m = byId.get(id);

  if (tab === "climbed") {
    if (climbed.has(id)) {
      climbed.delete(id);
      // 登った山から外したら、よかった山からも外す
      if (fav.includes(id)) {
        fav = fav.filter((x) => x !== id);
        toast(`${m.name}を「登ってよかった山」からも外しました。`);
      }
    } else {
      climbed.add(id);
      // 登った山に入れたら、登ってみたい山からは外す
      if (wish.has(id)) {
        wish.delete(id);
        toast(`${m.name}を「登ってみたい山」から外しました。登頂おめでとうございます！`);
      }
    }
  } else if (tab === "fav") {
    if (fav.includes(id)) fav = fav.filter((x) => x !== id);
    else if (fav.length >= MAX) return toast(`選べるのは${MAX}座までです。どれかを外してください。`);
    else fav.push(id);
  } else {
    if (wish.has(id)) wish.delete(id);
    else if (wish.size >= MAX) return toast(`選べるのは${MAX}座までです。どれかを外してください。`);
    else wish.add(id);
  }

  // 「選択中」で絞っている最中は、外した山がその場から消える
  afterChange();
});

function afterChange() {
  // スクロール位置を保ったまま描き直す
  const y = scrollY;
  drawAll();
  window.scrollTo(0, y);
}

function drawAll() {
  drawTabCounts();
  drawPanel();
  drawChips();
  render();
}

// ---------------------------------------------
// 達成率のリング（登った山のタブだけ）と、変更の件数
// ---------------------------------------------
const RING_DEFS = [
  { id: "100", label: "百名山",   rank: 100,  total: 100, color: "#E0A33B" },
  { id: "200", label: "二百名山", rank: 200,  total: 100, color: "#8CA9BD" },
  { id: "300", label: "三百名山", rank: 300,  total: 100, color: "#B9C6BD" },
  { id: "other", label: "その他の山", rank: null, total: null, color: "#9CB0A3" },
  // 以下は登録があるときだけ出す
  { id: "ridge",    label: "岩稜・難所",     color: "#7C6A58", optional: true },
  { id: "overseas", label: "海外",           color: "#4F7FA8", optional: true },
  { id: "scenic",   label: "景勝地・コース", color: "#B9A27A", optional: true },
];

function updateCount() {
  const row = $("#count-row");
  row.hidden = tab !== "climbed";

  if (tab === "climbed") {
    const picked = active.rank.size ? RING_DEFS.filter((c) => active.rank.has(c.id)) : RING_DEFS;
    row.innerHTML = picked.map((c) => {
      const done = MOUNTAINS.filter((m) => cat(m) === c.id && climbed.has(m.id)).length;
      if (c.optional && !done) return "";
      return `<span class="cnt-pill"><i style="background:${c.color}"></i>${c.label}<b>${done}</b></span>`;
    }).join("");
  }

  const n = changeCount();
  $("#save-note").textContent = n ? `${n}件の変更（3つまとめて保存されます）` : "変更はありません";
}

function changeCount() {
  const setDiff = (a, b) => [...a].filter((x) => !b.has(x)).length + [...b].filter((x) => !a.has(x)).length;
  const favChanged = fav.length !== orig.fav.length || fav.some((id, i) => orig.fav[i] !== id);
  return setDiff(climbed, orig.climbed) + setDiff(wish, orig.wish) + (favChanged ? 1 : 0);
}

// ---------------------------------------------
// トースト（保存前の自動調整を知らせる）
// ---------------------------------------------
let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2800);
}

// ---------------------------------------------
// 保存：3つをまとめて1回で書き込む（途中で失敗しても半端な状態にならない）
// ---------------------------------------------
let saving = false;

$("#save").onclick = async () => {
  const msg = $("#msg");
  msg.className = "msg";
  msg.textContent = "";

  if (!changeCount()) { location.href = AFTER_SAVE; return; }

  const btn = $("#save");
  btn.disabled = true;
  btn.textContent = "保存しています…";
  saving = true;

  const { data, error } = await supabase.rpc("save_my_mountains", {
    p_climbed: [...climbed],
    p_favorites: fav,
    p_wishlist: [...wish],
  });

  if (error || !data?.ok) {
    saving = false;
    btn.disabled = false;
    btn.textContent = "保存する";
    const m = String(error?.message ?? "");
    msg.className = "msg error";
    msg.textContent =
      m.includes("favorite_limit") || m.includes("wishlist_limit") ? `選べるのは${MAX}座までです。`
      : m.includes("favorite_not_climbed") ? "登ってよかった山は、登った山から選んでください。"
      : "保存できませんでした：" + (m || "不明なエラー");
    return;
  }

  location.href = AFTER_SAVE;
};

// 保存せずにページを離れようとしたら確認する
addEventListener("beforeunload", (e) => {
  if (!saving && changeCount()) { e.preventDefault(); e.returnValue = ""; }
});

// ---------------------------------------------
// 最初の描画（RING_DEFS などの宣言より後で呼ぶ）
// ---------------------------------------------
setTab(tab);
</script>
