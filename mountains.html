<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登った山｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
/* ---------- 上部（カテゴリ＋達成率＋検索＋タグ） ---------- */
.head-bar {
  position: sticky; top: 0; z-index: 30;
  background: var(--birch);
  padding: 10px 0 8px;
  margin: 0 -18px;              /* wrap の余白を打ち消して全幅に */
}
.head-in { padding: 0 18px; }


/* 達成率 */
.count-row {
  display: flex; align-items: flex-start; gap: 16px; margin-top: 12px;
  overflow-x: auto; padding-bottom: 2px;
}
.count-row::-webkit-scrollbar { display: none; }
.ring-item { text-align: center; flex: none; }
.ring-label { font-size: 10px; font-weight: 700; margin-top: 4px; line-height: 1.3; }
.ring-rest { font-size: 9px; color: var(--stone); margin-top: 1px; }
.ring { position: relative; width: 52px; height: 52px; flex: none; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; }
.ring-num {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-num b { font-family: var(--mono); font-size: 15px; font-weight: 700; line-height: 1; }
.ring-num span { font-size: 7.5px; color: var(--stone); margin-top: 1px; }

/* 検索 */
.search-wrap { position: relative; margin-top: 10px; }
.search-wrap input {
  width: 100%; font-family: var(--font); font-size: 15px;
  background: var(--paper); border: 1.6px solid var(--line);
  border-radius: 999px; padding: 10px 40px 10px 40px; outline: none;
}
.search-wrap input:focus {
  border-color: var(--fjord); box-shadow: 0 0 0 3px rgba(70,112,143,.12);
}
.search-wrap .ic {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; stroke: var(--stone); fill: none; stroke-width: 2;
}
.search-wrap .clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 25px; height: 25px; border: none; background: #EDF3EF;
  border-radius: 50%; color: var(--stone); cursor: pointer;
  font-size: 13px; line-height: 1; font-family: var(--font);
}


/* ---------- 山のリスト（コンパクト） ---------- */
.mt-list { margin-top: 10px; }
.mt-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--paper); border-radius: 12px;
  box-shadow: var(--shadow-card); padding: 8px 12px; margin-bottom: 5px;
  cursor: pointer; border: 1.6px solid transparent;
  transition: background .12s;
}
.mt-item.on { border-color: var(--sun); background: #FCF6EA; }

.mt-check {
  width: 20px; height: 20px; border-radius: 6px; flex: none;
  border: 2px solid var(--line); background: var(--paper);
  display: flex; align-items: center; justify-content: center;
}
.mt-item.on .mt-check { background: var(--sun); border-color: var(--sun); }
.mt-check svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 3; opacity: 0; }
.mt-item.on .mt-check svg { opacity: 1; }

.mt-body { flex: 1; min-width: 0; }
.mt-name {
  font-size: 13px; font-weight: 700; line-height: 1.4;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.mt-meta { font-size: 10px; color: var(--stone); margin-top: 1px; }
.mt-meta .el { font-family: var(--mono); }

.rank-badge {
  font-size: 8.5px; font-weight: 900; font-family: var(--mono);
  border-radius: 4px; padding: 1px 5px; flex: none;
}
.rank-100 { background: var(--sun);   color: #fff; }
.rank-200 { background: #8CA9BD;      color: #fff; }
.rank-300 { background: #B9C6BD;      color: #fff; }

.mt-empty {
  text-align: center; font-size: 12.5px; color: var(--stone);
  padding: 36px 20px; line-height: 2;
}
.more-note {
  text-align: center; font-size: 11.5px; color: var(--stone);
  padding: 14px 20px 4px; line-height: 1.9;
}

/* ---------- 検索とフィルタ ---------- */
.tool-row { display: flex; gap: 8px; margin-top: 11px; }
.search-wrap { flex: 1; }
.filter-btn {
  flex: none; display: flex; align-items: center; gap: 5px;
  font-family: var(--font); font-size: 12.5px; font-weight: 700;
  color: var(--pine); background: var(--paper);
  border: 1.6px solid var(--line); border-radius: 999px;
  padding: 0 15px; cursor: pointer;
}
.filter-btn svg { width: 15px; height: 15px; stroke: var(--pine); stroke-width: 2; }
.fb-n {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  background: var(--sun); color: #fff; border-radius: 999px;
  min-width: 16px; padding: 1px 5px; text-align: center;
}

/* ---------- 適用中のフィルタ ---------- */
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 9px; }
.chip {
  font-family: var(--font); font-size: 11.5px; font-weight: 700;
  border: 1.4px solid var(--line); border-radius: 999px;
  padding: 5px 11px; cursor: pointer; background: var(--paper); color: #45564e;
}
.chip.on { background: var(--pine); color: #fff; border-color: var(--pine); }
.chip .x { margin-left: 3px; opacity: .7; }
.chip.sel { border-color: var(--sun); color: #96701E; background: #FCF6EA; }
.chip.sel.on { background: var(--sun); color: #fff; border-color: var(--sun); }
.chip.clear-all { color: var(--stone); border-style: dashed; }

/* ---------- フィルタのポップアップ ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(30,58,49,.42);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet-in {
  background: var(--birch); width: 100%; max-width: 430px;
  border-radius: 22px 22px 0 0; max-height: 86vh;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slideUp .26s cubic-bezier(.22,.9,.3,1);
}
@keyframes slideUp { from { transform: translateY(100%); } }

.sheet-head {
  display: flex; align-items: center; padding: 16px 20px 10px;
  border-bottom: 1px solid var(--line);
}
.sheet-t { font-size: 15px; font-weight: 900; flex: 1; }
.sheet-x {
  width: 30px; height: 30px; border: none; background: #EDF3EF;
  border-radius: 50%; color: var(--stone); font-size: 18px;
  line-height: 1; cursor: pointer; font-family: var(--font);
}

.sheet-body { flex: 1; overflow-y: auto; padding: 4px 20px 16px; }
.f-group { margin-top: 18px; }
.f-title {
  font-size: 11px; font-weight: 900; color: var(--stone);
  letter-spacing: 1px; margin-bottom: 7px;
}
.f-opts { display: flex; flex-direction: column; gap: 5px; }
.f-opt {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: var(--paper); border: 1.6px solid transparent;
  border-radius: 12px; padding: 10px 13px; cursor: pointer;
  font-family: var(--font); text-align: left; box-shadow: var(--shadow-card);
}
.f-opt.on { border-color: var(--sun); background: #FCF6EA; }
.f-box {
  width: 19px; height: 19px; border-radius: 6px; flex: none;
  border: 2px solid var(--line); background: var(--paper);
  display: flex; align-items: center; justify-content: center;
}
.f-opt.on .f-box { background: var(--sun); border-color: var(--sun); }
.f-box svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3.2; opacity: 0; }
.f-opt.on .f-box svg { opacity: 1; }
.f-label { flex: 1; font-size: 13px; font-weight: 700; color: var(--pine); }
.f-n { font-family: var(--mono); font-size: 11px; color: var(--stone); flex: none; }

.sheet-foot {
  display: flex; gap: 9px; padding: 12px 20px 16px;
  border-top: 1px solid var(--line); background: var(--birch);
}
.sheet-foot .btn { flex: 1; }
.sheet-foot .btn.ghost { flex: 0 0 38%; }

/* ---------- エリアの見出し ---------- */
.area-head {
  font-size: 11px; font-weight: 900; color: var(--stone);
  letter-spacing: .5px; margin: 14px 0 6px; padding-left: 2px;
  display: flex; align-items: center; gap: 7px;
}
.area-head::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.area-head span {
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  background: #E7EEE9; border-radius: 999px; padding: 1px 7px; order: 1;
}
.mt-list > .area-head:first-child { margin-top: 4px; }

/* ---------- 保存バー ---------- */
.save-bar {
  position: sticky; bottom: 0; z-index: 20;
  background: linear-gradient(to top, var(--birch) 72%, transparent);
  padding: 14px 0 16px; margin-top: 6px;
}
.save-bar .btn { margin-top: 0; }
.save-note { font-size: 11px; color: var(--stone); text-align: center; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div class="head-bar">
      <div class="head-in">
        <div class="count-row" id="count-row"></div>

        <div class="tool-row">
          <div class="search-wrap">
            <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
            </svg>
            <input type="text" id="q" placeholder="山名・よみで探す"
                   autocomplete="off" inputmode="search">
            <button class="clear" id="clear" hidden>×</button>
          </div>
          <button class="filter-btn" id="filter-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5h18M6 12h12M10 19h4"/>
            </svg>
            フィルタ<span class="fb-n" id="fb-n" hidden>0</span>
          </button>
        </div>

        <div class="chips-row" id="chips"></div>
      </div>
    </div>

    <div class="mt-list" id="list"></div>

    <div class="save-bar">
      <p class="save-note" id="save-note"></p>
      <button class="btn sun" id="save">保存する</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <!-- フィルタのポップアップ -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-head">

      </div>

      <div class="sheet-foot">
        <button class="btn ghost" id="f-reset" style="margin-top:0">すべて解除</button>
        <button class="btn sun"   id="f-apply" style="margin-top:0">

        </button>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";

const $ = (s) => document.querySelector(s);

mountHeader(signOut);

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

// ---------------------------------------------
// 山マスタと、登録済みの山
// ---------------------------------------------
const [mtRes, myRes] = await Promise.all([
  supabase.from("mountains")
          .select("id, name, kana, elevation, area, prefs, region, meizan_rank, is_popular")
          .order("elevation", { ascending: false }),
  supabase.from("climbed_mountains")
          .select("mountain_id")
          .eq("user_id", user.id),
]);

if (mtRes.error) {
  window.__showFatal("山のデータを読み込めませんでした", mtRes.error.message);
  throw mtRes.error;
}

const MOUNTAINS = mtRes.data ?? [];
const original = new Set((myRes.data ?? []).map((r) => r.mountain_id));
const selected = new Set(original);

// ---------------------------------------------
// フィルタの定義
//
// 名山・エリア・人気・標高の4つ。すべてAND条件で、
// 同じ区分の中で複数選んだときはOR条件になる。
// 何も選ばれていない区分は「絞り込まない」扱い。
// ---------------------------------------------
const FILTERS = [
  {
    id: "rank", title: "名山",
    opts: [
      { v: "100",   label: "百名山" },
      { v: "200",   label: "二百名山" },
      { v: "300",   label: "三百名山" },
      { v: "other", label: "リスト外" },
    ],
    match: (m, v) => v === "other" ? m.meizan_rank === null : String(m.meizan_rank) === v,
  },
  {
    id: "region", title: "エリア",
    opts: [
      { v: "north",       label: "北海道・東北" },
      { v: "kita_alps",   label: "北アルプス" },
      { v: "minami_alps", label: "南・中央アルプス" },
      { v: "koshin",      label: "八ヶ岳・奥秩父・甲信" },
      { v: "kanto",       label: "関東・上信越・日光" },
      { v: "tokai",       label: "東海・近畿・北陸" },
      { v: "west",        label: "中国・四国・九州・沖縄" },
    ],
    match: (m, v) => m.region === v,
  },
  {
    id: "popular", title: "人気の山",
    opts: [{ v: "1", label: "人気の山だけ表示" }],
    match: (m) => !!m.is_popular,
  },
  {
    id: "band", title: "標高",
    opts: [
      { v: "low",  label: "〜1500m（低山・近郊）" },
      { v: "mid",  label: "1500〜2500m（中高山）" },
      { v: "high", label: "2500m〜（高山・アルプス）" },
    ],
    match: (m, v) => {
      const e = m.elevation ?? 0;
      return v === "low" ? e < 1500 : v === "mid" ? e >= 1500 && e < 2500 : e >= 2500;
    },
  },
];

// 選択状態。下書き（ポップアップの中）と確定を分ける
const active = {};
let draft = {};
FILTERS.forEach((f) => (active[f.id] = new Set()));

// 「選択中だけ」はフィルタとは別扱い
let onlySelected = false;
let keyword = "";

// ---------------------------------------------
// 絞り込み
// ---------------------------------------------
function passFilters(m, state = active) {
  for (const f of FILTERS) {
    const set = state[f.id];
    if (!set || !set.size) continue;          // 未選択なら絞らない
    if (![...set].some((v) => f.match(m, v))) return false;
  }
  return true;
}

function countWith(state) {
  return MOUNTAINS.filter((m) => passFilters(m, state)).length;
}

function activeCount() {
  return FILTERS.reduce((n, f) => n + active[f.id].size, 0);
}

// ---------------------------------------------
// ポップアップ
// ---------------------------------------------
$("#filter-btn").onclick = () => {
  // いまの状態を下書きにコピーしてから開く
  draft = {};
  FILTERS.forEach((f) => (draft[f.id] = new Set(active[f.id])));
  drawSheet();
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
};

function closeSheet() {
  $("#sheet").hidden = true;
  document.body.style.overflow = "";
}
$("#sheet-x").onclick = closeSheet;
$("#sheet").onclick = (e) => { if (e.target === $("#sheet")) closeSheet(); };

function drawSheet() {
  $("#sheet-body").innerHTML = FILTERS.map((f) => `
    <div class="f-group">
      <p class="f-title">${f.title}</p>
      <div class="f-opts">
        ${f.opts.map((o) => {
          const on = draft[f.id].has(o.v);
          const n = MOUNTAINS.filter((m) => f.match(m, o.v)).length;
          return `
            <button class="f-opt ${on ? "on" : ""}" data-f="${f.id}" data-v="${o.v}">
              <span class="f-box">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12l6 6L20 6"/>
                </svg>
              </span>
              <span class="f-label">${o.label}</span>
              <span class="f-n">${n}</span>
            </button>`;
        }).join("")}
      </div>
    </div>`).join("");

  $("#f-count").textContent = countWith(draft);
}

$("#sheet-body").addEventListener("click", (e) => {
  const b = e.target.closest(".f-opt");
  if (!b) return;
  const set = draft[b.dataset.f];
  if (set.has(b.dataset.v)) set.delete(b.dataset.v);
  else set.add(b.dataset.v);
  drawSheet();
});

$("#f-reset").onclick = () => {
  FILTERS.forEach((f) => draft[f.id].clear());
  drawSheet();
};

$("#f-apply").onclick = () => {
  FILTERS.forEach((f) => (active[f.id] = new Set(draft[f.id])));
  onlySelected = false;
  closeSheet();
  drawChips();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// ---------------------------------------------
// 適用中のフィルタを、押せるチップで見せる
// ---------------------------------------------
function drawChips() {
  const chips = [];
  const selCount = MOUNTAINS.filter((m) => passFilters(m) && selected.has(m.id)).length;

  chips.push(`<button class="chip sel ${onlySelected ? "on" : ""}" data-sel="1">
    選択中 (${selCount})</button>`);

  FILTERS.forEach((f) => {
    [...active[f.id]].forEach((v) => {
      const o = f.opts.find((x) => x.v === v);
      chips.push(`<button class="chip on" data-f="${f.id}" data-v="${v}">
        ${o?.label ?? v} <span class="x">×</span></button>`);
    });
  });

  if (activeCount()) {
    chips.push(`<button class="chip clear-all" data-clear="1">すべて解除</button>`);
  }

  $("#chips").innerHTML = chips.join("");
  $("#fb-n").hidden = !activeCount();
  $("#fb-n").textContent = activeCount();
}

$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;

  if (b.dataset.sel) {
    onlySelected = !onlySelected;
  } else if (b.dataset.clear) {
    FILTERS.forEach((f) => active[f.id].clear());
  } else if (b.dataset.f) {
    active[b.dataset.f].delete(b.dataset.v);
  }
  drawChips();
  render();
});

// ---------------------------------------------
// 検索
// ---------------------------------------------
$("#q").addEventListener("input", (e) => {
  keyword = e.target.value.trim();
  $("#clear").hidden = !keyword;
  render();
});

$("#clear").onclick = () => {
  keyword = "";
  $("#q").value = "";
  $("#clear").hidden = true;
  render();
  $("#q").focus();
};

// ---------------------------------------------
// リストの描画
// カテゴリ ＋ エリア ＋ 選択中 ＋ 検索 をすべてAND条件で絞る
// ---------------------------------------------
function render() {
  const kw = normalize(keyword);

  const list = MOUNTAINS.filter((m) => {
    if (!passFilters(m)) return false;
    if (onlySelected && !selected.has(m.id)) return false;
    if (!kw) return true;
    return normalize(m.name).includes(kw) || normalize(m.kana).includes(kw);
  });

  // エリアで絞っていないときは、エリア別（北から南）に並べる。
  // 標高順だけだと山域がばらけて、繋がりが見えにくいため。
  // 同じエリアの中は標高の高い順（元の並び）を保つ。
  // エリアを1つだけに絞っているときは見出しが不要
  const grouped = active.region.size !== 1;
  if (grouped) {
    list.sort((a, b) =>
      areaRank(a.area) - areaRank(b.area) ||
      (b.elevation ?? 0) - (a.elevation ?? 0));
  }

  // 絞り込みが効いていないときは件数を抑える（スクロール負荷を下げる）
  const limited = !kw && !onlySelected && !activeCount() && list.length > 80;
  const shown = limited ? list.slice(0, 80) : list;

  $("#list").innerHTML = shown.length
    ? renderList(shown, grouped) +
      (limited
        ? `<p class="more-note">ほか ${list.length - shown.length}座。<br>
             エリアや検索で絞り込めます。</p>`
        : "")
    : `<p class="mt-empty">${onlySelected
        ? "選択中の山はありません。"
        : "見つかりませんでした。<br>ひらがな・カタカナでも探せます（例：やり）"}</p>`;

  updateCount();
}

// エリアごとに見出しを挟んで並べる
function renderList(list, grouped) {
  if (!grouped) return list.map(itemHtml).join("");

  let html = "";
  let lastArea = null;
  for (const m of list) {
    if (m.area !== lastArea) {
      lastArea = m.area;
      const n = list.filter((x) => x.area === lastArea).length;
      html += `<p class="area-head">${lastArea ?? "その他"}<span>${n}</span></p>`;
    }
    html += itemHtml(m);
  }
  return html;
}

function itemHtml(m) {
  const on = selected.has(m.id);
  const badge = m.meizan_rank
    ? `<span class="rank-badge rank-${m.meizan_rank}">${
        m.meizan_rank === 100 ? "百" : m.meizan_rank === 200 ? "二百" : "三百"}</span>`
    : "";
  return `
    <div class="mt-item${on ? " on" : ""}" data-id="${m.id}">
      <div class="mt-check">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12l6 6L20 6"/>
        </svg>
      </div>
      <div class="mt-body">
        <p class="mt-name">${m.name}${badge}</p>
        <p class="mt-meta">${m.kana}${m.elevation ? ` ・ <span class="el">${m.elevation}m</span>` : ""}${m.prefs?.length ? ` ・ ${m.prefs.join("・")}` : ""}</p>
      </div>
    </div>`;
}

// 全角英数と大文字小文字、カタカナの差を吸収する
function normalize(s) {
  return (s ?? "")
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .toLowerCase();
}

// ---------------------------------------------
// 選択の切り替え
// ---------------------------------------------
$("#list").addEventListener("click", (e) => {
  const item = e.target.closest(".mt-item");
  if (!item) return;
  const id = Number(item.dataset.id);

  if (selected.has(id)) { selected.delete(id); item.classList.remove("on"); }
  else                  { selected.add(id);    item.classList.add("on"); }

  // 「選択中」で絞っている最中に外したら、その場から消す
  if (onlySelected && !selected.has(id)) {
    item.remove();
    if (!$("#list").querySelector(".mt-item")) render();
  }

  drawChips();
  updateCount();
});

// ---------------------------------------------
// 達成率の表示
// ---------------------------------------------
const RING_DEFS = [
  { id: "100", label: "百名山",   rank: 100,  total: 100, color: "#E0A33B" },
  { id: "200", label: "二百名山", rank: 200,  total: 100, color: "#8CA9BD" },
  { id: "300", label: "三百名山", rank: 300,  total: 100, color: "#B9C6BD" },
  { id: "other", label: "その他", rank: null, total: null, color: "#9CB0A3" },
];

function updateCount() {
  // 名山のフィルタが効いているときは、そのランクだけを出す
  const picked = active.rank.size
    ? RING_DEFS.filter((c) => active.rank.has(c.id))
    : RING_DEFS;

  const rings = picked.map((c) => {
    const inThis = (m) => c.rank === null
      ? m.meizan_rank === null
      : m.meizan_rank === c.rank;

    const done  = MOUNTAINS.filter((m) => inThis(m) && selected.has(m.id)).length;
    const total = c.total ?? MOUNTAINS.filter(inThis).length;
    const R = 22, C = 2 * Math.PI * R;

    return `
      <div class="ring-item">
        <div class="ring">
          <svg viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="${R}" fill="none" stroke="#E7EEE9" stroke-width="5"/>
            <circle cx="26" cy="26" r="${R}" fill="none" stroke="${c.color}" stroke-width="5"
                    stroke-linecap="round" stroke-dasharray="${C}"
                    stroke-dashoffset="${total ? C * (1 - done / total) : C}"
                    transform="rotate(-90 26 26)"/>
          </svg>
          <div class="ring-num"><b>${done}</b><span>/${total}</span></div>
        </div>
        <p class="ring-label">${c.label}</p>
        <p class="ring-rest">${
          total && done >= total ? "完登" : total ? `あと${total - done}` : ""}</p>
      </div>`;
  });

  $("#count-row").innerHTML = rings.join("");

  const added = [...selected].filter((id) => !original.has(id)).length;
  const removed = [...original].filter((id) => !selected.has(id)).length;
  $("#save-note").textContent =
    added || removed
      ? `${added ? `+${added}座` : ""}${added && removed ? " / " : ""}${removed ? `−${removed}座` : ""} の変更`
      : "変更はありません";
}

// ---------------------------------------------
// 保存（差分だけを書き込む）
// ---------------------------------------------
$("#save").onclick = async () => {
  const toAdd    = [...selected].filter((id) => !original.has(id));
  const toRemove = [...original].filter((id) => !selected.has(id));

  const msg = $("#msg");
  msg.className = "msg";
  msg.textContent = "";

  if (!toAdd.length && !toRemove.length) {
    location.href = "./card.html";
    return;
  }

  const btn = $("#save");
  btn.disabled = true;
  btn.textContent = "保存しています…";

  try {
    if (toRemove.length) {
      const { error } = await supabase
        .from("climbed_mountains")
        .delete()
        .eq("user_id", user.id)
        .in("mountain_id", toRemove);
      if (error) throw error;
    }
    if (toAdd.length) {
      const { error } = await supabase
        .from("climbed_mountains")
        .insert(toAdd.map((mountain_id) => ({ user_id: user.id, mountain_id })));
      if (error) throw error;
    }
    location.href = "./card.html";
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "保存する";
    msg.className = "msg error";
    msg.textContent = "保存できませんでした：" + err.message;
  }
};
</script>
</body>
</html>
