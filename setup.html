<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>プロフィール編集｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  .avatar-wrap { text-align: center; margin: 18px 0 4px; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto; border-radius: 50%;
    overflow: hidden; background: var(--paper); border: 4px solid var(--paper);
    box-shadow: 0 4px 14px rgba(30,58,49,.16);
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar-cap { font-size: 11px; color: var(--stone); margin-top: 8px; line-height: 1.8; }

  .group { margin-top: 26px; }
  .group > h2 { font-size: 13px; font-weight: 900; }
  .group > .d { font-size: 11.5px; color: var(--stone); margin-top: 3px; line-height: 1.8; }

  .sns-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .sns-row input { flex: 1; }
  .sns-row .pre { font-size: 11px; color: var(--stone); flex: none; }

  .vis-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper); border-radius: 12px;
    box-shadow: var(--shadow-card); padding: 11px 15px; margin-top: 8px;
  }
  .vis-row .t { flex: 1; font-size: 13px; font-weight: 700; }
  .tog {
    width: 42px; height: 24px; border-radius: 999px; background: #DCE4DF;
    position: relative; cursor: pointer; flex: none; border: none;
    transition: background .18s;
  }
  .tog::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff;
    transition: transform .18s;
  }
  .tog.on { background: var(--sun); }
  .tog.on::after { transform: translateX(18px); }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="form" hidden>
    <p class="brand" id="brand">ハイカーズ<span>カード</span></p>

    <h1 id="title">プロフィールを作る</h1>
    <p class="sub">あとから何度でも変更できます。</p>

    <div class="avatar-wrap">
      <div class="avatar" id="avatar"></div>
      <p class="avatar-cap" id="avatar-cap"></p>
    </div>

    <div class="field">
      <label>表示名 <b>必須</b></label>
      <input type="text" id="name" maxlength="20" placeholder="やまだ">
      <p class="count"><span id="name-count">0</span> / 20</p>
    </div>

    <div class="field">
      <label>ひとこと</label>
      <textarea id="comment" maxlength="120" rows="3"
                placeholder="例：週末は近郊の低山めぐり。&#10;いつか槍ヶ岳に登りたい。"></textarea>
      <p class="count"><span id="comment-count">0</span> / 120</p>
    </div>

    <!-- 背景デザイン -->
    <div class="group" id="bg-group">
      <h2>カードの背景</h2>
      <p class="d">カードの雰囲気が変わります。カードを交換すると、使える背景が増えていきます。</p>
      <div id="bgs" style="margin-top:12px"></div>
      <div id="bg-msg" class="msg"></div>
    </div>

    <!-- 名山の公開設定 -->
    <div class="group" id="vis-group">
      <h2>カードに載せる踏破状況</h2>
      <p class="d">オフにしたものはカードに表示されません。<br>
        登録した山そのものは消えません。</p>
      <div id="vis"></div>
    </div>

    <!-- SNS -->
    <div class="group" id="sns-group">
      <h2>SNSリンク</h2>
      <p class="d">
        入力したものだけカードに表示されます。<br>
        ユーザー名（IDの部分）だけを入れてください。
      </p>
      <div id="sns"></div>
    </div>

    <div class="url-box" id="url-box"></div>

    <button class="btn sun" id="save">保存する</button>
    <div id="msg" class="msg"></div>

    <p class="terms" id="later">診断・行った山は、あとから追加できます。</p>
  </div>
</div>

<script src="./data.js"></script>
<script src="./characters.js"></script>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser, getMyProfile, signOut, baseUrl } from "./supabase.js";
import { mountHeader } from "./header.js";
import { BG, THEMES, SILHOUETTE, SNS, snsIcon, applyTheme,
         renderBgPicker, normalizeBg, bgUnlocked } from "./card.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) { location.replace("./login.html"); throw new Error("redirect"); }

const profile = await getMyProfile();
if (!profile) {
  window.__showFatal("プロフィールを読み込めませんでした", "ページを再読み込みしてください。");
  throw new Error("no profile");
}

// 初回（表示名なし）はヘッダーを出さない。まず設定に集中してもらう
const isFirst = !profile.display_name;
if (!isFirst) {
  mountHeader(signOut);
  $("#wrap").classList.add("has-hd");
  $("#brand").hidden = true;
  $("#title").textContent = "プロフィール編集";
  $("#later").textContent = "";
}

// ---------------------------------------------
// アイコン
// ---------------------------------------------
const diagnosed = !!profile.type_code;
$("#avatar").innerHTML = diagnosed ? characterSVG(profile.type_code) : SILHOUETTE;
$("#avatar-cap").innerHTML = diagnosed
  ? `アイコンは診断結果の<b style="color:var(--pine)">${CHARACTERS[profile.type_code].animal}</b>です`
  : "診断を受けると、あなたのキャラに変わります";

// ---------------------------------------------
// 初期値
// ---------------------------------------------
const nameInput = $("#name");
const commentInput = $("#comment");
nameInput.value = profile.display_name ?? "";
commentInput.value = profile.comment ?? "";

let bg = normalizeBg(profile.card_bg);
const keepBg = bg;   // いま使っている背景は、交換枚数が足りなくてもそのまま選べる
applyTheme(bg);

// 交換した枚数（背景の鍵の判定に使う）
const { count: exCount } = await supabase.from("exchanges").select("id", { count: "exact", head: true });
const exchanges = exCount ?? 0;

// 名山ランクごとの公開設定
const vis = {
  100: profile.vis_rank_100 !== false,
  200: profile.vis_rank_200 !== false,
  300: profile.vis_rank_300 !== false,
  other: profile.vis_rank_other !== false,
};

const RANK_LABELS = [
  { key: 100, label: "日本百名山" },
  { key: 200, label: "日本二百名山" },
  { key: 300, label: "日本三百名山" },
  { key: "other", label: "その他（名山リスト外の山）" },
];

function drawVis() {
  $("#vis").innerHTML = RANK_LABELS.map((r) => `
    <div class="vis-row">
      <span class="t">${r.label}</span>
      <button type="button" class="tog ${vis[r.key] ? "on" : ""}" data-rank="${r.key}"
        aria-label="${r.label}を${vis[r.key] ? "非表示" : "表示"}にする"></button>
    </div>`).join("");
}
drawVis();

$("#vis").addEventListener("click", (e) => {
  const b = e.target.closest(".tog");
  if (!b) return;
  const k = b.dataset.rank;
  vis[k] = !vis[k];
  drawVis();
});

$("#url-box").innerHTML = `あなたのカードのURL<br>${baseUrl()}u/<b>${profile.public_id}</b>`;

// ---------------------------------------------
// 背景の選択
// ---------------------------------------------
function drawBgs() {
  $("#bgs").innerHTML = renderBgPicker(bg, exchanges, { keep: keepBg });
}
drawBgs();

$("#bgs").addEventListener("click", (e) => {
  const b = e.target.closest(".bg-chip");
  if (!b) return;
  const id = b.dataset.id;
  const m = $("#bg-msg");
  // 鍵がかかっている背景：あと何枚で使えるかを知らせる
  if (b.classList.contains("locked")) {
    const need = Number(b.dataset.need);
    m.className = "msg error";
    m.textContent = `「${THEMES.find((t) => t.id === id).name}」は、カードをあと${need - exchanges}枚交換すると使えます。`;
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    return;
  }
  m.className = "msg"; m.textContent = "";
  bg = id;
  applyTheme(bg);     // 選んだ瞬間に画面全体で試せる
  drawBgs();
});

// ---------------------------------------------
// SNS
// ---------------------------------------------
const SNS_KEYS = ["yamap", "yamareco", "instagram", "x"];
const HINT = {
  yamap: "YAMAPのユーザーID",
  yamareco: "ヤマレコのユーザーID（数字）",
  instagram: "@なしのユーザー名",
  x: "@なしのユーザー名",
};

$("#sns").innerHTML = SNS_KEYS.map((k) => {
  const s = SNS[k];
  const v = profile["sns_" + k] ?? "";
  return `
    <div class="sns-row">
      ${snsIcon(k)}
      <input type="text" id="sns-${k}" maxlength="60"
             placeholder="${HINT[k]}" value="${escAttr(v)}" autocomplete="off">
    </div>`;
}).join("");

// ---------------------------------------------
// 文字数
// ---------------------------------------------
function counts() {
  $("#name-count").textContent = nameInput.value.length;
  $("#comment-count").textContent = commentInput.value.length;
}
nameInput.addEventListener("input", counts);
commentInput.addEventListener("input", counts);
counts();

$("#loading").hidden = true;
$("#form").hidden = false;

// 編集画面から「背景」「SNS」などを指定して来た場合は、その位置まで送る
if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) {
    requestAnimationFrame(() => {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
}

// ---------------------------------------------
// 保存
// ---------------------------------------------
$("#save").onclick = async () => {
  const name = nameInput.value.trim();
  const msg = $("#msg");
  msg.className = "msg";
  msg.textContent = "";

  if (!name) {
    msg.className = "msg error";
    msg.textContent = "表示名を入力してください。";
    nameInput.focus();
    return;
  }

  const btn = $("#save");
  btn.disabled = true;
  btn.textContent = "保存しています…";

  const payload = {
    display_name: name,
    comment: commentInput.value.trim() || null,
    card_bg: bg,
    vis_rank_100: vis[100],
    vis_rank_200: vis[200],
    vis_rank_300: vis[300],
    vis_rank_other: vis.other,
  };
  SNS_KEYS.forEach((k) => {
    // @や空白を取り除いて保存する
    const v = $(`#sns-${k}`).value.trim().replace(/^@+/, "");
    payload["sns_" + k] = v || null;
  });

  const { error } = await supabase.from("profiles").update(payload).eq("id", user.id);

  btn.disabled = false;
  btn.textContent = "保存する";

  if (error) {
    msg.className = "msg error";
    msg.textContent = String(error.message).includes("bg_locked")
      ? "選んだ背景は、カードの交換枚数がまだ足りないため使えません。"
      : "保存できませんでした：" + error.message;
    return;
  }

  // 交換URLから来た場合は、そのまま交換へ戻す
  if (localStorage.getItem("pendingExchangeToken")) {
    location.href = "./card.html";
    return;
  }
  location.href = "./card.html";
};

function escAttr(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
