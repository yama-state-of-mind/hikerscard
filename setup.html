<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>プロフィールを作る｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  .avatar-wrap { text-align: center; margin: 20px 0 4px; }
  .avatar {
    width: 96px; height: 96px; margin: 0 auto;
    border-radius: 50%; overflow: hidden;
    background: var(--paper); border: 4px solid var(--paper);
    box-shadow: 0 4px 14px rgba(30, 58, 49, .16);
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar-cap {
    font-size: 11px; color: var(--stone);
    margin-top: 8px; line-height: 1.8;
  }
</style>
</head>
<body>

<div class="wrap">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="form" hidden>
    <p class="brand">ハイカーズ<span>カード</span></p>

    <h1 id="title">プロフィールを作る</h1>
    <p class="sub">あとから何度でも変更できます。</p>

    <div class="avatar-wrap">
      <div class="avatar">
        <!-- 未診断のシルエット。診断を実装したらタイプのキャラに差し替える -->
        <svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <circle cx="80" cy="80" r="78" fill="#EDF3EF"/>
          <circle cx="80" cy="64" r="26" fill="#C3D0C8"/>
          <path d="M80 96 C52 96 34 116 32 146 L128 146 C126 116 108 96 80 96 Z" fill="#C3D0C8"/>
          <path d="M104 40 L116 22 L128 40 Z" fill="#DCE4DF"/>
          <path d="M120 40 L132 26 L142 40 Z" fill="#DCE4DF"/>
        </svg>
      </div>
      <p class="avatar-cap">診断を受けると、あなたのキャラに変わります</p>
    </div>

    <div class="field">
      <label>表示名 <b>必須</b></label>
      <input type="text" id="name" maxlength="20" placeholder="やまだ">
      <p class="count"><span id="name-count">0</span> / 20</p>
    </div>

    <div class="field">
      <label>ひとこと</label>
      <input type="text" id="comment" maxlength="50"
             placeholder="例：先週テント泊デビューしました">
      <p class="count"><span id="comment-count">0</span> / 50</p>
    </div>

    <div class="url-box">
      あなたのカードのURL<br>
      <span id="url"></span>
    </div>

    <button class="btn sun" id="save">保存する</button>
    <div id="msg" class="msg"></div>

    <p class="terms" id="later">
      診断・行った山は、あとから追加できます。
    </p>
  </div>
</div>

<script type="module">
import { supabase, getUser, getMyProfile, baseUrl } from "./supabase.js";

const loading = document.getElementById("loading");
const form    = document.getElementById("form");
const msg     = document.getElementById("msg");

const nameInput    = document.getElementById("name");
const commentInput = document.getElementById("comment");

// 未ログインならログイン画面へ
const user = await getUser();
if (!user) {
  location.replace("./login.html");
}

const profile = await getMyProfile();
if (!profile) {
  loading.innerHTML = `
    <p class="msg error">プロフィールを読み込めませんでした。<br>
    ページを再読み込みしてください。</p>`;
} else {
  // 既存の値を入れておく（編集のときはここが埋まる）
  nameInput.value    = profile.display_name ?? "";
  commentInput.value = profile.comment ?? "";

  document.getElementById("url").innerHTML =
    `${baseUrl()}u/<b>${profile.public_id}</b>`;

  // すでに設定済みなら「編集」として見せる
  if (profile.display_name) {
    document.getElementById("title").textContent = "プロフィールを編集";
    document.getElementById("later").textContent = "";
  }

  updateCounts();
  loading.hidden = true;
  form.hidden = false;
}

// ---------- 文字数カウント ----------
nameInput.addEventListener("input", updateCounts);
commentInput.addEventListener("input", updateCounts);

function updateCounts() {
  document.getElementById("name-count").textContent    = nameInput.value.length;
  document.getElementById("comment-count").textContent = commentInput.value.length;
}

// ---------- 保存 ----------
document.getElementById("save").onclick = async () => {
  const name    = nameInput.value.trim();
  const comment = commentInput.value.trim();

  msg.className = "msg";
  msg.textContent = "";

  if (!name) {
    msg.className = "msg error";
    msg.textContent = "表示名を入力してください。";
    nameInput.focus();
    return;
  }

  const btn = document.getElementById("save");
  btn.disabled = true;
  btn.textContent = "保存しています…";

  const { error } = await supabase
    .from("profiles")
    .update({
      display_name: name,
      comment: comment || null,
    })
    .eq("id", user.id);

  btn.disabled = false;
  btn.textContent = "保存する";

  if (error) {
    msg.className = "msg error";
    msg.textContent = "保存できませんでした：" + error.message;
    return;
  }

  // 交換URLから来た場合は、そのまま交換へ戻す
  if (localStorage.getItem("pendingExchangeToken")) {
    location.href = "./card.html";
    return;
  }

  location.href = "./index.html";
};
</script>
</body>
</html>
