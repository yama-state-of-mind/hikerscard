<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コレクション｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<style>
/* ---------- 枚数の表示 ---------- */
.deck-head {
  display: flex; align-items: baseline; gap: 8px; margin-top: 18px;
}
.deck-head b {
  font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1;
}
.deck-head span { font-size: 12.5px; color: var(--stone); }

/* ---------- 重なったカード ---------- */
.deck {
  position: relative; margin: 16px auto 0;
  width: 100%; max-width: 330px;
  /* すべてのカードを同じ高さ（--deck-h）にそろえる。
     枠の高さ＝カードの高さ＋奥のカードが覗く分（3枚×14px）＋少し */
  --deck-h: 480px;
  height: calc(var(--deck-h) + 50px);
}
.deck-item {
  position: absolute; left: 50%; top: 0; width: 100%;
  transform-origin: 50% 100%;
  transition: transform .34s cubic-bezier(.22,.9,.3,1), opacity .25s;
  will-change: transform;
}
.deck-item .hero {
  margin-top: 0; height: var(--deck-h);
  display: flex; flex-direction: column;
}
.deck-item .hero-in { flex: 1; min-height: 0; overflow: hidden; }

/* 長いカードは、下の方をふわっと消して省略する（模様は消さず、中身だけ） */
.deck-item .hero.clipped .hero-in {
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 84px), transparent calc(100% - 26px));
          mask-image: linear-gradient(to bottom, #000 calc(100% - 84px), transparent calc(100% - 26px));
}
.deck-more {
  position: absolute; right: 16px; bottom: 12px; z-index: 2;
  font-size: 10.5px; font-weight: 600; letter-spacing: .04em; white-space: nowrap;
  color: var(--c-fg2); background: var(--c-bg); border: 1px solid var(--c-div);
  border-radius: 999px; padding: 4px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

/* 手前のカードだけ操作できるようにする */
.deck-item:not(.front) { pointer-events: none; }
.deck-item.front { cursor: pointer; }
/* 横の操作はスワイプとして受け取り、縦の操作はページのスクロールにする */
.deck { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .deck-hint {
    text-align: center; font-size: 11px; color: var(--c-mut, var(--stone));
    margin-top: 10px;
  }
.deck-item.front:active { cursor: grabbing; }

/* ---------- 操作 ---------- */
.deck-ctrl {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  max-width: 330px; margin: 4px auto 0;
}
.deck-btn {
  width: 44px; height: 44px; flex: none; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border: none; background: var(--c-bg, var(--paper)); color: var(--c-fg, var(--pine));
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.1);
}
.deck-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round; }
.deck-btn:active { transform: scale(.94); }
.deck-btn:disabled { opacity: .4; cursor: default; }
.deck-mid { flex: 1; text-align: center; min-width: 0; }

.deck-pos {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  color: var(--c-fg, var(--pine)); letter-spacing: 1px;
}
.met-at { font-size: 11px; color: var(--c-mut, var(--stone)); margin-top: 2px; }

/* ---------- 空のとき ---------- */
.deck-empty {
  text-align: center; background: var(--paper);
  border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  padding: 40px 24px; margin-top: 20px;
}
.deck-empty .ic {
  width: 64px; height: 64px; margin: 0 auto 14px;
  border-radius: 50%; background: #EDF3EF;
  display: flex; align-items: center; justify-content: center;
}
.deck-empty .ic svg {
  width: 28px; height: 28px; stroke: var(--stone);
  fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
.deck-empty p { font-size: 12.5px; color: #45564e; line-height: 2; }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div class="deck-head">
      <b id="n">0</b><span>枚のカード</span>
    </div>

    <div id="body"></div>

    <button class="btn sun"  id="go-exchange">カードを交換する</button>
    <button class="btn flat" id="back">マイカードへ</button>
  </div>
</div>

<!-- エラーを画面に出す。モジュールの読み込み失敗もここで拾える -->
<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML =
    '<p class="msg error" style="text-align:left">' +
    '<b>' + label + '</b><br>' +
    String(detail).replace(/[<>&]/g, "") +
    '</p>';
  el.hidden = false;
};
window.addEventListener("error", function (e) {
  window.__showFatal("読み込みに失敗しました",
    (e.message || "") + " " + (e.filename || ""));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__showFatal("処理中にエラーが発生しました",
    (e.reason && (e.reason.message || e.reason)) || "");
});
</script>

<script src="./data.js"></script>
<script src="./characters.js"></script>

<script type="module">
import { supabase, getUser } from "./supabase.js";
import { renderHeroCard } from "./card.js";
import { mountHeader } from "./header.js";
import { applyTheme } from "./card.js";
import { signOut } from "./supabase.js";

mountHeader(signOut);

// 選んだテーマをページ全体に反映する
(async () => {
  const { getMyProfile } = await import("./supabase.js");
  const p = await getMyProfile();
  if (p?.card_bg) applyTheme(p.card_bg);
})();

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) {
  location.replace("./login.html");
  throw new Error("redirect");
}

const { data, error } = await supabase.rpc("get_my_collection");

if (error) {
  window.__showFatal("コレクションを読み込めませんでした", error.message);
  throw error;
}

const cards = Array.isArray(data) ? data : [];
$("#n").textContent = cards.length;

// 手前に出ているカードの番号。
// drawDeck() より前に宣言しておく必要がある（letは宣言行を通るまで使えない）
let frontIndex = 0;

// カードの下に並ぶもの（位置・操作ボタン・案内・交換ボタン）の合計のおおよその高さ。
// これも drawDeck() より前に宣言しておく
const BELOW_DECK = 150;

// スワイプのリスナーを付けたかどうか（これも drawDeck() より前に宣言する）
let swipeBound = false;

if (!cards.length) {
  $("#body").innerHTML = `
    <div class="deck-empty">
      <div class="ic">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="13" height="16" rx="2"/>
          <path d="M8 3h11a2 2 0 0 1 2 2v13"/>
        </svg>
      </div>
      <p>まだカードがありません。<br>
         山で会った人とQRを読み合うと、<br>ここにカードが増えていきます。</p>
    </div>`;
} else {
  $("#body").innerHTML = `
    <div class="deck" id="deck"></div>
    <!-- 位置・交換日・めくるボタンを1行にまとめて、カードを大きく取る -->
    <div class="deck-ctrl">
      <button class="deck-btn" id="prev" aria-label="もどす">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="deck-mid">
        <p class="deck-pos" id="pos"></p>
        <p class="met-at" id="met"></p>
      </div>
      <button class="deck-btn" id="next" aria-label="めくる">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>`;

  $("#prev").onclick = () => cycle(-1);
  $("#next").onclick = () => cycle(1);
  if (cards.length < 2) { $("#prev").disabled = true; $("#next").disabled = true; }
}

$("#go-exchange").onclick = () => location.href = "./exchange.html";
$("#back").onclick = () => location.href = "./card.html";

// 先に表示してから描く。
// 非表示のまま描くと、カードの高さが0として測られてレイアウトが崩れる
$("#loading").hidden = true;
$("#main").hidden = false;

if (cards.length) drawDeck();

// =============================================
// 重なったカードの描画
// 手前のカードの下に、次のカードの端が覗く形にする
// =============================================
function drawDeck() {
  const deck = $("#deck");
  const n = cards.length;

  deck.innerHTML = cards.map((c, i) => {
    const pos = (i - frontIndex + n) % n;   // 0 が手前
    const diagnosed = !!c.type_code;
    return `
      <div class="deck-item${pos === 0 ? " front" : ""}" data-pos="${pos}"
           data-uid="${c.public_id}">
        ${renderHeroCard(c, {
          charSVG: diagnosed ? characterSVG(c.type_code) : "",
          animal:  diagnosed ? CHARACTERS[c.type_code]?.animal : "",
          typeName: diagnosed ? TYPES[c.type_code]?.name : "",
          linked: false,          // コレクションではスクロールさせない
        })}
      </div>`;
  }).join("");

  sizeDeck();
  layout();
  bindSwipe();
  updateLabels();
}

// ---------------------------------------------
// カードの高さを決める
//
// 下の「カードを交換する」ボタンまでが1画面に収まる高さにする。
// ただし小さすぎ・大きすぎないよう 360〜560px の間に収める。
// ---------------------------------------------
function sizeDeck() {
  const deck = $("#deck");
  if (!deck) return;
  const top = deck.getBoundingClientRect().top + scrollY;
  const avail = innerHeight - top - 50 - BELOW_DECK;
  const h = Math.round(Math.max(360, Math.min(560, avail)));
  deck.style.setProperty("--deck-h", h + "px");

  // はみ出しているカードにだけ「省略」の印を付ける
  requestAnimationFrame(() => {
    document.querySelectorAll(".deck-item .hero").forEach((hero) => {
      const inner = hero.querySelector(".hero-in");
      const over = inner.scrollHeight > inner.clientHeight + 4;
      hero.classList.toggle("clipped", over);
      if (over && !hero.querySelector(".deck-more")) {
        hero.insertAdjacentHTML("beforeend", `<span class="deck-more">タップして全部見る</span>`);
      }
    });
  });
}

addEventListener("resize", () => { if (cards.length) sizeDeck(); });

// 位置・拡大率・重ね順を割り当てる
function layout() {
  const n = cards.length;
  document.querySelectorAll(".deck-item").forEach((el) => {
    const pos = Number(el.dataset.pos);
    const y = pos * 14;                      // 下にずらす量
    const sc = 1 - pos * 0.035;              // 奥ほど小さく
    el.style.transform = `translateX(-50%) translateY(${y}px) scale(${sc})`;
    el.style.zIndex = String(n - pos);
    el.style.opacity = pos > 3 ? "0" : "1";  // 4枚目より奥は隠す
    el.dataset.base = el.style.transform;
  });
}

// めくる。ページのスクロール位置は動かさない
// （以前は毎回ページの先頭へ戻していたため、何枚かめくると位置がずれて操作しづらかった）
function cycle(dir) {
  const n = cards.length;
  frontIndex = (frontIndex + dir + n) % n;
  drawDeck();
}

function updateLabels() {
  $("#pos").textContent = `${frontIndex + 1} / ${cards.length}`;
  const c = cards[frontIndex];
  $("#met").textContent = c.first_met_at
    ? `${fmtDate(c.first_met_at)} に交換`
    : "";
}

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

// =============================================
// スワイプでめくる
//
// ・横に動かしたときだけカードを動かし、縦の動きはページのスクロールに任せる
//   （.deck に touch-action: pan-y を付けて、横の操作をこちらで受け取る）
// ・リスナーは最初の1回だけ付ける（描き直すたびに増えないように）
// ・ほとんど動かさずに離したら「押した」とみなして、その人のページを開く
// =============================================
function bindSwipe() {
  if (swipeBound) return;
  swipeBound = true;

  const deck = $("#deck");
  let el = null, base = "", sx = 0, sy = 0, dx = 0, axis = null, pid = null;

  deck.addEventListener("pointerdown", (e) => {
    const front = e.target.closest(".deck-item.front");
    if (!front || (e.pointerType === "mouse" && e.button !== 0)) return;
    el = front; base = el.dataset.base;
    sx = e.clientX; sy = e.clientY; dx = 0; axis = null; pid = e.pointerId;
    el.style.transition = "none";
  });

  deck.addEventListener("pointermove", (e) => {
    if (!el || e.pointerId !== pid) return;
    const mx = e.clientX - sx, my = e.clientY - sy;

    // 最初に大きく動いた向きで、横スワイプか縦スクロールかを決める
    if (!axis && Math.hypot(mx, my) > 8) {
      axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (axis === "x") deck.setPointerCapture(pid);
    }
    if (axis !== "x") return;

    dx = mx;
    if (cards.length < 2) return;           // 1枚だけなら動かさない
    el.style.transform = `${base} translateX(${dx}px) rotate(${dx * 0.03}deg)`;
  });

  const end = (e) => {
    if (!el || (e && e.pointerId !== pid)) return;
    const target = el;
    el = null;
    target.style.transition = "";

    if (axis === null) {                     // ほとんど動いていない＝押した
      location.href = `/u/${encodeURIComponent(target.dataset.uid)}`;
      return;
    }
    if (axis === "x" && cards.length > 1 && Math.abs(dx) > 70) {
      cycle(dx < 0 ? 1 : -1);
    } else {
      target.style.transform = base;         // 元の位置に戻す
    }
  };
  deck.addEventListener("pointerup", end);
  deck.addEventListener("pointercancel", (e) => {   // 縦スクロールに切り替わったときなど
    if (!el || e.pointerId !== pid) return;
    el.style.transition = "";
    el.style.transform = base;
    el = null;
  });

  // リンクの画像などをドラッグしてしまわないように
  deck.addEventListener("dragstart", (e) => e.preventDefault());
}
</script>
</body>
</html>
