<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カードをつくる｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  /* 上の帯（ヘッダーの代わり。カード完成までは他のページへ行かないので、ロゴとログアウトだけ） */
  .st-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 0; }
  .st-brand { font-size: 14px; font-weight: 900; letter-spacing: .02em; }
  .st-brand span { color: var(--sun); }
  .st-out { font-family: var(--font); font-size: 11px; color: var(--c-mut); background: none; border: none; cursor: pointer; }

  /* 進み具合 */
  .st-prog { display: flex; gap: 6px; margin-top: 16px; }
  .st-prog i { flex: 1; height: 4px; border-radius: 99px; background: var(--c-div); transition: background .3s; }
  .st-prog i.on { background: var(--sun); }
  .st-step { font-size: 11px; font-weight: 700; color: var(--c-mut); letter-spacing: .1em; margin-top: 18px; }
  .st-title { font-size: 21px; font-weight: 900; line-height: 1.45; margin-top: 4px; }
  .st-lead { font-size: 12.5px; color: var(--c-fg2); line-height: 1.9; margin-top: 8px; }
  .st-pane { animation: stIn .35s ease both; }
  @keyframes stIn { from { opacity: 0; transform: translateX(14px); } }

  .st-next { margin-top: 22px; }

  /* 山の登録のしかたを選ぶ */
  .st-choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .st-choice { display: flex; align-items: flex-start; gap: 14px; text-align: left; cursor: pointer; width: 100%;
    font-family: var(--font); color: var(--c-fg); background: var(--c-bg); border: 2px solid transparent;
    border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 20px -8px rgba(0,0,0,.16);
    transition: transform .12s, border-color .15s; }
  .st-choice:hover { border-color: var(--sun); }
  .st-choice:active { transform: scale(.98); }
  .st-choice-ic { width: 46px; height: 46px; border-radius: 14px; flex: none; background: var(--c-soft);
    display: flex; align-items: center; justify-content: center; }
  .st-choice-ic svg { width: 24px; height: 24px; fill: none; stroke: var(--c-fg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .st-choice[data-mode="easy"] .st-choice-ic { background: var(--sun); }
  .st-choice[data-mode="easy"] .st-choice-ic svg { stroke: #fff; }
  .st-choice-b { flex: 1; min-width: 0; }
  .st-choice-b b { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
  .st-choice-b b em { font-style: normal; font-size: 10px; font-weight: 700; color: #fff; background: var(--sun);
    border-radius: 999px; padding: 2px 8px; }
  .st-choice-b > span { display: block; font-size: 12px; color: var(--c-fg2); line-height: 1.8; margin-top: 4px; }
  .st-later { text-align: center; font-size: 11.5px; color: var(--c-mut); line-height: 1.8; margin-top: 16px; }
  .st-back { display: block; margin: 12px auto 0; font-family: var(--font); font-size: 12px; color: var(--c-mut);
    background: none; border: none; cursor: pointer; }

  /* ---------- 山の仕分け ---------- */
  .st-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 11.5px; color: var(--c-fg2); }
  .st-legend b { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px;
    border-radius: 50%; font-size: 11px; margin-right: 4px; color: #fff; vertical-align: -3px; }
  .st-legend .c { background: #2E7D52; }
  .st-legend .w { background: var(--sun); }
  .st-count { display: flex; gap: 10px; margin-top: 12px; position: sticky; top: 0; z-index: 3;
    background: var(--c-page); padding: 8px 0; }
  .st-count span { flex: 1; text-align: center; font-size: 12px; font-weight: 700; border-radius: 12px; padding: 8px;
    background: var(--c-bg); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .st-count b { font-family: var(--mono); font-size: 16px; margin: 0 2px; }
  .st-count .c b { color: #2E7D52; }
  .st-count .w b { color: var(--sun); }

  .st-search { margin-top: 8px; position: relative; }
  .st-search input { width: 100%; font-family: var(--font); font-size: 14px; color: var(--c-fg);
    background: var(--c-bg); border: 1.5px solid var(--c-div); border-radius: 12px; padding: 10px 12px 10px 36px; outline: none; }
  .st-search input:focus { border-color: var(--c-fg); }
  .st-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px;
    fill: none; stroke: var(--c-mut); stroke-width: 2; stroke-linecap: round; }

  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
  .st-tile { position: relative; border: none; cursor: pointer; text-align: left; overflow: hidden;
    font-family: var(--font); color: var(--c-fg); background: var(--c-bg); border-radius: 14px; padding: 10px 10px 9px;
    min-height: 82px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 10px -6px rgba(0,0,0,.15);
    transition: transform .12s, box-shadow .15s, background .15s; -webkit-tap-highlight-color: transparent; }
  .st-tile:active { transform: scale(.96); }
  .st-tile svg.mt { position: absolute; right: -6px; bottom: -4px; width: 64px; height: 40px; opacity: .1; }
  .st-tile b { position: relative; display: block; font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .st-tile small { position: relative; display: block; font-size: 10px; color: var(--c-mut); margin-top: 3px; }
  .st-tile .mk { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
    display: none; align-items: center; justify-content: center; color: #fff; }
  .st-tile .mk svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .st-tile.climbed { background: #E6F2EA; box-shadow: 0 0 0 2px #2E7D52; }
  .st-tile.climbed .mk { display: flex; background: #2E7D52; }
  .st-tile.wish { background: #FCF1DC; box-shadow: 0 0 0 2px var(--sun); }
  .st-tile.wish .mk { display: flex; background: var(--sun); }
  body.theme-dark .st-tile.climbed { background: rgba(46,125,82,.25); }
  body.theme-dark .st-tile.wish { background: rgba(224,163,59,.2); }
  .st-tile.pop { animation: stPop .28s cubic-bezier(.2,1.6,.4,1); }
  @keyframes stPop { 50% { transform: scale(1.06); } }
  .st-more { margin-top: 10px; }
  .st-order { font-size: 10.5px; color: var(--c-mut); margin-top: 8px; }

  /* 仕分けのタイル：下に「登った」「登りたい」の2つのボタン */
  .st-tile.sort { cursor: default; padding-bottom: 8px; display: flex; flex-direction: column; }
  .st-tile.sort:active { transform: none; }
  .st-pick { position: relative; display: flex; gap: 4px; margin-top: auto; padding-top: 8px; }
  .pk { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;
    font-family: var(--font); font-size: 10px; font-weight: 700; cursor: pointer;
    border: 1.5px solid var(--c-div); border-radius: 9px; padding: 4px 0 3px;
    background: var(--c-bg); color: var(--c-mut); -webkit-tap-highlight-color: transparent; transition: background .15s, color .15s; }
  .pk svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .pk:active { transform: scale(.94); }
  .pk.c.on { background: #2E7D52; border-color: #2E7D52; color: #fff; }
  .pk.w.on { background: var(--sun); border-color: var(--sun); color: #fff; }

  /* ---------- ベスト3 ---------- */
  .st-podium { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin-top: 16px; }
  .st-pod { width: 30%; text-align: center; }
  .st-pod .nm { font-size: 12.5px; font-weight: 700; min-height: 2.6em; display: flex; align-items: flex-end; justify-content: center; line-height: 1.3; }
  .st-pod .nm.empty { color: var(--c-mut); font-weight: 400; font-size: 11px; }
  .st-pod .bar { margin-top: 6px; border-radius: 10px 10px 4px 4px; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
  .st-pod .bar .crown { width: 26px; height: 26px; }
  .st-pod.p1 .bar { height: 84px; background: rgba(217,165,33,.22); }
  .st-pod.p2 .bar { height: 60px; background: rgba(163,175,184,.3); }
  .st-pod.p3 .bar { height: 44px; background: rgba(184,119,63,.22); }
  .st-tile.ranked { box-shadow: 0 0 0 2px var(--sun); background: #FCF1DC; }
  .st-tile .rk { position: absolute; top: 6px; right: 6px; }
  .st-tile .rk .crown { width: 22px; height: 22px; }

  /* ---------- 詳しい登録の案内 ---------- */
  .st-note { margin-top: 18px; background: var(--c-bg); border-radius: 18px; padding: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 20px -8px rgba(0,0,0,.14); }
  .st-note-h { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; }
  .st-note-h span { width: 36px; height: 36px; border-radius: 11px; background: var(--c-soft); display: flex; align-items: center; justify-content: center; }
  .st-note-h svg { width: 19px; height: 19px; fill: none; stroke: var(--c-fg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .st-note ul { list-style: none; margin-top: 12px; }
  .st-note li { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.7; padding: 7px 0; }
  .st-note li + li { border-top: 1px solid var(--c-div); }
  .st-note li i { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--c-soft); margin-top: 2px;
    display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; font-weight: 700; }
  .st-path { font-size: 11px; color: var(--c-mut); text-align: center; margin-top: 12px; }
  .st-path b { color: var(--c-fg2); }

  /* ---------- 完成 ---------- */
  .st-done { text-align: center; position: relative; }
  .st-reveal { perspective: 1400px; margin-top: 14px; }
  .st-reveal .hero { animation: stReveal 1.1s .2s cubic-bezier(.2,.9,.25,1) both; transform-origin: center; }
  @keyframes stReveal {
    0%   { transform: rotateY(-180deg) scale(.7); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: rotateY(0) scale(1); }
  }
  .st-done-t { font-size: 22px; font-weight: 900; margin-top: 18px; animation: stUp .5s 1.1s both; }
  .st-done-t b { color: var(--sun); font-family: var(--mono); }
  .st-done-l { font-size: 12.5px; color: var(--c-fg2); line-height: 1.9; margin-top: 6px; animation: stUp .5s 1.2s both; }
  .st-done .btn { animation: stUp .5s 1.3s both; }
  @keyframes stUp { from { opacity: 0; transform: translateY(10px); } }
  .st-confetti { position: absolute; inset: -20px 0 auto; height: 360px; pointer-events: none; overflow: hidden; z-index: 5; }
  .st-confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; opacity: 0;
    animation: stFall 2s var(--d) ease-in forwards; }
  @keyframes stFall { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), 340px) rotate(var(--r)); } }

  @media (prefers-reduced-motion: reduce) {
    .st-pane, .st-reveal .hero, .st-done-t, .st-done-l, .st-done .btn, .st-tile.pop { animation: none !important; }
    .st-confetti { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="st-top">
    <p class="st-brand">ハイカーズ<span>カード</span></p>
    <span>
      <button class="st-out" id="reset" hidden>最初からやり直す（テスト用）</button>
      <button class="st-out" id="logout">ログアウト</button>
    </span>
  </div>
  <div class="st-prog" id="prog" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>
  <div id="pane"></div>
  <div id="msg" class="msg"></div>
</div>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>
<script src="/data.js"></script>
<script src="/characters.js"></script>

<script type="module">
// =============================================
// カードづくり（初期登録）
//
//   1 名前 → 2 登山タイプ診断 → 3 山の仕分け → 4 ベスト3 → 5 詳しい登録の案内 → 完成
//
// 途中でやめても、次に開いたときはDBの状態から続きのステップを判断して再開する。
// 完成（complete_onboarding）した時点で、カード番号が発行される。
// =============================================
import { supabase, getUser, getMyProfile, applyPendingDiagnosis, resetMyOnboarding, signOut } from "./supabase.js";
import { BG, THEMES, SILHOUETTE, applyTheme, esc, crown, renderHeroCard,
         renderBgPicker, normalizeBg, DEFAULT_BG } from "./card.js";

const $ = (s) => document.querySelector(s);
const stop = () => new Promise(() => {});
const WISH_MAX = 5;
const FAV_MAX = 3;

const user = await getUser();
if (!user) { location.replace("./login.html"); await stop(); }

let profile = await getMyProfile();
// 未ログインのまま受けた診断があれば、ここで反映する
profile = await applyPendingDiagnosis(profile);

// すでに完成している人はマイページへ
if (profile?.onboarded_at) { location.replace("./mypage.html"); await stop(); }

applyTheme(normalizeBg(profile?.card_bg));
$("#logout").onclick = () => signOut();
// テスト用アカウントだけ、途中からでも最初からやり直せる
if (profile?.is_tester) {
  $("#reset").hidden = false;
  $("#reset").onclick = () => resetMyOnboarding();
}

// ---------------------------------------------
// 山のデータと、いま登録されている山
// ---------------------------------------------
const [mtRes, clRes, wiRes] = await Promise.all([
  supabase.from("mountains").select("*")
          .order("elevation", { ascending: false }),
  supabase.from("climbed_mountains").select("mountain_id, is_favorite, favorite_rank").eq("user_id", user.id),
  supabase.from("wishlist_mountains").select("mountain_id").eq("user_id", user.id),
]);
for (const r of [mtRes, clRes, wiRes]) {
  if (r.error) { window.__showFatal("読み込めませんでした", r.error.message); await stop(); }
}
const MOUNTAINS = mtRes.data ?? [];
const byId = new Map(MOUNTAINS.map((m) => [m.id, m]));

const climbed = new Set((clRes.data ?? []).map((r) => r.mountain_id));
const wish = new Set((wiRes.data ?? []).map((r) => r.mountain_id));
let favs = (clRes.data ?? []).filter((r) => r.is_favorite)
  .sort((a, b) => (a.favorite_rank ?? 99) - (b.favorite_rank ?? 99)).map((r) => r.mountain_id).slice(0, FAV_MAX);

// ---------------------------------------------
// どのステップから始めるか（DBの状態から判断）
// ---------------------------------------------
function firstStep() {
  if (!profile?.display_name) return 1;
  if (!profile?.type_code) return 2;
  if (!wish.size) return 3;
  if (climbed.size && !favs.length) return 4;
  return 5;
}

const STEP_NAMES = ["名前", "登山タイプ診断", "山の登録", "ベスト3", "仕上げ"];

// 山の登録のしかた：'easy'（かんたん仕分け）/ 'detail'（じっくり登録）/ null（まだ選んでいない）
// じっくり登録は山の登録ページへ移動して戻ってくるので、ブラウザに覚えておく
let regMode = sessionStorage.getItem("hcRegMode");
const setMode = (m) => { regMode = m; m ? sessionStorage.setItem("hcRegMode", m) : sessionStorage.removeItem("hcRegMode"); };
let step = firstStep();

function show(n) {
  step = n;
  document.querySelectorAll("#prog i").forEach((i, k) => i.classList.toggle("on", k < n));
  $("#msg").className = "msg"; $("#msg").textContent = "";
  const draw = { 1: stepName, 2: stepQuiz, 3: stepMountains, 4: stepBest, 5: stepNote }[n];
  $("#pane").innerHTML = `<div class="st-pane">${head(n)}${draw()}</div>`;
  bind[n]?.();
  window.scrollTo(0, 0);
}
const head = (n) => `<p class="st-step">STEP ${n} / 5　${STEP_NAMES[n - 1]}</p>`;
const error = (t) => { $("#msg").className = "msg error"; $("#msg").textContent = t; };
const bind = {};

// =============================================
// 1. 名前
// =============================================
// カードづくりの時点では交換0枚なので、いつでも使える5種から選ぶ
let bg = normalizeBg(profile?.card_bg);
if (THEMES.find((t) => t.id === bg)?.need) bg = DEFAULT_BG;

function stepName() {
  return `
    <h1 class="st-title">カードに載せる<br>名前を決めましょう</h1>
    <p class="st-lead">山の仲間に呼ばれている名前やニックネームがおすすめです。あとから変えられます。</p>
    <div class="field" style="margin-top:16px">
      <label for="nm">表示名<span style="color:var(--sun)">（必須）</span></label>
      <input id="nm" maxlength="20" value="${esc(profile?.display_name ?? "")}" placeholder="例：やまだ" autocomplete="nickname">
    </div>
    <div class="field">
      <label for="cm">ひとこと（なくてもOK）</label>
      <textarea id="cm" maxlength="120" rows="2" placeholder="例：週末は近郊の低山めぐり。">${esc(profile?.comment ?? "")}</textarea>
    </div>
    <div class="field">
      <label>カードの背景</label>
      <div id="bgs"></div>
    </div>
    <button class="btn sun st-next" id="next">次へ</button>`;
}
bind[1] = () => {
  const drawBgs = () => { $("#bgs").innerHTML = renderBgPicker(bg, 0, { plainOnly: true }); };
  drawBgs();
  $("#bgs").onclick = (e) => {
    const b = e.target.closest(".bg-chip");
    if (!b) return;
    bg = b.dataset.id; applyTheme(bg); drawBgs();
  };
  $("#next").onclick = async () => {
    const name = $("#nm").value.trim();
    if (!name) return error("表示名を入れてください。");
    const btn = $("#next"); btn.disabled = true;
    const { error: err } = await supabase.from("profiles")
      .update({ display_name: name, comment: $("#cm").value.trim() || null, card_bg: bg })
      .eq("id", user.id);
    btn.disabled = false;
    if (err) return error("保存できませんでした：" + err.message);
    profile = { ...profile, display_name: name, card_bg: bg };
    show(profile.type_code ? 3 : 2);
  };
};

// =============================================
// 2. 登山タイプ診断（診断ページへ行き、終わったらここへ戻ってくる）
// =============================================
function stepQuiz() {
  const done = !!profile?.type_code && TYPES[profile.type_code];
  if (done) {
    return `
      <h1 class="st-title">診断できました！</h1>
      <div class="st-note" style="text-align:center">
        <div style="width:96px;height:96px;margin:0 auto;border-radius:50%;overflow:hidden">${characterSVG(profile.type_code)}</div>
        <p style="font-family:var(--mono);font-weight:700;letter-spacing:.2em;margin-top:10px">${esc(profile.type_code)}</p>
        <p style="font-weight:700;margin-top:2px">${esc(CHARACTERS[profile.type_code].animal)}・${esc(TYPES[profile.type_code].name)}</p>
      </div>
      <button class="btn sun st-next" id="next">次へ</button>`;
  }
  return `
    <h1 class="st-title">あなたの登山タイプを<br>診断しましょう</h1>
    <p class="st-lead">12の質問に答えるだけ（3分ほど）。16タイプの動物キャラクターが、カードの顔になります。</p>
    <button class="btn sun st-next" id="go-quiz">診断をはじめる</button>
    <button class="st-back" id="prev">名前にもどる</button>`;
}
bind[2] = () => {
  $("#next")?.addEventListener("click", () => show(3));
  // 診断が終わると index.html 経由でこのページに戻ってくる
  $("#go-quiz")?.addEventListener("click", () => { location.href = "./quiz.html"; });
  $("#prev")?.addEventListener("click", () => show(1));
};

// =============================================
// 3. 山の登録：まず「かんたん仕分け」か「じっくり登録」かを選ぶ
// =============================================
function stepMountains() { return regMode === "easy" ? stepSort() : stepChoose(); }

const IC_EASY = `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><path d="M15 17l2 2 4-4"/></svg>`;
const IC_DETAIL = `<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/><path d="M7.5 10.5h6M10.5 7.5v6"/></svg>`;

function stepChoose() {
  // じっくり登録から戻ってきたが、まだ条件を満たしていない
  const back = regMode === "detail" && !wish.size
    ? `<p class="msg error" style="margin-top:12px">登ってみたい山がまだ登録されていません。1つ以上登録してください。</p>` : "";
  return `
    <h1 class="st-title">山の登録のしかたを<br>選んでください</h1>
    <p class="st-lead">登った山・登ってみたい山・登ってよかった山を登録します。</p>
    ${back}
    <div class="st-choices">
      <button class="st-choice" data-mode="easy">
        <span class="st-choice-ic">${IC_EASY}</span>
        <span class="st-choice-b">
          <b>かんたん仕分け<em>おすすめ</em></b>
          <span>人気の山をタップで仕分けるだけ。1分ほどで終わります。</span>
        </span>
      </button>
      <button class="st-choice" data-mode="detail">
        <span class="st-choice-ic">${IC_DETAIL}</span>
        <span class="st-choice-b">
          <b>じっくり登録</b>
          <span>全349座から、検索や地域・名山の絞り込みで選べます。登ってよかった山は5座まで順位を付けられます。</span>
        </span>
      </button>
    </div>
    <p class="st-later">かんたん仕分けで始めても、あとから<br>「カードを編集する」でじっくり登録できます。</p>
    <button class="st-back" id="prev">診断にもどる</button>`;
}

// =============================================
// 3. 山の仕分け（タップで 登った → 登ってみたい → 元に戻す）
// =============================================
const MT_SVG = `<svg class="mt" viewBox="0 0 64 40"><path d="M0 40L22 8l10 14 8-10 24 28z" fill="currentColor"/></svg>`;
const CHECK = `<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>`;
const FLAG = `<svg viewBox="0 0 24 24"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></svg>`;
let keyword = "";
let showAll = false;

const normalize = (s) => (s ?? "")
  .replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).toLowerCase();

function tileHtml(m) {
  const st = climbed.has(m.id) ? "climbed" : wish.has(m.id) ? "wish" : "";
  return `
    <div class="st-tile sort ${st}" data-id="${m.id}">
      ${MT_SVG}
      <b>${esc(m.name)}</b>
      <small>${m.elevation ? `${m.elevation}m` : ""}${m.prefs?.length ? `・${esc(m.prefs[0])}` : ""}</small>
      <span class="st-pick">
        <button class="pk c${st === "climbed" ? " on" : ""}" data-pick="climbed" aria-pressed="${st === "climbed"}"
                aria-label="${esc(m.name)}：登った">${CHECK}<span>登った</span></button>
        <button class="pk w${st === "wish" ? " on" : ""}" data-pick="wish" aria-pressed="${st === "wish"}"
                aria-label="${esc(m.name)}：登りたい">${FLAG}<span>登りたい</span></button>
      </span>
    </div>`;
}

function sortList() {
  if (keyword) {
    const kw = normalize(keyword);
    return MOUNTAINS.filter((m) => normalize(m.name).includes(kw) || normalize(m.kana).includes(kw)).slice(0, 40);
  }
  // 人気の山 ＋ すでに選んだ山（人気の山以外を検索で足した場合も、ここに残す）
  // 人気の山は、実際によく登られている順（popular_rank）を上に。順位の無い人気の山はその後に標高順
  const picked = MOUNTAINS.filter((m) => (climbed.has(m.id) || wish.has(m.id)) && !m.is_popular && m.popular_rank == null);
  const popular = MOUNTAINS.filter((m) => m.is_popular || m.popular_rank != null)
    .sort((a, b) => (a.popular_rank ?? 9999) - (b.popular_rank ?? 9999) || (b.elevation ?? 0) - (a.elevation ?? 0));
  const list = [...picked, ...popular];
  return showAll ? list : list.slice(0, 24);
}

function stepSort() {
  return `
    <h1 class="st-title">山を仕分けしましょう</h1>
    <p class="st-lead">それぞれの山で「<b>登った</b>」か「<b>登りたい</b>」を押してください。どちらでもない山は、そのままでOK。<br>
      まだ登ったことがなくても大丈夫。登ってみたい山を<b>1つ以上</b>選んでください。</p>
    <p class="st-order">よく登られている順に並んでいます（YAMAP「登られた山ランキング2025」より）</p>
    <div class="st-count" id="cnt"></div>
    <div class="st-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="kw" type="search" placeholder="ほかの山を探す（例：やり）" value="${esc(keyword)}" autocomplete="off">
    </div>
    <div class="st-grid" id="grid"></div>
    <button class="btn ghost st-more" id="more" hidden>人気の山をもっと見る</button>
    <button class="btn sun st-next" id="next"></button>
    <button class="st-back" id="prev">登録のしかたを選び直す</button>`;
}
bind[3] = () => {
  if (regMode !== "easy") {
    document.querySelector(".st-choices").onclick = (e) => {
      const c = e.target.closest("[data-mode]");
      if (!c) return;
      if (c.dataset.mode === "easy") { setMode("easy"); show(3); }
      else { setMode("detail"); location.href = "./mountains.html#climbed"; }
    };
    $("#prev").onclick = () => show(2);
    return;
  }
  bindSort();
};

function bindSort() {
  const draw = () => {
    const list = sortList();
    $("#grid").innerHTML = list.length ? list.map(tileHtml).join("")
      : `<p class="st-lead" style="grid-column:1/-1">見つかりませんでした。ひらがなでも探せます。</p>`;
    $("#more").hidden = !!keyword || showAll || MOUNTAINS.filter((m) => m.is_popular || m.popular_rank != null).length <= 24;
    $("#cnt").innerHTML = `
      <span class="c">登った <b>${climbed.size}</b>座</span>
      <span class="w">登ってみたい <b>${wish.size}</b>/${WISH_MAX}</span>`;
    $("#next").textContent = !wish.size ? "登ってみたい山を1つ以上選んでください"
      : climbed.size ? "次へ" : "まだ0座で次へ";
    $("#next").disabled = !wish.size;
  };
  draw();

  // 「登った」「登りたい」のボタン。押した方になり、もう一度押すと外れる（2つは同時に選べない）
  $("#grid").onclick = (e) => {
    const b = e.target.closest("[data-pick]");
    if (!b) return;
    const id = Number(b.closest(".st-tile").dataset.id);
    $("#msg").className = "msg"; $("#msg").textContent = "";

    if (b.dataset.pick === "climbed") {
      if (climbed.has(id)) {
        climbed.delete(id);
        favs = favs.filter((x) => x !== id);
      } else {
        climbed.add(id);
        wish.delete(id);
      }
    } else {
      if (wish.has(id)) {
        wish.delete(id);
      } else if (wish.size >= WISH_MAX) {
        return error(`登ってみたい山は${WISH_MAX}座までです。どれかを外してください。`);
      } else {
        wish.add(id);
        climbed.delete(id);
        favs = favs.filter((x) => x !== id);
      }
    }
    draw();
    document.querySelector(`.st-tile[data-id="${id}"]`)?.classList.add("pop");
  };
  let timer;
  $("#kw").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { keyword = e.target.value.trim(); draw(); }, 200); };
  $("#more").onclick = () => { showAll = true; draw(); };
  $("#prev").onclick = () => { setMode(null); show(3); };
  $("#next").onclick = async () => {
    if (!wish.size) return;
    const ok = await saveMountains();
    if (ok) show(climbed.size ? 4 : 5);
  };
}

async function saveMountains() {
  favs = favs.filter((id) => climbed.has(id));
  const { error: err } = await supabase.rpc("save_my_mountains", {
    p_climbed: [...climbed], p_favorites: favs, p_wishlist: [...wish],
  });
  if (err) { error("保存できませんでした：" + err.message); return false; }
  return true;
}

// =============================================
// 4. ベスト3（登った山から、よかった順に3つまで）
// =============================================
function stepBest() {
  return `
    <h1 class="st-title">いちばん良かった山は？</h1>
    <p class="st-lead">登った山から、よかった順にタップしてください（3つまで）。<br>選んだ順に王冠が付きます。</p>
    <div class="st-podium" id="podium"></div>
    <div class="st-grid" id="grid" style="margin-top:18px"></div>
    <button class="btn sun st-next" id="next"></button>
    <button class="st-back" id="prev">${regMode === "easy" ? "山の仕分けにもどる" : "山の登録にもどる"}</button>`;
}
bind[4] = () => {
  const list = MOUNTAINS.filter((m) => climbed.has(m.id));
  const draw = () => {
    const pod = (p) => {
      const m = byId.get(favs[p - 1]);
      return `<div class="st-pod p${p}">
        <p class="nm${m ? "" : " empty"}">${m ? esc(m.name) : `${p}位`}</p>
        <div class="bar">${crown(p)}</div></div>`;
    };
    // 表彰台の並び：2位・1位・3位
    $("#podium").innerHTML = pod(2) + pod(1) + pod(3);
    $("#grid").innerHTML = list.map((m) => {
      const r = favs.indexOf(m.id) + 1;
      return `<button class="st-tile ${r ? "ranked" : ""}" data-id="${m.id}">
        ${MT_SVG}${r ? `<span class="rk">${crown(r)}</span>` : ""}
        <b>${esc(m.name)}</b><small>${m.elevation ? `${m.elevation}m` : ""}</small></button>`;
    }).join("");
    $("#next").textContent = favs.length ? "次へ" : "1つ以上選んでください";
    $("#next").disabled = !favs.length;
  };
  draw();
  $("#grid").onclick = (e) => {
    const t = e.target.closest(".st-tile");
    if (!t) return;
    const id = Number(t.dataset.id);
    if (favs.includes(id)) favs = favs.filter((x) => x !== id);
    else if (favs.length < FAV_MAX) favs.push(id);
    else return error(`選べるのは${FAV_MAX}つまでです。どれかを外してください。`);
    $("#msg").textContent = "";
    draw();
  };
  $("#prev").onclick = () => show(3);
  $("#next").onclick = async () => {
    if (!favs.length) return;
    if (await saveMountains()) show(5);
  };
};

// =============================================
// 5. 詳しい登録の案内 → 完成
// =============================================
function stepNote() {
  const item = (n, t) => `<li><i>${n}</i><span>${t}</span></li>`;
  return `
    <h1 class="st-title">あと少しでカードが完成！</h1>
    <p class="st-lead">${regMode === "detail"
      ? "山の登録ができました。<br>あとから追加や並べ替えも、いつでもできます。"
      : "今回は人気の山を中心に仕分けしました。<br>山の詳しい登録は、カードが完成したあといつでもできます。"}</p>
    <div class="st-note">
      <p class="st-note-h"><span><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
        「カードを編集する」でできること</p>
      <ul>
        ${item(1, "全349座（百名山・二百名山・三百名山など）から、登った山をくわしく登録")}
        ${item(2, "登ってよかった山は5座まで。順位の並べ替えも")}
        ${item(3, "登ってみたい山も5座まで")}
        ${item(4, "カードの裏面に、登山スキル（雪山・テント泊など）を登録")}
        ${item(5, "ひとこと・背景・SNSの変更")}
      </ul>
      <p class="st-path">マイページ ＞ <b>カードを編集する</b></p>
    </div>
    <button class="btn sun st-next" id="finish">カードを完成させる</button>
    <button class="st-back" id="prev">もどる</button>`;
}
bind[5] = () => {
  $("#prev").onclick = () => show(climbed.size ? 4 : 3);
  $("#finish").onclick = async () => {
    const btn = $("#finish"); btn.disabled = true; btn.textContent = "カードを作っています…";
    const { data, error: err } = await supabase.rpc("complete_onboarding");
    if (err || !data?.ok) {
      btn.disabled = false; btn.textContent = "カードを完成させる";
      // 足りないものがあれば、そのステップへ戻す
      const back = { no_name: 1, no_type: 2, no_wish: 3, no_fav: 4 }[data?.reason];
      if (back) { show(back); return error("まだ入力されていない項目があります。"); }
      return error("完成できませんでした：" + (err?.message ?? ""));
    }
    setMode(null);
    done(data.card_no);
  };
};

// ---------------------------------------------
// 完成！カードがくるっと現れる
// ---------------------------------------------
async function done(cardNo) {
  document.querySelectorAll("#prog i").forEach((i) => i.classList.add("on"));
  const { data: card } = await supabase.rpc("get_public_card", { p_public_id: profile.public_id });
  const COLORS = ["#E0A33B", "#7FB5D4", "#E88B7A", "#8FC4A0", "#F2D16B"];
  const confetti = Array.from({ length: 30 }, (_, i) =>
    `<i style="left:${Math.round(Math.random() * 100)}%;background:${COLORS[i % 5]};--x:${Math.round((Math.random() - .5) * 160)}px;--r:${Math.round((Math.random() - .5) * 720)}deg;--d:${(.9 + Math.random() * .7).toFixed(2)}s"></i>`).join("");
  const t = card?.type_code;
  $("#pane").innerHTML = `
    <div class="st-done">
      <div class="st-confetti" aria-hidden="true">${confetti}</div>
      <div class="st-reveal">${card ? renderHeroCard(card, {
        charSVG: t ? characterSVG(t) : "", animal: t ? CHARACTERS[t].animal : "",
        typeName: t ? TYPES[t].name : "", linked: false }) : ""}</div>
      <p class="st-done-t">カードが完成しました！<br><b>No.${String(cardNo).padStart(4, "0")}</b></p>
      <p class="st-done-l">QRコードで、山で出会った人とカードを交換しましょう。</p>
      <button class="btn sun" onclick="location.href='./mypage.html'">マイページへ</button>
      <button class="btn ghost" onclick="location.href='./card.html'">マイカードを見る</button>
    </div>`;
  window.scrollTo(0, 0);
}

$("#loading").hidden = true;
show(step);
</script>
</body>
</html>
