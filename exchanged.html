<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カードを交換しました｜ハイカーズカード</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
<style>
  .xc { text-align: center; padding-top: 18px; position: relative; }

  /* ふたりのアイコンが左右から寄ってきて、真ん中でポン！ */
  .xc-stage { position: relative; height: 150px; margin: 10px auto 0; max-width: 320px; }
  .xc-av { position: absolute; top: 24px; width: 104px; height: 104px; border-radius: 50%; overflow: hidden;
    background: var(--c-bg); box-shadow: 0 0 0 4px var(--c-page), 0 10px 24px rgba(0,0,0,.16); }
  .xc-av svg { width: 100%; height: 100%; display: block; }
  .xc-av.me    { left: 14px;  animation: xcInL .6s cubic-bezier(.2,1.3,.4,1) both; }
  .xc-av.other { right: 14px; animation: xcInR .6s cubic-bezier(.2,1.3,.4,1) both; }
  .xc-av.me::after, .xc-av.other::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 3px var(--sun); }
  @keyframes xcInL { from { transform: translateX(-60px) rotate(-12deg); opacity: 0; } }
  @keyframes xcInR { from { transform: translateX(60px) rotate(12deg); opacity: 0; } }

  .xc-pop { position: absolute; left: 50%; top: 40px; width: 74px; height: 74px; margin-left: -37px; z-index: 2;
    animation: xcPop .5s .45s cubic-bezier(.2,1.6,.4,1) both; }
  .xc-pop svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .xc-pop .burst { fill: var(--sun); }
  .xc-pop .ring  { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes xcPop { from { transform: scale(0) rotate(-40deg); } }
  .xc-pop .spin { transform-origin: 37px 37px; animation: xcSpin 6s 1s linear infinite; }
  @keyframes xcSpin { to { transform: rotate(360deg); } }

  /* 紙吹雪 */
  .xc-confetti { position: absolute; inset: -10px 0 auto; height: 260px; pointer-events: none; overflow: hidden; }
  .xc-confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; opacity: 0;
    animation: xcFall 1.8s var(--d) ease-in forwards; }
  @keyframes xcFall {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--x), 250px) rotate(var(--r)); }
  }

  .xc-title { font-size: 21px; font-weight: 900; line-height: 1.5; margin-top: 16px; letter-spacing: .02em;
    animation: xcUp .5s .6s both; }
  .xc-title b { color: var(--sun); }
  .xc-lead { font-size: 13px; color: var(--c-fg2); line-height: 1.9; margin-top: 8px; animation: xcUp .5s .7s both; }
  .xc-btns { margin-top: 22px; animation: xcUp .5s .8s both; }
  @keyframes xcUp { from { opacity: 0; transform: translateY(10px); } }

  @media (prefers-reduced-motion: reduce) {
    .xc *, .xc { animation: none !important; }
    .xc-confetti { display: none; }
  }
</style>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>
  <div id="main" class="xc" hidden></div>
</div>

<script src="/data.js"></script>
<script src="/characters.js"></script>
<script type="module">
import { supabase, getUser, getMyProfile, signOut } from "./supabase.js";
import { mountHeader } from "./header.js";
import { applyTheme, esc, SILHOUETTE } from "./card.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) { location.replace("./login.html"); await new Promise(() => {}); }

const params = new URLSearchParams(location.search);
const partnerId = params.get("p");
const isNew = params.get("new") !== "0";

const profile = await getMyProfile();
mountHeader(signOut, { shareId: profile?.public_id });
if (profile?.card_bg) applyTheme(profile.card_bg);

const { data: other } = partnerId
  ? await supabase.rpc("get_public_card", { p_public_id: partnerId })
  : { data: null };

const face = (code) => code && TYPES[code] ? characterSVG(code) : SILHOUETTE;
const name = other?.display_name ? `${esc(other.display_name)}さん` : "相手";

// 紙吹雪（色と動きは少しずつばらす）
const COLORS = ["#E0A33B", "#7FB5D4", "#E88B7A", "#8FC4A0", "#F2D16B"];
const confetti = Array.from({ length: 26 }, (_, i) => {
  const left = Math.round(Math.random() * 100);
  const x = Math.round((Math.random() - 0.5) * 140);
  const r = Math.round((Math.random() - 0.5) * 720);
  const d = (0.4 + Math.random() * 0.6).toFixed(2);
  return `<i style="left:${left}%;background:${COLORS[i % COLORS.length]};--x:${x}px;--r:${r}deg;--d:${d}s"></i>`;
}).join("");

$("#main").innerHTML = `
  <div class="xc-confetti" aria-hidden="true">${confetti}</div>
  <div class="xc-stage" aria-hidden="true">
    <div class="xc-av me">${face(profile?.type_code)}</div>
    <div class="xc-pop">
      <svg viewBox="0 0 74 74">
        <g class="spin"><path class="burst" d="${burstPath(37, 37, 37, 28, 12)}"/></g>
        <!-- 2枚のカードが重なって入れ替わる印 -->
        <rect class="ring" x="20" y="22" width="18" height="25" rx="3.5" transform="rotate(-12 29 34)"/>
        <rect class="ring" x="36" y="27" width="18" height="25" rx="3.5" transform="rotate(12 45 39)"/>
      </svg>
    </div>
    <div class="xc-av other">${face(other?.type_code)}</div>
  </div>

  <p class="xc-title"><b>${name}</b>と<br>カードを交換しました！</p>
  <p class="xc-lead">${isNew
    ? "お互いのコレクションに入りました。<br>カードを交換した相手には、裏面の登山スキルも見られます。"
    : "すでに交換済みの相手でした。<br>カードの内容を最新にしました。"}</p>

  <div class="xc-btns">
    ${other ? `<button class="btn sun" onclick="location.href='/u/${encodeURIComponent(partnerId)}'">${name}のカードを見る</button>` : ""}
    <button class="btn ghost" onclick="location.href='/collection.html'">コレクションを見る</button>
    <button class="btn flat" onclick="location.href='/mypage.html'">マイページへ</button>
  </div>`;

// ギザギザの星形（中心・外側の半径・内側の半径・とがりの数）
function burstPath(cx, cy, R, r, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const rad = i % 2 ? r : R;
    const a = (Math.PI * i) / n - Math.PI / 2;
    pts.push(`${(cx + Math.cos(a) * rad).toFixed(1)},${(cy + Math.sin(a) * rad).toFixed(1)}`);
  }
  return `M${pts.join("L")}Z`;
}

$("#loading").hidden = true;
$("#main").hidden = false;
</script>
</body>
</html>
