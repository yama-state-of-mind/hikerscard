<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ブロック中のユーザー｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  .b-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--paper); border-radius: 14px;
    box-shadow: var(--shadow-card); padding: 12px 15px; margin-bottom: 8px;
  }
  .b-item .av {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
    flex: none; background: #EDF3EF;
  }
  .b-item .av svg { width: 100%; height: 100%; display: block; }
  .b-item .bd { flex: 1; min-width: 0; }
  .b-item .nm { font-size: 13.5px; font-weight: 700; }
  .b-item .mt { font-size: 10.5px; color: var(--stone); margin-top: 1px; }
  .b-item button {
    flex: none; font-family: var(--font); font-size: 11.5px; font-weight: 700;
    color: var(--fjord); background: var(--paper);
    border: 1.4px solid var(--line); border-radius: 999px;
    padding: 7px 15px; cursor: pointer;
  }
  .b-item button:disabled { opacity: .4; }

  .b-empty {
    text-align: center; background: var(--paper);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 40px 24px; margin-top: 18px;
  }
  .b-empty p { font-size: 12.5px; color: #45564e; line-height: 2; }
</style>
</head>
<body>

<div class="wrap">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <p class="brand">ハイカーズ<span>カード</span></p>
    <h1>ブロック中のユーザー</h1>
    <p class="sub">
      ブロックを解除しても、消えた交換記録は戻りません。<br>
      もう一度繋がるには、改めて交換してください。
    </p>

    <div id="list" style="margin-top:18px"></div>
    <div id="msg" class="msg"></div>

    <button class="btn flat" id="back">もどる</button>
  </div>
</div>

<script src="./data.js"></script>
<script src="./characters.js"></script>

<script>
window.__showFatal = function (label, detail) {
  var el = document.getElementById("loading");
  if (!el) return;
  el.innerHTML = '<p class="msg error" style="text-align:left"><b>' + label + '</b><br>' +
                 String(detail).replace(/[<>&]/g, "") + '</p>';
  el.hidden = false;
};
window.addEventListener("error", (e) =>
  window.__showFatal("読み込みに失敗しました", (e.message || "") + " " + (e.filename || "")));
window.addEventListener("unhandledrejection", (e) =>
  window.__showFatal("エラーが発生しました", (e.reason && (e.reason.message || e.reason)) || ""));
</script>

<script type="module">
import { supabase, getUser } from "./supabase.js";
import { SILHOUETTE, esc } from "./card.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) {
  location.replace("./login.html");
  throw new Error("redirect");
}

const { data, error } = await supabase.rpc("get_my_blocks");

if (error) {
  window.__showFatal("読み込めませんでした", error.message);
  throw error;
}

let blocks = Array.isArray(data) ? data : [];

$("#loading").hidden = true;
$("#main").hidden = false;
draw();

function draw() {
  if (!blocks.length) {
    $("#list").innerHTML = `
      <div class="b-empty">
        <p>ブロック中のユーザーはいません。</p>
      </div>`;
    return;
  }

  $("#list").innerHTML = blocks.map((b) => {
    const diagnosed = !!b.type_code;
    return `
      <div class="b-item" data-id="${esc(b.public_id)}">
        <div class="av">${diagnosed ? characterSVG(b.type_code) : SILHOUETTE}</div>
        <div class="bd">
          <p class="nm">${esc(b.display_name)}</p>
          <p class="mt">No.${String(b.card_no).padStart(4, "0")}
            ・${fmtDate(b.blocked_at)} にブロック</p>
        </div>
        <button data-unblock="${esc(b.public_id)}">解除</button>
      </div>`;
  }).join("");
}

$("#list").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-unblock]");
  if (!btn) return;

  const id = btn.dataset.unblock;
  btn.disabled = true;
  btn.textContent = "解除中…";

  const { data, error } = await supabase.rpc("unblock_user", { p_public_id: id });

  if (error || !data?.ok) {
    btn.disabled = false;
    btn.textContent = "解除";
    const m = $("#msg");
    m.className = "msg error";
    m.textContent = "解除できませんでした：" + (error?.message ?? data?.reason ?? "");
    return;
  }

  blocks = blocks.filter((b) => b.public_id !== id);
  draw();

  const m = $("#msg");
  m.className = "msg success";
  m.textContent = "ブロックを解除しました。";
  setTimeout(() => { m.textContent = ""; m.className = "msg"; }, 2600);
});

$("#back").onclick = () => location.href = "./card.html";

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}
</script>
</body>
</html>
