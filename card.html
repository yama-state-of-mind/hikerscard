<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マイカード｜ハイカーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="ハイカーズカード">
<meta property="og:description" content="登山者の人となりを1枚のカードに。山で会った人とQRで交換できます。">
<meta property="og:image" content="/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
<style>
  .a2hs {
    background: var(--paper); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); padding: 14px 16px; margin-top: 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .a2hs img { width: 42px; height: 42px; border-radius: 12px; flex: none; }
  .a2hs .bd { flex: 1; min-width: 0; }
  .a2hs .t { font-size: 12.5px; font-weight: 900; }
  .a2hs .d { font-size: 11px; color: var(--stone); margin-top: 3px; line-height: 1.7; }
  .a2hs .close {
    flex: none; border: none; background: none; color: var(--stone);
    font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  .a2hs .go {
    font-family: var(--font); font-size: 11.5px; font-weight: 700;
    color: #fff; background: var(--pine); border: none; border-radius: 999px;
    padding: 6px 14px; margin-top: 8px; cursor: pointer;
  }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E3A31">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ハイカーズカード">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</head>
<body>

<div class="wrap has-hd">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>読み込んでいます…</p>
  </div>

  <div id="main" hidden>
    <div id="a2hs" class="a2hs" hidden></div>

    <div id="msg" class="msg"></div>

    <!-- 誰のカードか -->
    <div id="owner"></div>

    <!-- ヒーローカード -->
    <div id="hero"></div>

    <div id="tips"></div>

    <!-- 詳細セクション（山リスト → 踏破状況 → 登山タイプ診断 → SNS） -->
    <div id="details"></div>
  </div>
</div>

<script src="./data.js"></script>
<script src="./characters.js"></script>

<script type="module">
import { supabase, getUser, getMyProfile, applyPendingDiagnosis,
         applyPendingExchange, signOut } from "./supabase.js";
import { renderHeroCard, renderDetails, bindCardInteractions,
         renderOwnerBar, enableTilt, applyTheme, esc } from "./card.js";
import { renderBackFace, renderBackDetails, renderFlipCard, bindFlip } from "./card-back.js";
import { mountHeader } from "./header.js";

const $ = (s) => document.querySelector(s);

const user = await getUser();
if (!user) location.replace("./login.html");

let profile = await getMyProfile();
if (!profile) {
  $("#loading").innerHTML = `<p class="msg error">プロフィールを読み込めませんでした。</p>`;
  throw new Error("no profile");
}
if (!profile.onboarded_at) { location.replace("./start.html"); await new Promise(() => {}); }   // カードづくりがまだ

// シェアボタンが自分のURLをすぐ出せるよう、公開IDを渡しておく
mountHeader(signOut, { shareId: profile.public_id });

// 未ログインのまま受けた診断結果があれば反映
profile = await applyPendingDiagnosis(profile);

// 未ログインのまま開いた交換URLがあれば、ここで交換する
const justExchanged = await applyPendingExchange();
if (justExchanged) {
  location.replace(`/exchanged.html?p=${encodeURIComponent(justExchanged.partner)}&new=${justExchanged.isNew ? 1 : 0}`);
  await new Promise(() => {});
}

// 登った山・好きな山・登ってみたい山
const [climbedRes, wishRes, cntRes, colRes, backRes] = await Promise.all([
  supabase.from("climbed_mountains")
          .select("is_favorite, favorite_rank, mountains(name, meizan_rank, elevation)")
          .eq("user_id", user.id),
  supabase.from("wishlist_mountains")
          .select("mountains(name, meizan_rank, elevation)")
          .eq("user_id", user.id),
  supabase.rpc("meizan_counts", { p_user: user.id }),
  supabase.rpc("get_my_collection"),
  // 裏面は、交換した相手から見えるのと同じ内容（表示オンの項目だけ）で出す
  supabase.rpc("get_card_back", { p_public_id: profile.public_id }),
]);

// クエリが失敗していたら、黙って空にせず画面に出す
// （列やテーブルが無いとここに来る）
if (climbedRes.error) {
  window.__showFatal("登った山を読み込めませんでした", climbedRes.error.message);
  throw climbedRes.error;
}
if (wishRes.error) {
  console.warn("登ってみたい山を読み込めませんでした:", wishRes.error.message);
}

const byElev = (a, b) => (b.elevation ?? 0) - (a.elevation ?? 0);
const toTag = (m) => ({ name: m.name, rank: m.meizan_rank });

const climbedRows = (climbedRes.data ?? []).filter((r) => r.mountains);
const climbed = climbedRows.map((r) => r.mountains).sort(byElev).map(toTag);
// 登ってよかった山は順位順（1位〜5位）
const favorites = climbedRows.filter((r) => r.is_favorite)
  .map((r) => ({ ...toTag(r.mountains), pos: r.favorite_rank, elevation: r.mountains.elevation }))
  .sort((a, b) => (a.pos ?? 99) - (b.pos ?? 99) || byElev(a, b));
const wishlist = (wishRes.data ?? []).map((r) => r.mountains)
                             .filter(Boolean).sort(byElev).map(toTag);

// 踏破数はDBの集計を使う（数え方を1か所にまとめるため）
const counts = cntRes.data ?? { "100": 0, "200": 0, "300": 0, other: 0 };

// 公開設定がオンのランクだけカードに載せる
const ranks = {};
if (profile.vis_rank_100) ranks["100"] = counts["100"];
if (profile.vis_rank_200) ranks["200"] = counts["200"];
if (profile.vis_rank_300) ranks["300"] = counts["300"];
if (profile.vis_rank_other !== false) ranks.other = counts.other;

// カードに渡す形に整える
const cardData = {
  public_id: profile.public_id,
  card_no: profile.card_no,
  display_name: profile.display_name,
  comment: profile.comment,
  type_code: profile.type_code,
  axes: {
    pe: profile.axis_pe, sg: profile.axis_sg,
    lf: profile.axis_lf, ca: profile.axis_ca,
  },
  card_bg: profile.card_bg,
  ranks,
  climbed,
  favorites,
  wishlist,
  sns: {
    yamap: profile.sns_yamap, yamareco: profile.sns_yamareco,
    instagram: profile.sns_instagram, x: profile.sns_x,
  },
};

// 交換した相手と同じ山を選んでいるかを調べる
// { 山名: ["たくみ", "green_mt"] } の形にする
function buildOverlaps(key) {
  const map = {};
  for (const c of (colRes.data ?? [])) {
    for (const m of (c[key] ?? [])) {
      (map[m.name] ??= []).push({ name: c.display_name, public_id: c.public_id });
    }
  }
  return map;
}
const overlaps = {
  favorites: buildOverlaps("favorites"),
  wishlist:  buildOverlaps("wishlist"),
};

const diagnosed = !!profile.type_code;

// テーマをページ全体に反映してから描く
applyTheme(profile.card_bg);

const cardOpts = {
  charSVG: diagnosed ? characterSVG(profile.type_code) : "",
  animal:  diagnosed ? CHARACTERS[profile.type_code]?.animal : "",
  typeName: diagnosed ? TYPES[profile.type_code]?.name : "",
  features: diagnosed ? TYPES[profile.type_code]?.features : "",
  caution:  diagnosed ? TYPES[profile.type_code]?.caution  : "",
  overlaps,
  own: true,
};

$("#owner").innerHTML = renderOwnerBar("own", cardData);
$("#hero").innerHTML = renderFlipCard(
  renderHeroCard(cardData, { ...cardOpts, flipBtn: true }),
  renderBackFace(cardData, backRes.data, { own: true }));
enableTilt($("#flip"));
bindFlip();
// カードの下：表面のときは各項目、裏返したら各スキルの詳しい説明
$("#details").innerHTML = `
  <div data-side="front">${renderDetails(cardData, cardOpts)}</div>
  <div data-side="back" hidden>${renderBackDetails(backRes.data, { own: true })}</div>`;
bindCardInteractions();

// 足りないものがあれば案内を出す
const tips = [];
// 診断が未完了のときの案内は、カードの中に「（未診断）」として出している
if (!climbed.length) {
  tips.push(`<div class="hc-empty">
    <p>登った山がまだ登録されていません。<br>百名山から選ぶと、踏破リングが動きます。</p>
    <button class="btn ghost" style="margin-top:12px" data-go="./mountains.html">山を登録する</button>
  </div>`);
}
$("#tips").innerHTML = tips.join("");
$("#tips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (b) location.href = b.dataset.go;
});


$("#loading").hidden = true;
$("#main").hidden = false;

// =============================================
// ホーム画面への追加を案内する
//
// Androidは「インストールしますか」の案内が自動で出るので、
// そのタイミングを捕まえてボタンにする。
// iPhoneは自動で出ないため、手順を文章で案内する。
//
// 一度閉じたら二度と出さない（しつこくしない）
// =============================================
(function setupA2HS() {
  const box = $("#a2hs");
  const standalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  // すでにアプリとして起動している、または以前閉じた場合は出さない
  if (standalone || localStorage.getItem("a2hsDismissed")) return;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  let deferred = null;

  function show(inner) {
    box.innerHTML = `
      <img src="/icons/icon-192.png" alt="">
      <div class="bd">${inner}</div>
      <button class="close" aria-label="閉じる">&times;</button>`;
    box.hidden = false;

    box.querySelector(".close").onclick = () => {
      box.hidden = true;
      localStorage.setItem("a2hsDismissed", "1");
    };

    const go = box.querySelector(".go");
    if (go) go.onclick = async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
      box.hidden = true;
      localStorage.setItem("a2hsDismissed", "1");
    };
  }

  // Android / PC版Chromeなど
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferred = e;
    show(`
      <p class="t">ホーム画面に追加できます</p>
      <p class="d">アプリとして開けるようになり、QRをすぐ出せます。</p>
      <button class="go">追加する</button>`);
  });

  // iPhone
  if (isIOS) {
    show(`
      <p class="t">ホーム画面に追加できます</p>
      <p class="d">下の共有ボタン → 「ホーム画面に追加」で、<br>
      アプリとして開けるようになります。</p>`);
  }
})();

</script>
</body>
</html>
